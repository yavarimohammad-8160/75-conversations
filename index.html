 step if we want to succeed.", "حتماً. همه به هدفی نیاز داریم که خودمان را به سمتش برانیم. هدف گذاشتن گام لازم برای موفق شدن است."], ["What are the important qualities to achieve goals?", "ویژگی‌های مهم برای رسیدن به هدف چیست؟", "You need to be persistent in what you desire. Commitment and patience are needed too.", "باید در آنچه می‌خواهید پیگیر باشید. تعهد و صبر هم لازم است."]], "vocab": [["be determined to", "مصمم بودن به", "I'm determined to get a scholarship."], ["scholarship", "بورس تحصیلی", "get a scholarship to study abroad."], ["postgraduate", "تحصیلات تکمیلی", "بعد از کارشناسی. graduate studies هم می‌گویند."], ["set a goal", "هدف گذاشتن", "it's important to set goals."], ["persistent", "پیگیر", "be persistent. اسم persistence."], ["commitment", "تعهد", "Commitment and patience are needed."]], "grammar": "haven't found حال کامل منفی برای نتیجه تا حالا. drive ourselves towards them: towards یا toward هر دو درست است."}, {"id": "l61", "n": 61, "en": "Art", "fa": "هنر", "qa": [["What's your favorite work of art?", "اثر هنری مورد علاقه‌تان چیست؟", "There's a special photograph named The Napalm Girl.", "عکس خاصی هست به نام دختر ناپالم."], ["When did you see it?", "کی آن را دیدید؟", "I accidentally saw it 5 years ago, when I traveled to Vietnam.", "۵ سال پیش اتفاقی دیدمش، وقتی به ویتنام سفر کردم."], ["Where did you see it?", "کجا آن را دیدید؟", "In the Museum of Vietnamese History. The photo was solemnly hung in an eye-catching position.", "در موزهٔ تاریخ ویتنام. عکس با وقار در جای چشمگیر آویزان شده بود."], ["Why do you like it?", "چرا دوستش دارید؟", "The photo captured a naked 9-year-old girl running away from a napalm attack, which is really touching.", "عکس دختر ۹ سالهٔ برهنه‌ای را ثبت کرده که از حملهٔ ناپالم فرار می‌کند و واقعاً تکان‌دهنده است."], ["What's special about it?", "چه چیز خاصی دارد؟", "Thanks to the photo, the photographer was awarded the Pulitzer Prize for Spot News Photography.", "به‌خاطر این عکس، عکاس جایزهٔ پولیتزر عکاسی خبری فوری را گرفت."], ["Do your friends like it too?", "دوستانتان هم آن را دوست دارند؟", "Yes, they do. The photo touched their souls too.", "بله. عکس روح آن‌ها را هم لمس کرد."], ["Do you want to be an artist?", "می‌خواهید هنرمند شوید؟", "No, although I'm quite interested in art.", "نه، هرچند به هنر نسبتاً علاقه‌مندم."], ["What qualities does a person need to be an artist?", "برای هنرمند شدن چه ویژگی‌ای لازم است؟", "An artist needs to be creative and sensitive to things around them, I think.", "فکر می‌کنم هنرمند باید خلاق و نسبت به چیزهای اطراف حساس باشد."], ["How do children develop their talent for art?", "کودکان استعداد هنری‌شان را چطور پرورش می‌دهند؟", "Children's talent for art should be recognized and nurtured as early as possible so that they can reach their full potential.", "استعداد هنری کودک باید هر چه زودتر شناخته و پرورش داده شود تا به ظرفیت کاملشان برسند."]], "vocab": [["work of art", "اثر هنری", "a work of art. جمع works of art."], ["eye-catching", "چشمگیر", "an eye-catching position."], ["touching", "تکان‌دهنده", "which is really touching. صفت از فعل touch."], ["thanks to", "به‌خاطر، به لطف", "Thanks to the photo. دلیل مثبت یا خنثی."], ["be awarded", "جایزه گرفتن", "مجهول. was awarded the Pulitzer Prize."], ["nurture", "پرورش دادن", "talent should be nurtured."]], "grammar": "so that برای هدف است: so that they can reach their potential. as early as possible یعنی در اولین زمان ممکن."}, {"id": "l62", "n": 62, "en": "Fashion", "fa": "مد", "qa": [["Are you a big fan of fashion?", "طرفدار پرشور مد هستید؟", "Yes, I am. I believe every girl is crazy about fashion.", "بله. باور دارم هر دختری شیفتهٔ مد است."], ["What style do you choose to wear?", "چه سبکی را برای پوشیدن انتخاب می‌کنید؟", "My favorite piece of clothing is a dress. Depending on the situation, I choose a formal or informal dress.", "لباس مورد علاقه‌ام پیراهن است. بسته به موقعیت، رسمی یا غیررسمی انتخاب می‌کنم."], ["Do you enjoy shopping for clothes?", "خرید لباس را دوست دارید؟", "Yes, I'm a shopaholic, actually.", "بله، در واقع خرید کردن برایم مثل اعتیاد است."], ["Is there any fashion icon whose style you want to wear?", "الگوی مدی هست که بخواهید مثل او بپوشید؟", "Yes, I really admire Taylor Swift and wish to dress like her.", "بله، تیلور سوئیفت را خیلی تحسین می‌کنم و دوست دارم مثل او بپوشم."], ["Do you create your own fashion style?", "سبک مد خودتان را می‌سازید؟", "No, I'm not a fashionista, so most of the time I just follow the fashion trend.", "نه، مدگرای حرفه‌ای نیستم، برای همین بیشتر وقت‌ها فقط دنبال روند مد می‌روم."], ["Do you prefer vintage or modern style? Why?", "سبک قدیمی را ترجیح می‌دهید یا مدرن؟ چرا؟", "Honestly, I love vintage style. Wearing classic clothes makes me feel special.", "صادقانه سبک قدیمی را دوست دارم. پوشیدن لباس کلاسیک حس خاص بودن می‌دهد."], ["Have you ever attended a fashion show?", "تا حالا به نمایش مد رفته‌اید؟", "Not in real life. I just watch them on TV.", "نه در واقعیت. فقط در تلویزیون می‌بینم."], ["What do people think about your fashion style?", "مردم دربارهٔ سبک لباس شما چه فکر می‌کنند؟", "I don't know exactly, and I don't care much about it. I just wear what makes me comfortable and confident.", "دقیقاً نمی‌دانم و زیاد برایم مهم نیست. فقط چیزی می‌پوشم که راحت و مطمئنم کند."], ["Are you going to change your fashion style in the future?", "در آینده سبک لباستان را عوض می‌کنید؟", "I can't tell. Maybe fashion is changeable, and I am too.", "نمی‌توانم بگویم. شاید مد عوض‌شدنی است و من هم همین‌طور."], ["Is fashion important to people?", "مد برای مردم مهم است؟", "Yes, in my opinion. Fashion can partly reveal who you are.", "به نظر من بله. مد تا حدی نشان می‌دهد که هستید."]], "vocab": [["fashion icon", "الگوی مد", "someone whose style people copy."], ["fashionista", "آدم خیلی اهل مد", "غیررسمی."], ["vintage", "قدیمیِ باارزش", "vintage style در برابر modern."], ["trend", "روند", "follow the fashion trend."], ["reveal", "آشکار کردن", "reveal who you are."], ["I can't tell", "نمی‌توانم بگویم", "برای وقتی جواب آینده نامعلوم است."]], "grammar": "wish to dress like her: wish to + فعل برای علاقه. whose style you want ساختار موصولی برای مالکیت است."}, {"id": "l63", "n": 63, "en": "Jewelry", "fa": "جواهرات", "qa": [["What's your favorite item of jewelry?", "جواهر مورد علاقه‌تان چیست؟", "I have quite a lot of ornaments, but my favorite is a necklace.", "زیور نسبتاً زیاد دارم، ولی مورد علاقه‌ام یک گردنبند است."], ["When did you buy it?", "کی خریدیدش؟", "I don't remember exactly, but I guess I bought it years ago.", "دقیقاً یادم نیست، ولی حدس می‌زنم سال‌ها پیش خریدم."], ["What's it made of?", "از چه ساخته شده؟", "It's made of silver.", "از نقره ساخته شده."], ["How does it look?", "قیافه‌اش چطور است؟", "It looks gorgeous, with a ruby clover-shaped pendant.", "باشکوه است، با آویز یاقوتی به شکل شبدر."], ["Why do you like it?", "چرا دوستش دارید؟", "I believe it can bring me good luck in everything I do.", "باور دارم در هر کاری خوش‌شانسی می‌آورد."], ["What's special about it?", "چه چیز خاصی دارد؟", "I love the vintage style of my necklace. It really goes with my classic dresses.", "سبک قدیمی گردنبندم را دوست دارم. واقعاً با پیراهن‌های کلاسیکم جور است."], ["Does it remind you of something?", "چیزی را یادتان می‌آورد؟", "Yes. I spent my first month's salary buying it, so the necklace encourages me to work hard and earn more money.", "بله. اولین حقوق ماهانه‌ام را برای خریدش دادم، برای همین گردنبند تشویقم می‌کند سخت کار کنم و پول بیشتری دربیاورم."], ["How much does it cost?", "چقدر قیمت دارد؟", "Around $400, if I'm not mistaken.", "حدود ۴۰۰ دلار، اگر اشتباه نکنم."], ["Do you usually wear it?", "معمولاً آن را می‌پوشید؟", "Yes, I wear it all the time. I'll miss it if I don't see it.", "بله، همیشه می‌پوشمش. اگر نبینمش دلتنگش می‌شوم."]], "vocab": [["be made of", "از چیزی ساخته شدن", "made of برای مادهٔ قابل دیدن. made from اگر ماده عوض شده باشد."], ["pendant", "آویز گردنبند", "a clover-shaped pendant."], ["go with", "جور بودن با", "It goes with my dresses."], ["if I'm not mistaken", "اگر اشتباه نکنم", "عبارت نرم برای عدد نامطمئن."], ["all the time", "همیشه", "I wear it all the time."], ["charming / gorgeous", "دلربا / باشکوه", "واژهٔ حاشیه. gorgeous قوی‌تر از beautiful است."]], "grammar": "made of silver نه made from silver، چون نقره هنوز قابل دیدن است. spend money doing: spent my salary buying it."}, {"id": "l64", "n": 64, "en": "Cosmetics", "fa": "لوازم آرایشی", "qa": [["What's your favorite cosmetic item?", "لوازم آرایشی مورد علاقه‌تان چیست؟", "My favorite cosmetic item is a cherry-red lipstick.", "مورد علاقه‌ام رژ لب قرمز آلبالویی است."], ["Where did you buy it?", "کجا خریدیدش؟", "I bought it in a local cosmetics shop.", "در یک فروشگاه آرایشی محلی.", "Where did you buy it?", "متن اصلی سؤال when نوشته ولی جواب where داده. سؤال را با جواب جور کردم."], ["How often do you use it?", "چند وقت یک‌بار از آن استفاده می‌کنید؟", "Almost every day. I sometimes change the color.", "تقریباً هر روز. گاهی رنگ را عوض می‌کنم."], ["How did it change your physical appearance?", "ظاهر فیزیکی‌تان را چطور عوض کرد؟", "At first I was hesitant to try it because I thought it wouldn't match my skin undertone, but when I put it on, the cherry-red color made me more charming.", "اول برای امتحان مردد بودم چون فکر می‌کردم با ته رنگ پوستم جور نیست، ولی وقتی زدم، رنگ آلبالویی جذاب‌ترم کرد."], ["Is it expensive?", "گران است؟", "No. It is under $21.", "نه. زیر ۲۱ دلار است."], ["Is the brand name famous?", "نام برند معروف است؟", "Yes, I think so. M.A.C is well known all around the world. M.A.C lipstick is an iconic product of the producer.", "فکر می‌کنم بله. مک در سراسر جهان شناخته‌شده است. رژ مک محصول نمادین سازنده است."], ["How important are cosmetics, according to you?", "به نظر شما لوازم آرایشی چقدر مهم است؟", "Frankly, cosmetics are really important to many women, although I agree that true beauty comes from inside.", "رک بگویم، لوازم آرایشی برای خیلی از زن‌ها واقعاً مهم است، هرچند قبول دارم زیبایی واقعی از درون می‌آید."], ["Is it important to have a good-looking appearance?", "ظاهر خوب مهم است؟", "Sure. You may be given more opportunities if you're good-looking.", "حتماً. اگر خوش‌قیافه باشید ممکن است فرصت بیشتری به شما داده شود."], ["Are cosmetics harmful?", "لوازم آرایشی ضرر دارد؟", "Yes, I guess. Some toxic chemicals in cosmetics may cause skin cancer.", "حدس می‌زنم بله. بعضی مواد سمی در لوازم آرایشی ممکن است سرطان پوست ایجاد کند."], ["Do you think beauty products are a waste of money?", "فکر می‌کنید محصولات زیبایی هدر دادن پول است؟", "Not really, as for me. I just spend my savings on cosmetics.", "برای من نه واقعاً. فقط از پول پس‌اندازم برای لوازم آرایشی خرج می‌کنم."]], "vocab": [["hesitant to", "مردد برای", "I was hesitant to try. بعد از hesitant to + فعل."], ["undertone", "ته‌رنگ پوست", "match my skin undertone."], ["iconic", "نمادین", "an iconic product."], ["frankly / honestly", "رک و راست", "واژهٔ حاشیه. Frankly, ..."], ["toxic", "سمی", "toxic chemicals."], ["a waste of money", "هدر دادن پول", "Are they a waste of money?"]], "grammar": "although I agree that... تضاد را در همان جمله نگه می‌دارید. may cause برای احتمال، نه قطعیت."}, {"id": "l65", "n": 65, "en": "Indoor Game", "fa": "بازی داخل سالن", "qa": [["What indoor game do you like to play?", "چه بازی داخل سالنی دوست دارید؟", "I'm fond of playing bowling.", "بولینگ را دوست دارم."], ["When did you start playing it?", "کی شروع به بازی کردید؟", "I've just started bowling. It's been 3 weeks so far.", "تازه بولینگ را شروع کرده‌ام. تا حالا ۳ هفته شده."], ["Who do you play it with?", "با چه کسی بازی می‌کنید؟", "Most of the time I play with my friends when we hang out. Sometimes I also go bowling with my cousins.", "بیشتر وقت‌ها وقتی با دوستان بیرونم با آن‌ها بازی می‌کنم. گاهی با پسرعموها هم بولینگ می‌روم."], ["Where do you play?", "کجا بازی می‌کنید؟", "At a nearby shopping mall. There is an entertainment area where people can play various games.", "در مرکز خرید نزدیک. فضای تفریحی هست که مردم بازی‌های گوناگون می‌کنند."], ["Is it easy to play?", "بازی کردنش آسان است؟", "Yes, quite easy. The bowler has to knock down as many pins as possible, ideally all of them.", "بله، نسبتاً آسان. بولینگ‌باز باید تا می‌تواند پین را بیندازد، ایدئال همه را."], ["Are you usually the winner?", "معمولاً برنده هستید؟", "No, because I'm just a beginner. My friends are much more experienced.", "نه، چون تازه مبتدی‌ام. دوستانم خیلی باتجربه‌ترند."], ["Why do you like it?", "چرا دوستش دارید؟", "Going bowling is quite enjoyable. I love it when my friends cheer me up.", "بولینگ رفتن نسبتاً لذت‌بخش است. دوست دارم دوستان تشویقم کنند."], ["Is it popular in your country?", "در کشور شما محبوب است؟", "Yes, people play almost everywhere. There are nearly 3,000 bowling centers in my country.", "بله، مردم تقریباً همه‌جا بازی می‌کنند. نزدیک ۳۰۰۰ مرکز بولینگ در کشورم هست."], ["What are other indoor games in your country?", "بازی‌های داخل سالن دیگر در کشور شما چیست؟", "There are many, such as board games, table tennis, squash, boxing and so on.", "زیاد است، مثل بازی رومیزی، تنیس روی میز، اسکواش، بوکس و مانند این‌ها."]], "vocab": [["I've just started", "تازه شروع کرده‌ام", "just با حال کامل برای کار اخیر."], ["It's been 3 weeks", "۳ هفته شده", "حال کامل برای مدت از شروع تا حالا."], ["knock down", "به زمین انداختن", "knock down pins."], ["as many as possible", "هر چه بیشتر", "as many pins as possible."], ["beginner", "مبتدی", "I'm just a beginner."], ["board game", "بازی رومیزی", "مثل شطرنج و منچ."]], "grammar": "bowling را بعضی indoor نمی‌دانند، ولی در کتاب همین‌طور آمده. as many as possible ساختار مقایسهٔ برابری برای تعداد است."}, {"id": "l66", "n": 66, "en": "Phone Conversation", "fa": "مکالمهٔ تلفنی", "qa": [["Do you usually talk on the phone?", "معمولاً پای تلفن حرف می‌زنید؟", "Yes, I do. It's a good way to keep in touch.", "بله. راه خوبی برای در تماس ماندن است."], ["What was your favorite phone conversation?", "محبوب‌ترین مکالمهٔ تلفنی‌تان چه بود؟", "It was when I talked to my interviewer. He gave me the good news that I got the job.", "وقتی با مصاحبه‌کننده حرف زدم. خبر خوب را داد که شغل را گرفته‌ام."], ["When did you have the conversation?", "مکالمه کی بود؟", "I don't remember exactly, but it's been 2 years, I guess.", "دقیقاً یادم نیست، ولی حدس می‌زنم ۲ سال شده."], ["Who did you talk to?", "با چه کسی حرف زدید؟", "I talked to the owner of the restaurant where I work as a cashier.", "با صاحب رستورانی حرف زدم که آنجا صندوق‌دارم."], ["What did you talk about?", "دربارهٔ چه حرف زدید؟", "He offered me the position and congratulated me.", "سمت را پیشنهاد کرد و تبریک گفت."], ["Why did you find the conversation interesting?", "چرا مکالمه را جالب دیدید؟", "Actually, it was more exciting than interesting. I had been waiting for it for so long, and finally he made it come true.", "در واقع بیشتر هیجان‌انگیز بود تا جالب. مدت‌ها منتظرش بودم و بالاخره آن را واقعی کرد."], ["Do you prefer talking directly or talking on the phone?", "رو در رو حرف زدن را ترجیح می‌دهید یا تلفنی؟", "Personally, talking directly is much better for me, since it's more lively and authentic.", "شخصاً رو در رو برایم خیلی بهتر است، چون زنده‌تر و واقعی‌تر است."], ["Who do you usually talk to on the phone?", "معمولاً پای تلفن با چه کسی حرف می‌زنید؟", "I talk to my mom almost every day. I'll miss the evening conversation with Mom if one day she stops calling me.", "تقریباً هر روز با مادرم حرف می‌زنم. اگر یک روز زنگ نزند، دلتنگ مکالمهٔ عصر می‌شوم."], ["What are the differences between talking directly and phoning?", "فرق حرف رو در رو و تلفنی چیست؟", "Talking directly seems more exciting, since you can see facial expressions and eye contact, while on the phone you can only listen to the voice.", "رو در رو هیجان‌انگیزتر به نظر می‌رسد، چون حالت چهره و تماس چشمی را می‌بینید، در حالی که پای تلفن فقط صدا را می‌شنوید."]], "vocab": [["interviewer", "مصاحبه‌کننده", "کسی که مصاحبه می‌گیرد. interviewee مصاحبه‌شونده."], ["cashier", "صندوق‌دار", "work as a cashier."], ["offer someone the position", "سمت را به کسی پیشنهاد کردن", "He offered me the position."], ["facial expression", "حالت چهره", "see facial expressions."], ["eye contact", "تماس چشمی", "eye contact while talking."], ["personally", "شخصاً", "برای شروع نظر شخصی."]], "grammar": "more exciting than interesting مقایسهٔ دو صفت است. had been waiting گذشتهٔ کامل استمراری برای انتظار پیش از خبر."}, {"id": "l67", "n": 67, "en": "Learning a Second Language", "fa": "یادگیری زبان دوم", "qa": [["Do you like learning languages?", "یادگیری زبان را دوست دارید؟", "Yes, I do. I love traveling and talking to local people in their mother tongue.", "بله. سفر و حرف زدن با مردم محلی به زبان مادری‌شان را دوست دارم."], ["What is your mother language?", "زبان مادری‌تان چیست؟", "I speak English.", "انگلیسی حرف می‌زنم."], ["What second language are you learning?", "زبان دومتان چیست؟", "I'm learning Spanish. I fell in love with Spanish when I traveled to Spain last year.", "اسپانیایی یاد می‌گیرم. پارسال که به اسپانیا رفتم عاشق اسپانیایی شدم."], ["Is that language popular in your country?", "آن زبان در کشور شما محبوب است؟", "Yes. People in my country come from every corner of the world, and Spanish is the second most popular language spoken here, according to the statistics.", "بله. مردم کشورم از هر گوشهٔ دنیا آمده‌اند و طبق آمار اسپانیایی دومین زبان پرگویش اینجا است."], ["How often do you use that language?", "چند وقت یک‌بار از آن زبان استفاده می‌کنید؟", "Quite a lot. I see Spanish-speaking people every day in the restaurant, bank or supermarket.", "نسبتاً زیاد. هر روز در رستوران، بانک یا سوپرمارکت آدم اسپانیایی‌زبان می‌بینم."], ["How long have you been learning that language?", "چقدر است آن زبان را یاد می‌گیرید؟", "I've been learning it for 5 years. I'm in an advanced class now.", "۵ سال است یاد می‌گیرم. حالا در کلاس پیشرفته‌ام."], ["Why do you choose to learn that language?", "چرا آن زبان را برای یادگیری انتخاب می‌کنید؟", "I'm interested in Spanish culture, and I'd like to use the language as a tool to discover Spanish cultural values.", "به فرهنگ اسپانیایی علاقه‌مندم و می‌خواهم زبان را ابزار کشف ارزش‌های فرهنگی اسپانیا کنم."], ["Who is your teacher?", "معلم‌تان کیست؟", "An older Spanish teacher. She can also speak English fluently.", "معلم اسپانیایی مسن‌تر. او هم انگلیسی را روان حرف می‌زند."], ["Why do people learn a second language?", "چرا مردم زبان دوم یاد می‌گیرند؟", "There are many purposes. Some learn to do business, some learn to travel, and some just learn for fun.", "هدف زیاد است. بعضی برای کسب‌وکار، بعضی برای سفر، و بعضی فقط برای لذت."]], "vocab": [["mother tongue", "زبان مادری", "in their mother tongue. mother language هم گفته می‌شود."], ["every corner of the world", "هر گوشهٔ دنیا", "come from every corner of the world."], ["according to", "طبق", "according to the statistics."], ["advanced", "پیشرفته", "an advanced class. elementary مقدماتی، intermediate متوسط."], ["fluently", "روان", "speak English fluently."], ["for fun", "برای لذت", "learn for fun."]], "grammar": "the second most popular عالیِ ترتیبی است. have been learning for 5 years حال کامل استمراری برای فعالیت ادامه‌دار."}, {"id": "l68", "n": 68, "en": "Creative Person", "fa": "فرد خلاق", "qa": [["Who is the creative person that you admire?", "فرد خلاقی که تحسین می‌کنید کیست؟", "I really admire Mr. Tom, who is an extremely creative Math teacher.", "آقای تام را واقعاً تحسین می‌کنم که معلم ریاضی فوق‌العاده خلاقی است."], ["Why do you admire him?", "چرا تحسینش می‌کنید؟", "For me, Math is quite boring because I have to work with long numbers. I used to hate Math before I had lessons with Mr. Tom. He has thousands of ways to teach that boring subject, which inspires me a lot.", "برای من ریاضی نسبتاً کسل‌کننده است چون باید با عددهای طولانی کار کنم. پیش از کلاس آقای تام از ریاضی متنفر بودم. او هزار راه برای درس دادن آن موضوع کسل‌کننده دارد و خیلی الهام‌بخش من است."], ["How did he become so creative?", "چطور این‌قدر خلاق شد؟", "I'm not quite sure, but I think that's his inborn talent.", "کاملاً مطمئن نیستم، ولی فکر می‌کنم استعداد ذاتی‌اش است."], ["Do people you know admire him too?", "آدم‌هایی که می‌شناسید هم تحسینش می‌کنند؟", "Of course. All my classmates love and respect him for his creative teaching.", "البته. همهٔ هم‌کلاسی‌هایم به‌خاطر تدریس خلاقانه‌اش دوستش دارند و احترامش می‌گذارند."], ["What is he like?", "او چه جور آدمی است؟", "He has a good sense of humor. He always tells jokes, and we just can't help laughing.", "شوخ‌طبعی خوبی دارد. همیشه جوک می‌گوید و ما نمی‌توانیم نخندیم."], ["Do you think creativity can be learned and practiced?", "فکر می‌کنید خلاقیت آموختنی و تمرین‌کردنی است؟", "Yes, I definitely do. Creativity, like any other quality, can be trained.", "بله، قطعاً. خلاقیت مثل هر ویژگی دیگر قابل پرورش است."], ["How is creativity important in study or work?", "خلاقیت در درس یا کار چه اهمیتی دارد؟", "It generates energy and makes things more inspiring. Without creativity, work and study are just dull and tiring.", "انرژی تولید می‌کند و چیزها را الهام‌بخش‌تر می‌کند. بدون خلاقیت، کار و درس فقط کسل‌کننده و خسته‌کننده‌اند."]], "vocab": [["inborn talent", "استعداد ذاتی", "that's his inborn talent."], ["sense of humor", "شوخ‌طبعی", "a good sense of humor."], ["can't help + -ing", "نمی‌تواند جلوی خود را بگیرد", "can't help laughing."], ["inspire", "الهام دادن", "which inspires me. صفت inspiring."], ["dull", "کسل‌کننده", "dull and tiring. مترادف boring."], ["without", "بدون", "Without creativity, work is dull. جملهٔ اسمی بعد از without."]], "grammar": "can't help laughing ساختار ثابت است؛ help اینجا یعنی جلوی خود را گرفتن. used to hate برای نفرت گذشته که حالا نیست."}, {"id": "l69", "n": 69, "en": "Celebrity", "fa": "فرد مشهور", "qa": [["Who is a famous celebrity that you admire?", "مشهور مورد تحسین شما کیست؟", "I'm a big fan of Miley Ray Cyrus, an American singer, songwriter and actress.", "طرفدار پرشور مایلی ری سایرِس‌ام؛ خواننده، ترانه‌سرا و بازیگر آمریکایی."], ["Why do you admire her?", "چرا تحسینش می‌کنید؟", "She's about my age, but what she's achieved is acknowledged worldwide.", "تقریباً هم‌سن من است، ولی آنچه به دست آورده در جهان شناخته شده."], ["What is special about her?", "چه چیز خاصی دارد؟", "I just fall in love with her beautiful voice. I can't stop listening to her songs again and again. My favorite songs of hers are Jolene and Wrecking Ball.", "عاشق صدای زیبایش می‌شوم. نمی‌توانم از شنیدن دوباره و دوبارهٔ آهنگ‌هایش دست بکشم. آهنگ‌های مورد علاقه‌ام از او جولین و رکینگ بال است."], ["Is she well known worldwide?", "در جهان شناخته‌شده است؟", "Yes, she is. She's a teen idol.", "بله. بت نوجوان‌هاست."], ["Do you see her on TV or in reality?", "در تلویزیون می‌بینیدش یا در واقعیت؟", "Most of the time I see her on TV.", "بیشتر وقت‌ها در تلویزیون."], ["Do your friends love her too?", "دوستانتان هم دوستش دارند؟", "Yes, they do. We usually enjoy her songs and movies together.", "بله. معمولاً آهنگ و فیلم‌هایش را با هم می‌بینیم."], ["Do you want to be like her?", "می‌خواهید مثل او باشید؟", "Yes, being a well-known singer is my dream.", "بله، خوانندهٔ شناخته‌شده شدن رؤیای من است."]], "vocab": [["acknowledge", "به‌رسمیت شناختن", "what she's achieved is acknowledged worldwide."], ["worldwide", "در سراسر جهان", "قید و صفت. acknowledged worldwide."], ["teen idol", "بت نوجوان‌ها", "She's a teen idol."], ["again and again", "دوباره و دوباره", "listening again and again."], ["of hers", "مال او", "songs of hers = her songs، با تأکید مالکیت."], ["well-known", "شناخته‌شده", "قبل از اسم خط تیره: a well-known singer."]], "grammar": "what she's achieved جملهٔ اسمی فاعل است. being a singer is my dream: -ing به‌عنوان فاعل."}, {"id": "l70", "n": 70, "en": "Health Problem", "fa": "مشکل سلامتی", "qa": [["What health problem did you have?", "چه مشکل سلامتی داشتید؟", "I had measles when I was 18.", "در ۱۸ سالگی سرخک گرفتم."], ["How did you have that health problem?", "آن مشکل را چطور گرفتید؟", "I thought I caught measles from someone when they coughed or sneezed.", "فکر می‌کردم سرخک را از کسی گرفتم وقتی سرفه یا عطسه کرد."], ["Was that serious?", "جدی بود؟", "Not really, but it was unpleasant. I recovered after 10 days at home.", "نه واقعاً، ولی ناخوشایند بود. بعد از ۱۰ روز در خانه خوب شدم."], ["What were some symptoms of that health problem?", "بعضی نشانه‌های آن مشکل چه بود؟", "I had a cold and fever with a cough and a runny nose. Small grayish-white spots appeared on my body too.", "سرماخوردگی و تب با سرفه و آبریزش بینی داشتم. لکه‌های کوچک سفید مایل به خاکستری هم روی بدنم ظاهر شد."], ["Did you take any medical treatment?", "درمان پزشکی کردید؟", "No, I didn't. The situation wasn't serious enough to be sent to hospital.", "نه. وضع آن‌قدر جدی نبود که به بیمارستان بروم."], ["How could you recover from it?", "چطور از آن خوب شدید؟", "I drank a lot of water, avoided direct light, and I had to stay off school for 10 days.", "آب زیاد خوردم، از نور مستقیم دوری کردم و ۱۰ روز مدرسه نرفتم."], ["What difficulties did you face because of that problem?", "به‌خاطر آن مشکل با چه سختی‌ای روبه‌رو شدید؟", "I couldn't go out for a few days, which was boring. I wasn't allowed to play outside and I felt bad about it.", "چند روز نتوانستم بیرون بروم و این کسل‌کننده بود. اجازه نداشتم بیرون بازی کنم و از این بابت حالم بد بود."], ["What do people do to prevent that health problem?", "مردم برای پیشگیری از آن مشکل چه می‌کنند؟", "They have the measles vaccine.", "واکسن سرخک می‌زنند."], ["Is that health problem common in your country?", "آن مشکل در کشور شما رایج است؟", "Not really, due to the effectiveness of vaccination.", "نه واقعاً، به‌خاطر اثربخشی واکسیناسیون."]], "vocab": [["catch a disease", "بیماری گرفتن", "caught measles. have measles هم درست است."], ["symptom", "نشانهٔ بیماری", "symptoms of measles."], ["runny nose", "آبریزش بینی", "a cough and a runny nose."], ["recover from", "از بیماری خوب شدن", "recover from it."], ["stay off school", "به مدرسه نرفتن", "stay off school for 10 days."], ["vaccination", "واکسیناسیون", "due to the effectiveness of vaccination. vaccine اسم واکسن است."]], "grammar": "wasn't serious enough to be sent: enough بعد از صفت، و to + فعل برای نتیجه. which was boring به کل وضعیت قبل برمی‌گردد."}, {"id": "l71", "n": 71, "en": "Technological Advancements", "fa": "پیشرفت‌های فناوری", "qa": [["Are you a tech and gadget lover?", "عاشق فناوری و گجت هستید؟", "Yes, I am. I love shopping for new gadgets.", "بله. خرید گجت نو را دوست دارم."], ["What is an important technological advancement you know?", "پیشرفت فناوری مهمی که می‌شناسید چیست؟", "That's the emergence of online payment systems like credit cards or PayPal, thanks to the development of the Internet.", "پیدایش سیستم پرداخت آنلاین مثل کارت اعتباری یا پی‌پال، به لطف گسترش اینترنت."], ["What do you use it for?", "از آن برای چه استفاده می‌کنید؟", "I use these services to shop online. Now I can book flight tickets in advance without going to an agency.", "از این خدمات برای خرید آنلاین استفاده می‌کنم. حالا می‌توانم بلیت هواپیما را پیشاپیش رزرو کنم بدون اینکه به آژانس بروم."], ["How long have you been using it?", "چقدر است از آن استفاده می‌کنید؟", "I've been using these services for around 3 years.", "حدود ۳ سال است از این خدمات استفاده می‌کنم."], ["Does it make your life easier?", "زندگی‌تان را آسان‌تر می‌کند؟", "Sure. It's fast, simple and convenient.", "حتماً. سریع، ساده و راحت است."], ["How did it change your life?", "زندگی‌تان را چطور عوض کرد؟", "I can enjoy my life more. I can do plenty of things online, like shopping, transferring money and booking tickets.", "می‌توانم بیشتر از زندگی لذت ببرم. کلی کار آنلاین می‌کنم، مثل خرید، انتقال پول و رزرو بلیت."], ["How often do you use it?", "چند وقت یک‌بار از آن استفاده می‌کنید؟", "At least once a week.", "دست‌کم هفته‌ای یک بار."], ["What are other technological advancements you know?", "پیشرفت‌های فناوری دیگری که می‌شناسید چیست؟", "There are many: electricity, the smartphone, the Internet, robots and so on.", "زیاد است: برق، گوشی هوشمند، اینترنت، ربات و مانند این‌ها."]], "vocab": [["emergence", "پیدایش", "the emergence of online payment."], ["in advance", "از پیش", "book tickets in advance."], ["transfer money", "پول منتقل کردن", "transferring money."], ["once a week", "هفته‌ای یک بار", "at least once a week."], ["thanks to", "به لطف", "thanks to the development of the Internet."], ["plenty of", "مقدار زیاد", "plenty of things."]], "grammar": "without going: بعد از without فعل -ing. have been using for 3 years باز هم حال کامل استمراری."}, {"id": "l72", "n": 72, "en": "Landmark", "fa": "نماد شهری", "qa": [["What is a famous landmark in your hometown?", "نماد معروف زادگاهتان چیست؟", "I can't hide how proud I am to talk about the Statue of Liberty.", "نمی‌توانم پنهان کنم چقدر افتخار می‌کنم از مجسمهٔ آزادی حرف بزنم."], ["When was it built?", "کی ساخته شد؟", "I read in the newspapers that it was constructed in 1886.", "در روزنامه خواندم که سال ۱۸۸۶ ساخته شد."], ["Where is it?", "کجاست؟", "It's located on Liberty Island in New York Harbor.", "در جزیرهٔ آزادی در بندر نیویورک."], ["What does it look like?", "قیافه‌اش چطور است؟", "It's a woman, known as a Roman goddess, bearing a torch, and a broken chain lies at her feet.", "زنی است، معروف به الههٔ رومی، که مشعلی در دست دارد و زنجیر شکسته‌ای پای اوست."], ["What was it made of?", "از چه ساخته شده بود؟", "The main material was copper.", "مادهٔ اصلی مس بود."], ["Who was the architect?", "معمار که بود؟", "Gustave Eiffel, who also designed the Eiffel Tower, designed the inner structure.", "گوستاو ایفل، که برج ایفل را هم طراحی کرد، سازهٔ داخلی را طراحی کرد.", "inner structure", "متن اصلی می‌گوید ایفل معمار مجسمه بود؛ دقیق‌تر این است که سازهٔ داخلی را طراحی کرد و فردریک بارتولدی مجسمه‌ساز بود."], ["What is special about it?", "چه چیز خاصی دارد؟", "Actually, it was gifted to my country, the USA, by the people of France.", "در واقع مردم فرانسه آن را به کشورم، آمریکا، هدیه دادند."], ["Does it symbolize something?", "نماد چیزی است؟", "The statue is a symbol of freedom. We all love it and are proud to share it with international friends.", "مجسمه نماد آزادی است. همه‌مان دوستش داریم و افتخار می‌کنیم آن را با دوستان خارجی قسمت کنیم."], ["Does it attract many tourists?", "گردشگر زیادی جذب می‌کند؟", "Yes. It attracts about 4 million visitors each year, according to the statistics.", "بله. طبق آمار هر سال حدود ۴ میلیون بازدیدکننده جذب می‌کند."]], "vocab": [["landmark", "نماد شناخته‌شدهٔ یک جا", "a famous landmark."], ["be constructed", "ساخته شدن", "مترادف رسمی be built."], ["bear", "در دست داشتن", "bearing a torch. وجه وصفی."], ["symbolize / symbol of", "نماد چیزی بودن", "symbolize فعل، a symbol of اسم."], ["according to the statistics", "طبق آمار", "عبارت منبع. statistics جمع است."], ["can't hide how proud", "نمی‌تواند پنهان کند چقدر مفتخر است", "I can't hide how proud I am."]], "grammar": "known as وصف کوتاه است. It was gifted by مجهول با فاعل after by. each year جای قید تکرار است."}, {"id": "l73", "n": 73, "en": "Handcraft Items", "fa": "صنایع دستی", "qa": [["Do you love handcraft items?", "صنایع دستی را دوست دارید؟", "Yes. My accessories are all handmade.", "بله. زیورهایم همه دست‌سازند."], ["What handcraft item do you like?", "کدام وسیلهٔ دست‌ساز را دوست دارید؟", "I've got many items, but I really fell in love with my bamboo handbag.", "وسیله زیاد دارم، ولی واقعاً عاشق کیف حصیری بامبویم شدم."], ["Where did you buy it?", "کجا خریدیدش؟", "I bought it on a trip to the countryside. People make handicrafts from bamboo there.", "در سفر به روستا خریدم. مردم آنجا از بامبو صنایع دستی می‌سازند."], ["Why do you like it?", "چرا دوستش دارید؟", "Because it's unique. I travel quite a lot, but I can hardly find a similar one.", "چون منحصربه‌فرد است. نسبتاً زیاد سفر می‌کنم، ولی به‌سختی مشابهش را پیدا می‌کنم."], ["What is it made of?", "از چه ساخته شده؟", "It's made of 100% bamboo.", "صد درصد از بامبو ساخته شده."], ["What does it look like?", "قیافه‌اش چطور است؟", "Although it's made of a traditional material, it looks trendy. My bag is A4 size, large enough to carry a bunch of stuff: makeup, a wallet and tissues.", "هرچند از مادهٔ سنتی ساخته شده، شیک به نظر می‌رسد. کیفر اندازهٔ کاغذ A4 است، آن‌قدر بزرگ که کلی چیز ببرد: لوازم آرایش، کیف پول و دستمال."], ["How is it made?", "چطور ساخته می‌شود؟", "Luckily, I had a chance to see how it is made. People spent the whole day weaving hundreds of small bamboo fibers together to make one bag.", "خوشبختانه فرصت دیدم چطور ساخته می‌شود. مردم تمام روز صدها رشتهٔ بامبو را به هم می‌بافند تا یک کیف بسازند."], ["Is it easy to make?", "ساختنش آسان است؟", "No. I'm not really skillful or patient, so handicrafts seem super hard for me.", "نه. خیلی ماهر یا صبور نیستم، برای همین صنایع دستی برایم خیلی سخت است."], ["What is special about it?", "چه چیز خاصی دارد؟", "The material itself is what makes it special. It's eco-friendly as well.", "خود ماده آن را خاص می‌کند. سازگار با محیط زیست هم هست."], ["Does it remind you of something?", "چیزی را یادتان می‌آورد؟", "Yes. It reminds me of the peaceful and quiet atmosphere of the countryside I visited.", "بله. فضای آرام و ساکت روستایی را که دیدم یادم می‌آورد."]], "vocab": [["unique", "منحصربه‌فرد", "Because it's unique. معمولاً very unique گفته نمی‌شود."], ["can hardly", "به‌سختی می‌تواند", "I can hardly find a similar one."], ["trendy", "باب روز", "it looks trendy."], ["weave", "بافتن", "متن اصلی knitting گفته؛ برای بامبو weave دقیق‌تر است."], ["eco-friendly", "سازگار با محیط زیست", "صفت مرکب."], ["a bunch of", "یک عالمه", "غیررسمی. a bunch of stuff."]], "grammar": "large enough to carry: enough بعد از صفت. Although ... it looks trendy تضاد ظاهر سنتی و مدرن است."}, {"id": "l74", "n": 74, "en": "Plastic Surgery", "fa": "جراحی زیبایی", "qa": [["Is plastic surgery popular in your country?", "جراحی زیبایی در کشور شما محبوب است؟", "Not really. People in my country are not so interested in plastic surgery.", "نه واقعاً. مردم کشورم آن‌قدر به جراحی زیبایی علاقه ندارند."], ["What do you think about people having plastic surgery?", "دربارهٔ کسانی که جراحی زیبایی می‌کنند چه فکر می‌کنید؟", "It's hard to say. As long as they find happiness in what they're doing, it's fine with me.", "سخت است بگویم. تا وقتی در کاری که می‌کنند خوشحالی پیدا می‌کنند، برای من اشکالی ندارد."], ["Why do you think people do it?", "فکر می‌کنید چرا مردم این کار را می‌کنند؟", "They want a bett const KEY = "en75-done-v1";
const CUSTOM = "en75-custom-v1";
const done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let custom = JSON.parse(localStorage.getItem(CUSTOM) || "[]");
let showFa = true;
let tab = "talk";
let filter = "all";
let current = null;

const tts = {
  queue: [],
  idx: 0,
  playing: false,
  paused: false,
  rate: 0.92,
  voice: null,
  loopOne: false,
  loopAll: false
};

function allLessons() {
  return (window.LESSONS || []).concat(custom);
}
function saveDone() { localStorage.setItem(KEY, JSON.stringify([...done])); }
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function matches(L, query) {
  if (!query) return true;
  const blob = [L.fa, L.en, L.grammar, ...(L.qa||[]).flat(), ...(L.vocab||[]).flat()].join(" ").toLowerCase();
  return blob.includes(query.toLowerCase());
}

function pickAmericanVoice() {
  const voices = speechSynthesis.getVoices() || [];
  const prefer = [
    "Samantha", "Aaron", "Nicky", "Evan", "Allison", "Susan",
    "Google US English", "Microsoft Ava", "Microsoft Guy", "en-US"
  ];
  for (const name of prefer) {
    const v = voices.find(x => (x.name || "").includes(name) && /en(-|_)US/i.test(x.lang || "en-US"));
    if (v) return v;
  }
  return voices.find(v => /en(-|_)US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
}
function refreshVoice() { tts.voice = pickAmericanVoice(); }
if (window.speechSynthesis) {
  refreshVoice();
  speechSynthesis.onvoiceschanged = refreshVoice;
}

function lessonEnglishLines(L) {
  const out = [];
  (L.qa || []).forEach((row, i) => {
    if (row[0]) out.push({ text: row[0], key: "q-" + i });
    const ans = row[4] || row[2];
    if (ans) out.push({ text: ans, key: "a-" + i });
  });
  return out;
}

function stopTalk() {
  tts.playing = false;
  tts.paused = false;
  tts.loopOne = false;
  try { speechSynthesis.cancel(); } catch (e) {}
  document.querySelectorAll(".enblock.speaking").forEach(el => el.classList.remove("speaking"));
  updatePlayerUI();
}

function speakCurrent() {
  if (!tts.playing || tts.paused) return;
  const item = tts.queue[tts.idx];
  if (!item) {
    if (tts.loopAll && tts.queue.length) {
      tts.idx = 0;
      speakCurrent();
      return;
    }
    stopTalk();
    return;
  }
  document.querySelectorAll(".enblock.speaking").forEach(el => el.classList.remove("speaking"));
  const el = document.querySelector('[data-line="' + item.key + '"]');
  if (el) {
    el.classList.add("speaking");
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  const u = new SpeechSynthesisUtterance(item.text);
  u.lang = "en-US";
  u.rate = tts.rate;
  u.pitch = 1;
  if (tts.voice) u.voice = tts.voice;
  u.onend = function () {
    if (!tts.playing || tts.paused) return;
    if (tts.loopOne) { speakCurrent(); return; }
    tts.idx += 1;
    speakCurrent();
  };
  u.onerror = function () {
    if (!tts.playing) return;
    tts.idx += 1;
    speakCurrent();
  };
  speechSynthesis.speak(u);
  updatePlayerUI();
}

function playFrom(startIdx) {
  if (!current || !window.speechSynthesis) {
    alert("خواندن صدا روی این مرورگر در دسترس نیست. در سافاری آیفون امتحان کنید.");
    return;
  }
  speechSynthesis.cancel();
  tts.queue = lessonEnglishLines(current);
  if (!tts.queue.length) return;
  tts.idx = Math.max(0, Math.min(startIdx || 0, tts.queue.length - 1));
  tts.playing = true;
  tts.paused = false;
  refreshVoice();
  speakCurrent();
}

function togglePause() {
  if (!tts.playing) { playFrom(0); return; }
  if (tts.paused) {
    tts.paused = false;
    if (speechSynthesis.paused) speechSynthesis.resume();
    else speakCurrent();
  } else {
    tts.paused = true;
    try { speechSynthesis.pause(); } catch (e) {}
    if (!speechSynthesis.paused) {
      speechSynthesis.cancel();
    }
  }
  updatePlayerUI();
}

function repeatOne() {
  if (!tts.queue.length) tts.queue = current ? lessonEnglishLines(current) : [];
  tts.loopOne = !tts.loopOne;
  tts.loopAll = false;
  if (!tts.playing) playFrom(tts.idx || 0);
  updatePlayerUI();
}

function updatePlayerUI() {
  const now = document.getElementById("nowLine");
  const meta = document.getElementById("playMeta");
  const playBtn = document.getElementById("playBtn");
  const loopBtn = document.getElementById("loopOneBtn");
  if (!now) return;
  const item = tts.queue[tts.idx];
  now.textContent = item ? item.text : "فقط جمله‌های انگلیسی این درس خوانده می‌شود (لهجه آمریکایی).";
  if (meta) meta.textContent = tts.queue.length ? ((tts.idx + 1) + " / " + tts.queue.length) : "";
  if (playBtn) playBtn.textContent = (!tts.playing || tts.paused) ? "▶ پخش" : "⏸ توقف";
  if (loopBtn) loopBtn.textContent = tts.loopOne ? "تکرار جمله ✓" : "تکرار جمله";
}

function renderHome() {
  stopTalk();
  current = null;
  const query = document.getElementById("q").value.trim();
  const lessons = allLessons().filter(L => matches(L, query) && (filter === "all" || (filter === "done" && done.has(L.id)) || (filter === "todo" && !done.has(L.id)) || (filter === "mine" && L.custom)));
  const total = (window.LESSONS || []).length;
  document.getElementById("progressLabel").textContent = done.size + " از " + total + " خوانده‌شده";
  document.getElementById("app").innerHTML = `
    <section class="hero">
      <h2>مکالمه، ترجمه، واژگان و صدا</h2>
      <p>هر درس را باز کنید و با دکمه پخش، فقط جمله‌های انگلیسی را با لهجه آمریکایی بشنوید. می‌توانید نگه دارید، تکرار کنید یا سرعت را عوض کنید.</p>
      <div class="stats">
        <div class="stat">${total} درس کتاب</div>
        <div class="stat">${custom.length} درس افزوده‌شده</div>
        <div class="stat">صدای آمریکایی آیفون</div>
      </div>
    </section>
    <div class="filters">
      ${[["all","همه"],["todo","نخوانده"],["done","خوانده‌شده"],["mine","درس‌های خودمان"]].map(([k,l]) => `<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}
    </div>
    <div class="grid">
      ${lessons.map(L => `
        <button class="card" data-id="${esc(L.id)}">
          <span class="done-dot ${done.has(L.id)?"on":""}"></span>
          <div class="num">درس ${esc(L.n)}</div>
          <h3>${esc(L.fa)}</h3>
          <p class="en">${esc(L.en)}</p>
        </button>`).join("") || "<p>چیزی پیدا نشد.</p>"}
    </div>
    <section class="addbox">
      <h3 style="margin:0 0 6px">افزودن درس بعدی</h3>
      <p style="margin:0;color:#6d6458;font-size:.9rem">فقط روی همین گوشی ذخیره می‌شود.</p>
      <input id="cFa" placeholder="عنوان فارسی">
      <input id="cEn" placeholder="English title">
      <textarea id="cBody" rows="6" placeholder="Q: Do you work?\nA: Yes, I do."></textarea>
      <button class="mark on" id="addBtn">ذخیرهٔ درس</button>
    </section>
  `;
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderHome(); });
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openLesson(b.dataset.id));
  const add = document.getElementById("addBtn");
  if (add) add.onclick = addCustom;
}
function addCustom() {
  const fa = document.getElementById("cFa").value.trim();
  const en = document.getElementById("cEn").value.trim() || "Custom lesson";
  const body = document.getElementById("cBody").value.trim();
  if (!fa || !body) { alert("عنوان فارسی و متن گفت‌وگو لازم است."); return; }
  const blocks = body.split(/\n\s*\n/);
  const qa = blocks.map(block => {
    const lines = block.split("\n").map(x => x.trim()).filter(Boolean);
    const q = (lines.find(l => /^q:/i.test(l)) || lines[0] || "").replace(/^q:\s*/i, "");
    const a = (lines.find(l => /^a:/i.test(l)) || lines[1] || "").replace(/^a:\s*/i, "");
    return [q, "", a, ""];
  }).filter(x => x[0]);
  custom.push({ id: "c" + Date.now(), n: "＋", fa, en, custom: true, qa, vocab: [], grammar: "این درس را خودتان اضافه کرده‌اید." });
  localStorage.setItem(CUSTOM, JSON.stringify(custom));
  filter = "mine";
  renderHome();
}
function openLesson(id) {
  const L = allLessons().find(x => x.id === id);
  if (!L) return;
  stopTalk();
  current = L;
  tab = "talk";
  renderLesson();
  window.scrollTo(0, 0);
}
function renderLesson() {
  const L = current;
  document.getElementById("progressLabel").textContent = L.fa;
  const turns = (L.qa || []).map((row, i) => `
    <article class="turn">
      <button class="speak-one" data-start="${i * 2}">🔊 این پرسش</button>
      <div class="q enblock" data-line="q-${i}">${esc(row[0])}</div>
      ${showFa && row[1] ? `<div class="fa">${esc(row[1])}</div>` : ""}
      <button class="speak-one" data-start="${i * 2 + 1}">🔊 این جواب</button>
      <div class="a enblock" data-line="a-${i}">${esc(row[2])}</div>
      ${showFa && row[3] ? `<div class="fa">${esc(row[3])}</div>` : ""}
      ${row[4] ? `<div class="fix"><b>طبیعی‌تر:</b> <span class="en">${esc(row[4])}</span>${row[5] ? `<div>${esc(row[5])}</div>` : ""}</div>` : ""}
    </article>`).join("");
  const voc = (L.vocab || []).map(v => `
    <article class="vocab">
      <span class="w">${esc(v[0])}</span>
      <div class="mean">${esc(v[1])}</div>
      <div>${esc(v[2])}</div>
    </article>`).join("") || "<p>برای این درس واژه‌ای ثبت نشده.</p>";
  document.getElementById("app").innerHTML = `
    <div class="lesson-head">
      <button class="back" id="back">فهرست</button>
      <button class="mark ${done.has(L.id)?"on":""}" id="mark">${done.has(L.id)?"خواندم ✓":"علامت به‌عنوان خوانده‌شده"}</button>
    </div>
    <div class="title-block">
      <div class="num" style="color:#0f6e6b;font-weight:700">درس ${esc(L.n)}</div>
      <h2>${esc(L.fa)}</h2>
      <div class="en">${esc(L.en)}</div>
    </div>
    <div class="tabs">
      <button class="tab ${tab==="talk"?"on":""}" data-t="talk">مکالمه و ترجمه</button>
      <button class="tab ${tab==="vocab"?"on":""}" data-t="vocab">واژگان و گرامر</button>
    </div>
    <div class="toggle-row">
      <button class="ghost" id="faToggle">${showFa?"مخفی کردن ترجمه":"نمایش ترجمه"}</button>
    </div>
    <section class="${tab==="talk"?"":"hidden"}">
      ${turns}
    </section>
    <section class="${tab==="vocab"?"":"hidden"} print-break">
      <h3 class="sec">واژه‌ها و عبارت‌های مهم</h3>
      ${voc}
      <h3 class="sec">نکتهٔ گرامری این درس</h3>
      <div class="note">${esc(L.grammar || "")}</div>
    </section>
    <div class="player" id="player">
      <div class="now" id="nowLine">فقط جمله‌های انگلیسی این درس خوانده می‌شود (لهجه آمریکایی).</div>
      <div class="row">
        <button class="main" id="playBtn">▶ پخش همه</button>
        <button id="prevBtn">قبلی</button>
        <button id="nextBtn">بعدی</button>
        <button id="loopOneBtn">تکرار جمله</button>
        <button id="stopBtn">⏹ توقف</button>
        <select id="rateSel">
          <option value="0.75">آهسته</option>
          <option value="0.92" selected>عادی</option>
          <option value="1.1">کمی تند</option>
          <option value="1.25">تند</option>
        </select>
        <span class="meta" id="playMeta"></span>
      </div>
    </div>
  `;
  document.getElementById("back").onclick = renderHome;
  document.getElementById("mark").onclick = () => {
    if (done.has(L.id)) done.delete(L.id); else done.add(L.id);
    saveDone(); renderLesson();
  };
  document.getElementById("faToggle").onclick = () => { showFa = !showFa; renderLesson(); };
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; renderLesson(); });
  document.getElementById("playBtn").onclick = togglePause;
  document.getElementById("stopBtn").onclick = stopTalk;
  document.getElementById("loopOneBtn").onclick = repeatOne;
  document.getElementById("prevBtn").onclick = () => {
    tts.queue = lessonEnglishLines(current);
    playFrom(Math.max(0, (tts.idx || 0) - 1));
  };
  document.getElementById("nextBtn").onclick = () => {
    tts.queue = lessonEnglishLines(current);
    playFrom(Math.min(tts.queue.length - 1, (tts.idx || 0) + 1));
  };
  document.getElementById("rateSel").onchange = e => {
    tts.rate = parseFloat(e.target.value);
    if (tts.playing && !tts.paused) playFrom(tts.idx);
  };
  document.querySelectorAll("[data-start]").forEach(b => {
    b.onclick = () => playFrom(parseInt(b.dataset.start, 10));
  });
  tts.queue = lessonEnglishLines(L);
  updatePlayerUI();
}
document.getElementById("q").addEventListener("input", () => { if (!current) renderHome(); });
renderHome();
</script>
</body>
</html>
