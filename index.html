const LESSONS = [{"id": "l1", "n": 1, "en": "Family", "fa": "خانواده", "qa": [["How many people are there in your family?", "در خانواده‌تان چند نفر هستید؟", "There are 5 people in my family: my father, mother, brother, sister, and me.", "در خانواده‌ام پنج نفر هستیم: پدر، مادر، برادر، خواهر و خودم."], ["Does your family live in a house or an apartment?", "خانواده‌تان در خانه زندگی می‌کنند یا آپارتمان؟", "We live in a house in the countryside.", "ما در خانه‌ای در حومه / روستا زندگی می‌کنیم."], ["What does your father do?", "پدرتان چه کار می‌کند؟", "My father is a doctor. He works at the local hospital.", "پدرم پزشک است. در بیمارستان محلی کار می‌کند."], ["How old is your mother?", "مادرتان چند سال دارد؟", "She is 40 years old, 1 year younger than my father.", "او ۴۰ ساله است، یک سال از پدرم کوچک‌تر."], ["Do you have any siblings? What's his/her name?", "خواهر یا برادر دارید؟ اسمش چیست؟", "Yes, I do. I have 1 elder brother, David, and 1 younger sister, Mary.", "بله. یک برادر بزرگ‌تر به نام دیوید و یک خواهر کوچک‌تر به نام مری دارم."], ["Are you the oldest amongst your brothers and sisters?", "بین خواهر و برادرها بزرگ‌ترین هستی؟", "No, I'm not. I'm the second child in my family.", "نه. من فرزند دوم خانواده‌ام."], ["What does your mother/father like?", "پدر یا مادرتان چه چیزی را دوست دارد؟", "My father likes playing football and my mother likes cooking.", "پدرم فوتبال بازی کردن را دوست دارد و مادرم آشپزی را."], ["Do your parents let you stay out late?", "والدینتان اجازه می‌دهند دیر بیرون بمانید؟", "Of course not. They always ask me to get home before 10 pm each night.", "البته که نه. همیشه از من می‌خواهند هر شب قبل از ساعت ۱۰ خانه باشم."], ["Do you stay with your parents?", "با والدینتان زندگی می‌کنید؟", "Right now, no, but I used to.", "الان نه، ولی قبلاً زندگی می‌کردم."], ["Does your family usually have dinner together?", "خانواده‌تان معمولاً با هم شام می‌خورند؟", "Yes, we do. My mom always prepares delicious meals for us.", "بله. مادرم همیشه برایمان غذاهای خوشمزه آماده می‌کند."]], "vocab": [["sibling", "خواهر یا برادر", "اسم. معمولاً جمع siblings می‌آید. Do you have any siblings? یعنی آیا خواهر یا برادر داری؟ مفردش brother یا sister است."], ["elder / younger", "بزرگ‌تر / کوچک‌تر", "برای ترتیب فرزندان: elder brother برادر بزرگ‌تر، younger sister خواهر کوچک‌تر. older هم طبیعی است."], ["countryside", "روستا، حومه", "در برابر city. in the countryside یعنی در منطقهٔ روستایی."], ["let someone do", "اجازه دادن که کسی کاری کند", "بعد از let فعل بدون to می‌آید: let you stay. شکل منفی: don't let me stay."], ["used to", "قبلاً عادت/وضعیت بوده و حالا نیست", "Right now, no, but I used to. فعل بعد از used to حذف شده چون از جملهٔ قبل فهمیده می‌شود: I used to stay with them."], ["prepare a meal", "غذا آماده کردن", "prepare delicious meals. مترادف نزدیک: cook / make dinner."]], "grammar": "در جواب سؤال‌های Yes/No کوتاه، فعل کمکی را تکرار کنید: Do you...? Yes, I do. / No, I don't. Does she...? Yes, she does. در How old is she? فعل is را در جواب هم بیاورید: She is 40. amongst در انگلیسی امروزی کمتر از among رایج است، ولی غلط نیست."}, {"id": "l2", "n": 2, "en": "Restaurant", "fa": "رستوران", "qa": [["How often do you eat out? Who do you go with?", "چند وقت یک‌بار بیرون غذا می‌خورید؟ با چه کسی می‌روید؟", "I often eat out on weekends, when I hang out with my friends.", "اغلب آخر هفته‌ها بیرون غذا می‌خورم، وقتی با دوستانم وقت می‌گذرانم."], ["What restaurant do you usually visit?", "معمولاً به کدام رستوران می‌روید؟", "Well, there are not many restaurants in my neighborhood, so my best choice is the deli in convenient stores like the Circle K, Mini-Stop, B-smart.", "خب، در محله‌ام رستوران زیادی نیست، برای همین بهترین انتخابم اغذیه‌فروشی فروشگاه‌های زنجیره‌ای مثل Circle K است.", "my best choice is the deli in convenience stores such as Circle K", "convenient یعنی راحت؛ فروشگاه زنجیره‌ای convenience store است."], ["What type of food do you enjoy to eat? Western or Asian?", "چه نوع غذایی دوست دارید؟ غربی یا آسیایی؟", "I'm interested in Asian food. Western food is not my thing.", "به غذای آسیایی علاقه دارم. غذای غربی باب طبع من نیست.", "What type of food do you enjoy eating?", "enjoy را با اسم یا فعلِ -ing به کار ببرید، نه enjoy to eat."], ["How much do you usually pay when you eat out?", "وقتی بیرون غذا می‌خورید معمولاً چقدر می‌پردازید؟", "It's not very expensive, just around $5 for each meal.", "خیلی گران نیست، حدود ۵ دلار برای هر وعده."], ["Do you enjoy spicy food?", "غذای تند دوست دارید؟", "Yes, I do, especially on cold days.", "بله، به‌خصوص روزهای سرد."], ["Are the servers there friendly to you?", "خدمتکاران آنجا با شما دوستانه رفتار می‌کنند؟", "Yes, they are. Most of them are really helpful.", "بله. بیشترشان واقعاً کمک‌کننده‌اند."], ["Have you ever tried Italian food?", "تا حالا غذای ایتالیایی امتحان کرده‌اید؟", "Yes, at least once, when I was at my friend's wedding party.", "بله، دست‌کم یک بار، در جشن عروسی دوستم."], ["Are you concerned about calories when eating out?", "وقتی بیرون غذا می‌خورید نگران کالری هستید؟", "Yes, I am. I'm on a diet now, so this really matters to me.", "بله. الان رژیم دارم، برای همین این موضوع واقعاً برایم مهم است.", "I'm on a diet", "on diet بدون a در انگلیسی معیار ناقص است."], ["Are fast food restaurants like KFC or McDonald's famous in your country?", "فست‌فودهایی مثل کی‌اف‌سی یا مک‌دونالد در کشور شما معروف‌اند؟", "Yes, they are. The youth in my country are big fans of fast food.", "بله. جوان‌های کشورم طرفدار پرشور فست‌فودند."], ["Do you often drink alcohol when eating out?", "وقتی بیرون غذا می‌خورید اغلب مشروب می‌نوشید؟", "No, not often. Just when I have parties with my friends.", "نه، نه اغلب. فقط وقتی با دوستانم مهمانی دارم."]], "vocab": [["eat out", "بیرون غذا خوردن", "عبارت فعلی. متضادش cook at home یا eat in است."], ["hang out with", "با کسی وقت گذراندن، دور هم بودن", "غیررسمی. hang out with my friends."], ["not my thing", "باب طبع من نیست", "عبارت گفتاری. Western food is not my thing."], ["be concerned about", "نگران چیزی بودن", "بعد از about اسم یا فعلِ -ing: concerned about calories."], ["be on a diet", "رژیم داشتن", "حرف اضافه on. I'm on a diet."], ["matter to someone", "برای کسی مهم بودن", "This really matters to me. فاعل معمولاً موضوع است، نه شخص."], ["server", "پیشخدمت رستوران", "در انگلیسی آمریکایی رایج است. waiter/waitress جنسیت‌دارترند."]], "grammar": "How often با قید تکرار جواب داده می‌شود: often, usually, on weekends, twice a week. Have you ever tried...? حال کامل است برای تجربه تا این لحظه؛ جواب کوتاه: Yes, I have. / No, I haven't."}, {"id": "l3", "n": 3, "en": "Books", "fa": "کتاب", "qa": [["How often do you read books?", "چند وقت یک‌بار کتاب می‌خوانید؟", "I read books almost every night before I go to bed.", "تقریباً هر شب پیش از خواب کتاب می‌خوانم."], ["What's your favorite type of book?", "نوع مورد علاقهٔ کتابتان چیست؟", "I love reading about different cultures.", "عاشق خواندن دربارهٔ فرهنگ‌های مختلفم."], ["What can you learn from books?", "از کتاب‌ها چه می‌توان آموخت؟", "Books can broaden my horizon about thousands of things around the world, and books are also my best friends.", "کتاب‌ها می‌توانند افق دیدم را دربارهٔ هزاران چیز در جهان بازتر کنند و همچنین بهترین دوستان من‌اند."], ["Where do you read books?", "کجا کتاب می‌خوانید؟", "I read books at home, sometimes in the library.", "در خانه، و گاهی در کتابخانه."], ["What's the most interesting book you have ever read?", "جالب‌ترین کتابی که تا حالا خوانده‌اید چیست؟", "I think that would be Nepal, a book written about the country of Nepal, published in 1999.", "فکر می‌کنم کتاب نپال باشد؛ کتابی دربارهٔ کشور نپال که سال ۱۹۹۹ منتشر شده."], ["How long does it take you to finish a book?", "تمام کردن یک کتاب چقدر طول می‌کشد؟", "Well, it depends on the length of the book, but it usually takes me a week to finish a 300-page book.", "بستگی به حجم کتاب دارد، ولی معمولاً یک هفته طول می‌کشد تا کتابی ۳۰۰ صفحه‌ای را تمام کنم."], ["Do you usually bring books with you when you travel?", "معمولاً در سفر کتاب همراه می‌برید؟", "Yes, I do. When I'm at the airport or bus station, I read books to kill time.", "بله. در فرودگاه یا ایستگاه اتوبوس کتاب می‌خوانم تا وقت را پر کنم."], ["Is there any bookstore or library in your area?", "در محدودهٔ شما کتاب‌فروشی یا کتابخانه هست؟", "Unfortunately, there are none near my house. The nearest one is 3 kilometers away.", "متأسفانه نزدیک خانه‌ام هیچ‌کدام نیست. نزدیک‌ترینشان سه کیلومتر دورتر است."]], "vocab": [["broaden one's horizon", "افق دید کسی را گسترده‌تر کردن", "عبارت ثابت. horizon اینجا استعاری است، نه افق جغرافیایی."], ["It depends on", "بستگی دارد به", "برای جواب نرم وقتی پاسخ قطعی نیست. It depends on the length."], ["It takes someone time to do", "برای کسی طول کشیدن که کاری کند", "it takes me a week to finish... it فاعل ظاهری است."], ["kill time", "وقت را تلف/پر کردن", "عبارت غیررسمی. to kill time یعنی برای اینکه بی‌کار نمانم."], ["the nearest", "نزدیک‌ترین", "صفت برترترین با the. The nearest one is 3 kilometers away."], ["none", "هیچ‌کدام", "there are none یعنی هیچ موردی وجود ندارد. none می‌تواند با فعل مفرد یا جمع بیاید."]], "grammar": "حال کامل با ever برای تجربه: the most interesting book you have ever read. در جواب می‌توانید that would be را برای معرفی مؤدبانه به کار ببرید، یعنی «آن یکی می‌تواند این باشد»."}, {"id": "l4", "n": 4, "en": "Travel", "fa": "سفر", "qa": [["How many places have you traveled to?", "به چند جا سفر کرده‌اید؟", "I've visited all the provinces throughout my country.", "همهٔ استان‌های کشورم را دیده‌ام."], ["Who do you usually go with?", "معمولاً با چه کسی می‌روید؟", "I often go with my family, sometimes with my best friends.", "اغلب با خانواده‌ام، گاهی با بهترین دوستانم."], ["What's your favorite tourist attraction?", "جاذبهٔ گردشگری مورد علاقه‌تان چیست؟", "That would be Venice in Italy. I love riding the gondola along the canals while watching Italian people live their daily lives.", "ونیز در ایتالیا. دوست دارم با گوندولا در کانال‌ها بروم و زندگی روزمرهٔ مردم ایتالیا را تماشا کنم."], ["Have you ever been abroad?", "تا حالا خارج از کشور بوده‌اید؟", "Yes, I have. I went to Italy last year for a business trip.", "بله. پارسال برای سفر کاری به ایتالیا رفتم.", "I went to Italy", "در متن اصلی came آمده؛ اگر از بیرون به ایتالیا رفته، went دقیق‌تر است."], ["What language do you use when traveling?", "هنگام سفر از چه زبانی استفاده می‌کنید؟", "English, but sometimes I have to use body language since not all people are good at English.", "انگلیسی، ولی گاهی باید از زبان بدن استفاده کنم چون همه انگلیسی بلد نیستند."], ["What do you usually do during your trip?", "در طول سفر معمولاً چه می‌کنید؟", "I often go sightseeing, take pictures, mingle with the local people and sample the local cuisine.", "اغلب گردش می‌کنم، عکس می‌گیرم، با مردم محلی معاشرت می‌کنم و غذای محلی را امتحان می‌کنم."], ["What do you do to prepare for your trip?", "برای آماده‌شدن سفر چه می‌کنید؟", "Before the trip, I search for information about the location, weather, famous tourist attractions, transportation, local cuisine and prices on the internet.", "پیش از سفر در اینترنت دربارهٔ مکان، آب‌وهوا، جاذبه‌ها، حمل‌ونقل، غذای محلی و قیمت‌ها جست‌وجو می‌کنم."], ["What do you usually bring when you travel?", "معمولاً در سفر چه چیزهایی می‌برید؟", "I usually pack my suitcase with some necessary items such as clothes, medicine, food, a map, and a camera.", "معمولاً چمدانم را با چیزهای ضروری مثل لباس، دارو، غذا، نقشه و دوربین پر می‌کنم."], ["Do you prefer traveling by car, train or plane?", "سفر با ماشین، قطار یا هواپیما را ترجیح می‌دهید؟", "I prefer planes although it can be a little expensive. Planes are much faster than any other mode of transport.", "هواپیما را ترجیح می‌دهم، هرچند کمی گران است. هواپیما از هر وسیلهٔ دیگری خیلی سریع‌تر است.", "I prefer planes, although they can be a little expensive.", "plane جمع منطقی است؛ they با planes جور است."], ["Do you prefer traveling alone or joining a guided tour?", "تنها سفر کردن را ترجیح می‌دهید یا تور راهنمادار؟", "I love backpacking with my friends who share the same interests as me.", "عاشق کوله‌گردی با دوستانی‌ام که علاقه‌های مشترک با من دارند."]], "vocab": [["tourist attraction", "جاذبهٔ گردشگری", "اسم مرکب. famous tourist attractions."], ["go sightseeing", "گردش و دیدن دیدنی‌ها", "sightseeing اسم است؛ فعلِ go با آن می‌آید."], ["mingle with", "با دیگران درآمیختن، معاشرت کردن", "mingle with the local people."], ["sample", "چشیدن، نمونه امتحان کردن", "sample the local cuisine یعنی غذای محلی را مزه کردن، نه فقط نمونهٔ آزمایشگاهی."], ["pack a suitcase", "چمدان بستن", "pack my suitcase with clothes."], ["mode of transport", "وسیله / شیوهٔ حمل‌ونقل", "مترادف means of transport. by car / by train بدون the."], ["backpacking", "کوله‌گردی", "سفر کم‌هزینه با کوله‌پشتی. guided tour تور با راهنماست."]], "grammar": "although برای تضاد در یک جمله است: I prefer planes although they are expensive. since اینجا یعنی «چون». share the same interests as me: as برای مقایسه، نه than."}, {"id": "l5", "n": 5, "en": "Website", "fa": "وب‌سایت", "qa": [["What type of websites do you often search for?", "اغلب دنبال چه نوع وب‌سایت‌هایی می‌گردید؟", "It varies depending on my goal. I prefer entertainment and education websites such as facebook.com, wikipedia.org and VOA Special English.", "بسته به هدفم فرق می‌کند. وب‌سایت‌های سرگرمی و آموزشی مثل فیس‌بوک، ویکی‌پدیا و وی‌او‌ای ویژهٔ انگلیسی را ترجیح می‌دهم."], ["How long have you been using them?", "چقدر است که از آن‌ها استفاده می‌کنید؟", "I have been using these websites since I was a freshman at university.", "از وقتی دانشجوی سال اول دانشگاه بودم از این وب‌سایت‌ها استفاده می‌کنم."], ["What do you visit those websites for?", "آن وب‌سایت‌ها را برای چه می‌بینید؟", "I use them to study online or relax after working.", "برای درس خواندن آنلاین یا استراحت بعد از کار."], ["What's your favorite website?", "وب‌سایت مورد علاقه‌تان چیست؟", "I think it's probably youtube.com.", "فکر می‌کنم احتمالاً یوتیوب باشد."], ["Can you read websites in English?", "می‌توانید وب‌سایت انگلیسی بخوانید؟", "Yes, I can. Most useful websites are written in English.", "بله. بیشتر وب‌سایت‌های مفید به انگلیسی نوشته شده‌اند."], ["What's the most popular website in your country?", "محبوب‌ترین وب‌سایت در کشور شما چیست؟", "I'm not quite sure, but I guess it would be facebook.com.", "کاملاً مطمئن نیستم، ولی حدس می‌زنم فیس‌بوک باشد."], ["Do you think the youth should use websites as a reliable source of knowledge?", "فکر می‌کنید جوانان باید وب‌سایت‌ها را منبع مطمئن دانش بدانند؟", "Not always. They should choose their sources carefully.", "نه همیشه. باید منابعشان را با دقت انتخاب کنند."]], "vocab": [["It varies", "فرق می‌کند، متغیر است", "برای گفتن اینکه جواب ثابت نیست. It varies depending on my goal."], ["depend on", "بستگی داشتن به", "depending on اینجا وجه وصفی است و دلیل تفاوت را می‌گوید."], ["freshman", "دانشجوی سال اول", "در انگلیسی آمریکایی. sophomore سال دوم، junior سوم، senior چهارم."], ["reliable source", "منبع قابل اعتماد", "reliable صفت. a reliable source of knowledge."], ["not quite sure", "کاملاً مطمئن نبودن", "عبارت نرم برای حدس زدن بدون ادعای قطعیت."], ["such as", "مانند، از جمله", "برای مثال آوردن. such as A, B and C."]], "grammar": "حال کامل استمراری have been using برای کاری است که از گذشته شروع شده و هنوز ادامه دارد. since با نقطهٔ شروع می‌آید (since I was a freshman) و for با مدت (for five years)."}, {"id": "l6", "n": 6, "en": "Accident", "fa": "تصادف", "qa": [["Have you ever been in any traffic accident?", "تا حالا در تصادف رانندگی بوده‌اید؟", "Yes, three years ago.", "بله، سه سال پیش."], ["What happened?", "چه اتفاقی افتاد؟", "I was hit by a car while crossing the road.", "هنگام رد شدن از خیابان یک ماشین به من زد."], ["How did you feel then?", "آن موقع چه حسی داشتید؟", "I felt really terrible because of my injuries.", "به‌خاطر آسیب‌هایم واقعاً حالم بد بود."], ["Who was involved in the accident?", "چه کسانی در تصادف دخیل بودند؟", "The car driver, his family inside the car, and me.", "راننده، خانواده‌اش داخل ماشین، و من."], ["Did the insurance company pay for the repair service?", "شرکت بیمه هزینهٔ تعمیر را داد؟", "I was walking, so I did not require any car repair services.", "پیاده بودم، پس به تعمیر ماشین نیاز نداشتم."], ["Did you need a lawyer?", "به وکیل نیاز داشتید؟", "I hurt my lower back just a little, so I didn't call a lawyer.", "کمی کمرم آسیب دید، برای همین وکیل نگرفتم."], ["Did you report the issue to the police?", "موضوع را به پلیس گزارش کردید؟", "No, we didn't want to get the police involved.", "نه، نمی‌خواستیم پلیس را وارد ماجرا کنیم."], ["Were you sent to the hospital after the accident?", "بعد از تصادف به بیمارستان فرستاده شدید؟", "No, the injury wasn't really serious.", "نه، آسیب واقعاً جدی نبود."], ["Do you have a driving license?", "گواهینامه دارید؟", "Yes, I do. I always keep it in my purse.", "بله. همیشه آن را در کیفم نگه می‌دارم."], ["Why should people obey traffic regulations?", "چرا مردم باید مقررات راهنمایی را رعایت کنند؟", "To protect themselves and others. The best ways are to wear a helmet, wait for traffic lights and stay in the appropriate vehicle or pedestrian lanes.", "برای محافظت از خود و دیگران. بهترین راه‌ها کلاه ایمنی، ایستادن پشت چراغ و ماندن در خط خودرو یا پیاده است."]], "vocab": [["be hit by", "مورد برخورد قرار گرفتن", "مجهول. I was hit by a car. فاعل واقعی بعد از by می‌آید."], ["while + -ing", "در حین انجام کار", "while crossing the road = while I was crossing the road."], ["injury / injure", "آسیب / آسیب زدن", "injury اسم، injure فعل. injuries جمع است."], ["get someone involved", "کسی را درگیر کردن", "get the police involved."], ["obey regulations", "رعایت مقررات", "obey فعل متعدی است و حرف اضافه نمی‌خواهد: obey the law."], ["pedestrian", "عابر پیاده", "pedestrian lane خط عابر."]], "grammar": "در حاشیهٔ همین درس کتاب، مجهول فعل help آمده است. معلوم: she helps me. مجهول: I am helped. گذشته: she helped me / I was helped. حال کامل: she has helped me / I have been helped. گذشتهٔ کامل: she had helped me / I had been helped. آینده: she will help me / I will be helped. مفعول معلوم، فاعل مجهول می‌شود."}, {"id": "l7", "n": 7, "en": "Childhood Memory", "fa": "خاطرهٔ کودکی", "qa": [["Did you have a happy childhood?", "کودکی شادی داشتید؟", "Yes, I did. I enjoyed playing hide and seek with my peers.", "بله. از قایم‌باشک با همسالانم لذت می‌بردم."], ["Did you experience your childhood in a city or the countryside?", "کودکی‌تان در شهر بود یا روستا؟", "I spent my childhood in a rural area where I could see vast rice fields.", "کودکی‌ام را در منطقه‌ای روستایی گذراندم که شالیزارهای وسیع می‌دیدم."], ["Did you usually skip class when you were a child?", "در کودکی معمولاً از کلاس فرار می‌کردید؟", "Yes, I did, and many of my friends did, too.", "بله، و خیلی از دوستانم هم همین کار را می‌کردند."], ["Who were you with when you were a child?", "در کودکی با چه کسی بودید؟", "I was with my beloved family.", "با خانوادهٔ عزیزم بودم."], ["What did you want to be when you were a child?", "در کودکی می‌خواستید چه کاره شوید؟", "I dreamed of being a fashion designer.", "رؤیای طراح مد شدن را داشتم."], ["Who did you love the most when you were a child?", "در کودکی چه کسی را از همه بیشتر دوست داشتید؟", "I loved my mom the most since she was always there and took care of me.", "مادرم را از همه بیشتر دوست داشتم، چون همیشه کنارم بود و از من مراقبت می‌کرد."], ["Who was your childhood hero?", "قهرمان کودکی‌تان که بود؟", "Robin Hood. He took money from the rich and gave it to the poor.", "رابین هود. از ثروتمندان می‌گرفت و به فقرا می‌داد."], ["What reminds you of your childhood?", "چه چیزی کودکی‌تان را یادتان می‌آورد؟", "Green rice fields, which I happen to see everywhere, remind me of my beautiful childhood.", "شالیزارهای سبز که همه‌جا می‌بینم، کودکی زیبایم را یادم می‌آورند."], ["Did you change a lot when you grew up?", "وقتی بزرگ شدید خیلی تغییر کردید؟", "Yes, of course. I'm more mature now, both physically and mentally.", "البته. حالا هم از نظر جسمی و هم ذهنی بالغ‌ترم."], ["Why is childhood important?", "چرا کودکی مهم است؟", "Because it shapes people into who they will become.", "چون آدم‌ها را به کسی که بعداً می‌شوند شکل می‌دهد."]], "vocab": [["hide and seek", "قایم‌باشک", "اسم بازی. playing hide and seek."], ["peer", "همسال", "کسی هم‌سن و هم‌سطح شما. peers."], ["skip class", "غیبت کردن از کلاس، جیم شدن", "skip class / skip school."], ["dream of + -ing", "رؤیای کاری را داشتن", "dreamed of being a designer. بعد از of فعل -ing است."], ["take care of", "مراقبت کردن از", "took care of me."], ["remind someone of", "چیزی را به یاد کسی آوردن", "fields remind me of my childhood. حرف اضافه of است."], ["shape someone into", "کسی را به شکل چیزی درآوردن", "it shapes people into who they will become."]], "grammar": "برای خاطرهٔ تمام‌شده از گذشتهٔ ساده استفاده کنید: Did you have...? Yes, I did. I enjoyed... who در What reminds you فاعل جملهٔ دوم است و فعل remind با fields جمع جور است. since اینجا یعنی چون."}, {"id": "l8", "n": 8, "en": "Favorite Rooms", "fa": "اتاق مورد علاقه", "qa": [["How many rooms are there in your house?", "در خانه‌تان چند اتاق هست؟", "There are 6 rooms: a living room, 2 bedrooms, a bathroom and a kitchen.", "شش اتاق: یک پذیرایی، دو اتاق‌خواب، یک حمام و یک آشپزخانه."], ["Which floor is your bedroom on?", "اتاق‌خوابتان در کدام طبقه است؟", "My bedroom is on the first floor of a three-storey house.", "اتاقم در طبقهٔ اول یک خانهٔ سه‌طبقه است."], ["Is it big or small?", "بزرگ است یا کوچک؟", "It's not very spacious, just enough to put the necessary furniture in.", "خیلی جادار نیست، فقط به اندازهٔ گذاشتن وسایل ضروری."], ["What color is your bedroom painted?", "اتاق‌خوابتان چه رنگی است؟", "It's painted pink, my favorite color.", "صورتی رنگ شده، رنگ مورد علاقه‌ام."], ["Do you love your room? Why?", "اتاق‌تان را دوست دارید؟ چرا؟", "I love it very much because it is my private space whenever I go home.", "خیلی دوستش دارم چون هر وقت خانه می‌آیم فضای خصوصی من است."], ["What furniture does your bedroom contain?", "اتاق‌خوابتان چه وسایلی دارد؟", "It contains a bed, a desk, and a clothing closet.", "یک تخت، یک میز و یک کمد لباس."], ["What do you do in it?", "در آن چه می‌کنید؟", "I spend most of my free time there reading books and sleeping.", "بیشتر وقت آزادم را آنجا کتاب می‌خوانم و می‌خوابم."], ["How much time do you spend in your room?", "چقدر وقت در اتاق‌تان می‌گذرانید؟", "About 10 hours a day, especially in the evening.", "حدود ۱۰ ساعت در روز، به‌خصوص عصر."], ["Do you share your room with anyone else?", "اتاق‌تان را با کسی شریک هستید؟", "No, everyone in my family has their own room, so I stay there alone.", "نه، هر کس در خانواده‌ام اتاق خودش را دارد، پس تنها آنجا می‌مانم."]], "vocab": [["three-storey", "سه‌طبقه", "صفت مرکب پیش از اسم با خط تیره: a three-storey house. storey بریتانیایی است؛ story آمریکایی."], ["spacious", "جادار", "متضاد cramped. not very spacious."], ["be painted", "رنگ شدن", "مجهول. It's painted pink. pink مکمل است."], ["private space", "فضای خصوصی", "private صفت، space اسم."], ["closet", "کمد", "clothing closet کمد لباس. در بریتانیایی wardrobe هم رایج است."], ["have one's own", "مال خود را داشتن", "everyone has their own room. their برای everyone در انگلیسی امروزی طبیعی است."]], "grammar": "There are برای وجود جمع است: There are 6 rooms. سؤال Which floor ... on? حرف اضافه on را آخر سؤال نگه دارید، حذف نکنید. spend time doing: spend time reading، نه spend time to read."}, {"id": "l9", "n": 9, "en": "Presents", "fa": "هدیه", "qa": [["What kind of presents are popular in your country?", "در کشور شما چه نوع هدیه‌ای رایج است؟", "It depends on the receivers. For children, toys are the best choice. For young people, souvenirs are recommended.", "بستگی به گیرنده دارد. برای بچه‌ها اسباب‌بازی بهترین انتخاب است. برای جوان‌ها سوغاتی پیشنهاد می‌شود."], ["Who gave presents to you? On what occasions?", "چه کسی به شما هدیه داده؟ در چه مناسبت‌هایی؟", "I have received many presents, most of which were from my friends. They gave me gifts on my birthday.", "هدیه‌های زیادی گرفته‌ام که بیشترشان از دوستانم بوده. آن‌ها روز تولدم هدیه دادند."], ["What was your last present?", "آخرین هدیه‌تان چه بود؟", "It was a handmade doll, given by my best friend when I moved to another city.", "یک عروسک دست‌ساز بود که بهترین دوستم وقتی به شهر دیگری رفتم به من داد."], ["What was the one you liked best?", "کدام را از همه بیشتر دوست داشتید؟", "I loved my book Nepal a lot. It was given to me on my 23rd birthday by my brother.", "کتاب نپال را خیلی دوست داشتم. برادرم روز تولد ۲۳ سالگی‌ام به من داد."], ["Did you ever get a present you didn't like?", "تا حالا هدیه‌ای گرفته‌اید که دوست نداشته باشید؟", "Yes, I have, but I still treasure and take care of them.", "بله، ولی باز هم آن‌ها را عزیز می‌دارم و مواظبشان هستم."], ["How do you thank people who give you presents?", "از کسانی که هدیه می‌دهند چطور تشکر می‌کنید؟", "I give them presents that they would like.", "به آن‌ها هدیه‌ای می‌دهم که دوست داشته باشند.", "I give them presents", "در اصل gave آمده؛ برای عادت فعلی give طبیعی‌تر است."], ["What are the times of the year that people give presents in your country?", "در کشور شما مردم چه وقت‌هایی از سال هدیه می‌دهند؟", "Some special occasions are birthdays, weddings, graduation, New Year's Day, Valentine's Day and housewarming ceremonies.", "بعضی مناسبت‌ها تولد، عروسی، فارغ‌التحصیلی، سال نو، ولنتاین و جشن خانهٔ نو است."], ["Who was the last person you gave a present to?", "آخرین کسی که به او هدیه دادید که بود؟", "My mom. I bought her a coat on a business trip to Bangkok.", "مادرم. در سفر کاری به بانکوک برایش پالتو خریدم."], ["Is giving presents important in daily life?", "هدیه دادن در زندگی روزانه مهم است؟", "Yes, it is. It's one of the best ways to show your love and gratitude to someone.", "بله. یکی از بهترین راه‌ها برای نشان دادن عشق و قدردانی به کسی است."]], "vocab": [["most of which", "که بیشتر آن‌ها", "ضمیر موصولی برای غیرجاندار بعد از حرف اضافه. most of which were from my friends."], ["handmade", "دست‌ساز", "صفت مرکب. a handmade doll."], ["treasure", "عزیز داشتن، گرامی داشتن", "اینجا فعل است: I treasure them."], ["housewarming", "جشن ورود به خانهٔ نو", "housewarming ceremony."], ["gratitude", "قدردانی", "show gratitude to someone. مترادف ساده: thanks."], ["on a business trip", "در سفر کاری", "حرف اضافه on. on a trip to Bangkok."]], "grammar": "هدیه‌ای که داده شده را با مجهول بگویید: It was given to me by my brother. most of which ساختار موصولی رسمی و برای اسپیکینگ آیلتس خیلی به‌دردبخور است."}, {"id": "l10", "n": 10, "en": "Historical Place", "fa": "مکان تاریخی", "qa": [["Which tourist attractions do you prefer when traveling? Historical places or natural landmarks?", "هنگام سفر کدام جاذبه را ترجیح می‌دهید؟ مکان تاریخی یا منظرهٔ طبیعی؟", "Well, historical places are always my first choice when traveling.", "مکان‌های تاریخی همیشه اولین انتخاب من‌اند."], ["What do you usually do when visiting historical places?", "وقتی از مکان تاریخی دیدن می‌کنید معمولاً چه می‌کنید؟", "I usually listen to the tour guide introducing the sights and take notes about important historical events.", "معمولاً به راهنما که جاها را معرفی می‌کند گوش می‌دهم و از رویدادهای مهم تاریخی یادداشت برمی‌دارم."], ["Can you name some historical places you have visited?", "می‌توانید چند مکان تاریخی را که دیده‌اید نام ببرید؟", "Whenever I travel to a foreign country, I always visit its famous historical places. Some of them are the Pyramids in Egypt, Angkor Wat in Cambodia, Stonehenge in England and the Taj Mahal in India.", "هر وقت به کشور خارجی می‌روم، مکان‌های تاریخی معروفش را می‌بینم؛ مثل اهرام مصر، آنگکور وات، استون‌هنج و تاج‌محل."], ["What's your most favorite historical place? Why?", "محبوب‌ترین مکان تاریخی‌تان چیست؟ چرا؟", "I love the Pyramids the most. Taking a tour around the Pyramids, I can not only enjoy the gorgeous architecture but also learn the cultural and historical values of ancient Egyptian culture.", "اهرام را از همه بیشتر دوست دارم. با گشتن دور اهرام نه‌تنها از معماری باشکوه لذت می‌برم، بلکه ارزش‌های فرهنگی و تاریخی مصر باستان را هم می‌آموزم.", "What's your favorite historical place?", "most favorite اضافه است؛ favorite خودش عالی است."], ["What is the most famous historical place in your country?", "معروف‌ترین مکان تاریخی کشور شما چیست؟", "It's definitely the Statue of Liberty in New York City.", "قطعاً مجسمهٔ آزادی در نیویورک."], ["What's special about it?", "چه چیز خاصی دربارهٔ آن هست؟", "The statue was gifted by the people of France. It is a symbol of freedom for the US as well as a welcoming sight for people coming to the US.", "مجسمه را مردم فرانسه هدیه داده‌اند. نماد آزادی آمریکاست و همچنین منظرهٔ خوشامد برای تازه‌واردها."], ["Where is it located?", "کجا واقع شده؟", "It's located on Liberty Island in New York Harbor.", "در جزیرهٔ آزادی در بندر نیویورک."], ["Should young people visit historical places instead of other places?", "جوانان باید به‌جای جاهای دیگر مکان تاریخی ببینند؟", "Sure. Nowadays young people should visit these kinds of places more often in order to preserve the historical and cultural values of their country.", "حتماً. امروزه جوانان باید بیشتر این جاها را ببینند تا ارزش‌های تاریخی و فرهنگی کشورشان حفظ شود."]], "vocab": [["first choice", "انتخاب اول", "historical places are my first choice."], ["take notes", "یادداشت برداشتن", "take notes about something."], ["not only ... but also", "نه‌تنها ... بلکه", "دو بخش باید از نظر دستوری هم‌پایه باشند: enjoy ... but also learn."], ["be gifted by", "هدیه داده شدن از سوی", "مجهول. was gifted by the people of France."], ["be located", "واقع بودن", "It's located on an island. in برای شهر، on برای جزیره."], ["in order to", "برای اینکه، به منظور", "in order to preserve... مترادف کوتاه‌تر: to preserve."], ["these kinds of", "این نوع از", "these kinds of places. متن اصلی these kind غلط جمع است."]], "grammar": "not only ... but also را حفظ کنید؛ در اسپیکینگ نمرهٔ گرامر را بالا می‌برد. whenever برای «هر وقت که» است و حال ساده بعدش برای عادت می‌آید."}, {"id": "l11", "n": 11, "en": "Newspaper / Magazine", "fa": "روزنامه و مجله", "qa": [["What are the benefits of reading a newspaper or magazine?", "فایدهٔ خواندن روزنامه یا مجله چیست؟", "Newspapers and magazines can broaden your mind about thousands of things without the need to travel.", "روزنامه و مجله می‌توانند بدون نیاز به سفر، ذهن شما را دربارهٔ هزاران موضوع باز کنند."], ["How often do you read it?", "چند وقت یک‌بار می‌خوانید؟", "I read it every day.", "هر روز."], ["What's the best time to read the newspaper?", "بهترین زمان خواندن روزنامه کی است؟", "I think the best time is in the morning, when you start a new day.", "فکر می‌کنم صبح، وقتی روز را شروع می‌کنید."], ["What types of magazines do you usually read?", "معمولاً چه نوع مجله‌ای می‌خوانید؟", "I usually read politics and fashion magazines. I also enjoy reading about culture and tourism.", "معمولاً مجلهٔ سیاست و مد. دربارهٔ فرهنگ و گردشگری هم لذت می‌برم."], ["What's your favorite magazine?", "مجلهٔ مورد علاقه‌تان چیست؟", "My favorite is The New York Times, which writes about all sorts of things: business, sports, movies, travel, books, jobs, education and real estate.", "نیویورک تایمز، که دربارهٔ همه‌جور موضوع می‌نویسد: کسب‌وکار، ورزش، فیلم، سفر، کتاب، شغل، آموزش و املاک.", "The New York Times is a newspaper, not a magazine.", "اگر می‌خواهید دقیق باشید بگویید newspaper. برای مجله مثلاً Time یا National Geographic."], ["Do you read the paper or online news?", "روزنامهٔ کاغذی می‌خوانید یا خبر آنلاین؟", "I prefer online news to save money.", "برای صرفه‌جویی خبر آنلاین را ترجیح می‌دهم."], ["How much does it cost you to buy a paper newspaper per month?", "خرید روزنامهٔ کاغذی در ماه چقدر برایتان هزینه دارد؟", "I only buy a monthly newspaper, so it doesn't cost much. Around $5 a month.", "فقط یک نشریهٔ ماهانه می‌خرم، پس زیاد نمی‌شود. حدود ۵ دلار در ماه."], ["What is the most popular magazine in your country?", "محبوب‌ترین مجله در کشور شما چیست؟", "I think it would be Forbes, a leading source for reliable business news and financial information.", "فکر می‌کنم فوربز، منبع پیشرو اخبار کسب‌وکار و اطلاعات مالی."], ["With the popularity of the Internet, do you think newspapers and magazines will disappear?", "با محبوبیت اینترنت، فکر می‌کنید روزنامه و مجله ناپدید شوند؟", "Yes, unfortunately it's just a matter of time.", "بله، متأسفانه فقط مسئلهٔ زمان است."]], "vocab": [["broaden your mind", "ذهن را گسترده‌تر کردن", "نزدیک به broaden your horizon."], ["all sorts of", "همه‌جور", "all sorts of things."], ["prefer A to B / prefer to do", "ترجیح دادن", "I prefer online news. اینجا to save money هدف است، نه مقایسه."], ["a leading source", "منبع پیشرو", "leading صفت به معنی پیشتاز."], ["a matter of time", "فقط مسئلهٔ زمان", "it's just a matter of time یعنی دیر یا زود رخ می‌دهد."], ["real estate", "املاک و مستغلات", "اسم مرکب. در فهرست موضوع‌های روزنامه."]], "grammar": "which برای افزودن اطلاعات دربارهٔ اسم قبل است: The New York Times, which writes about... ویرگول قبل از which یعنی جملهٔ وصفی غیرمحدودکننده است."}, {"id": "l12", "n": 12, "en": "Memorable Event", "fa": "رویداد به‌یادماندنی", "qa": [["How many events have you joined this year? What were they about?", "امسال در چند رویداد شرکت کرده‌اید؟ دربارهٔ چه بودند؟", "I have joined more than 10 events so far, most of which were about education.", "تا حالا در بیش از ۱۰ رویداد شرکت کرده‌ام که بیشترشان دربارهٔ آموزش بودند."], ["What was your most memorable event?", "به‌یادماندنی‌ترین رویدادتان چه بود؟", "The most memorable for me was an international study conference, in which I was introduced to some famous universities in Europe.", "برای من یک همایش بین‌المللی تحصیل بود که در آن با چند دانشگاه معروف اروپا آشنا شدم."], ["Was it organized indoors or outdoors?", "داخل سالن برگزار شد یا بیرون؟", "It was an indoor event.", "رویداد داخل سالن بود."], ["Who sponsored the event?", "چه کسی رویداد را حمایت مالی کرد؟", "The organizer was the Education Department of the American Center, but the universities introduced at the conference were the ones who paid.", "برگزارکننده بخش آموزش مرکز آمریکایی بود، ولی دانشگاه‌هایی که معرفی شدند هزینه را دادند."], ["Who went to the event with you?", "چه کسی با شما به رویداد آمد؟", "I went there with my friends, who shared the same interest in studying abroad as me.", "با دوستانی رفتم که مثل من به تحصیل در خارج علاقه داشتند."], ["What were some performances in the event?", "در رویداد چه برنامه‌هایی بود؟", "There were not many performances. Each university representative just gave a speech and then they hosted a Q&A session.", "برنامهٔ نمایشی زیادی نبود. نمایندهٔ هر دانشگاه سخنرانی کرد و بعد پرسش و پاسخ گذاشتند."], ["Was the event shown on TV?", "رویداد از تلویزیون پخش شد؟", "The event was not aired, but there were television advertisements for it.", "پخش نشد، ولی تبلیغ تلویزیونی برایش بود."], ["How would someone market an event?", "کسی چطور یک رویداد را تبلیغ می‌کند؟", "Taking advantage of social media is a smart way to promote an event.", "استفاده از شبکه‌های اجتماعی راه هوشمندانه‌ای برای تبلیغ رویداد است."]], "vocab": [["so far", "تا اینجا، تا حالا", "با حال کامل: I have joined 10 events so far."], ["in which", "که در آن", "ضمیر موصولی رسمی. a conference in which I was introduced. معادل where هم ممکن است."], ["sponsor", "حامی مالی", "فعل و اسم. Who sponsored the event?"], ["air", "پخش کردن", "اینجا فعل. was not aired یعنی از تلویزیون پخش نشد."], ["Q&A session", "نشست پرسش و پاسخ", "question and answer. hosted a Q&A session."], ["take advantage of", "بهره بردن از", "Taking advantage of social media. وجه مصدری به‌عنوان فاعل جمله."]], "grammar": "so far نشانهٔ حال کامل است. was introduced مجهول است: کسی مرا معرفی کرد. would در How would someone...? برای پیشنهاد کلی و فرضی است."}, {"id": "l13", "n": 13, "en": "Favorite Subject", "fa": "درس مورد علاقه", "qa": [["What subjects did you learn in school?", "در مدرسه چه درس‌هایی خواندید؟", "I learned Math, Science, Physics, Biology, Geography, History, Literature, English, Art and Music.", "ریاضی، علوم، فیزیک، زیست، جغرافیا، تاریخ، ادبیات، انگلیسی، هنر و موسیقی."], ["What subject did you like the most when you were at school? Were you good at it?", "در مدرسه کدام درس را بیشتر دوست داشتید؟ در آن قوی بودید؟", "I liked Biology the most, although I was excellent at Literature.", "زیست را از همه بیشتر دوست داشتم، هرچند در ادبیات عالی بودم."], ["Did your friends like that subject too?", "دوستانتان هم آن درس را دوست داشتند؟", "Yes, they did. They enjoyed every single Biology lesson.", "بله. از تک‌تک جلسه‌های زیست لذت می‌بردند."], ["Was the textbook written in English or any other language?", "کتاب درسی به انگلیسی بود یا زبان دیگر؟", "It was written in English.", "به انگلیسی نوشته شده بود."], ["Who taught that subject?", "آن درس را چه کسی درس می‌داد؟", "My teacher was Ms. Karen, from the USA.", "معلمم خانم کارن از آمریکا بود."], ["How was that subject helpful to you?", "آن درس چه کمکی به شما کرد؟", "It helped me a lot in becoming a Biology teacher.", "خیلی کمکم کرد معلم زیست شوم."], ["How often did you learn that subject?", "آن درس را چند وقت یک‌بار داشتید؟", "I often had Biology lessons 5 times a week.", "اغلب هفته‌ای ۵ جلسه زیست داشتم."], ["How long did you spend on that subject at home?", "در خانه چقدر برای آن درس وقت می‌گذاشتید؟", "I spent roughly 2 hours a day studying Biology at home.", "حدود دو ساعت در روز در خانه زیست می‌خواندم."], ["Have you ever attended any extra classes for that subject?", "تا حالا کلاس فوق‌برنامه برای آن درس رفته‌اید؟", "Yes, I have. I usually attended evening classes.", "بله. معمولاً کلاس عصر می‌رفتم."], ["Is it important to study hard on both social sciences and natural sciences?", "مهم است که هم علوم انسانی و هم علوم طبیعی را سخت بخوانید؟", "No, it isn't. Students should study the ones they like and those that are helpful to their career path.", "نه. دانش‌آموزان باید درس‌هایی را بخوانند که دوست دارند و به مسیر شغلی‌شان کمک می‌کند."]], "vocab": [["be good at", "در چیزی قوی بودن", "good at Literature. حرف اضافه at."], ["although", "هرچند", "تضاد را در همان جمله می‌آورد. I liked Biology although I was excellent at Literature."], ["every single", "تک‌تک، بدون استثنا", "تأکید. every single lesson."], ["roughly", "تقریباً، حدوداً", "قید تقریب. roughly 2 hours."], ["extra classes", "کلاس فوق‌برنامه", "evening classes کلاس عصر."], ["career path", "مسیر شغلی", "helpful to their career path."]], "grammar": "although و because را قاطی نکنید. although تضاد است، because دلیل. spend time doing باز هم اینجا هست: spent 2 hours studying."}, {"id": "l14", "n": 14, "en": "Museum", "fa": "موزه", "qa": [["What type of museum is popular in your country?", "در کشور شما چه نوع موزه‌ای محبوب است؟", "There are many types of museums, but the most popular are historical museums.", "انواع زیادی موزه هست، ولی محبوب‌ترین‌ها موزه‌های تاریخی‌اند."], ["What is the most famous museum in your country?", "معروف‌ترین موزه در کشور شما چیست؟", "That would be the British Museum, located in London.", "موزهٔ بریتانیا در لندن."], ["What's special about it?", "چه چیز خاصی دارد؟", "I'm impressed by its large amount of historical, art and cultural work.", "از حجم زیاد آثار تاریخی، هنری و فرهنگی‌اش تحت تأثیرم."], ["How many times have you visited that museum?", "چند بار از آن موزه دیدن کرده‌اید؟", "I have visited the museum twice.", "دو بار."], ["What do you usually do when visiting a museum?", "هنگام بازدید از موزه معمولاً چه می‌کنید؟", "I usually listen to the tour guide and take notes about important information.", "معمولاً به راهنما گوش می‌دهم و از اطلاعات مهم یادداشت برمی‌دارم."], ["Are you allowed to take pictures there?", "اجازهٔ عکس گرفتن آنجا را دارید؟", "No, the guards did not allow us to bring a camera in.", "نه، نگهبان‌ها نگذاشتند دوربین ببریم داخل."], ["How did you feel after visiting there?", "بعد از بازدید چه حسی داشتید؟", "The overall experience was fantastic, and I learned so many things in just a few hours.", "تجربهٔ کلی فوق‌العاده بود و فقط در چند ساعت خیلی چیز یاد گرفتم."], ["What do you think is the importance of museums in history?", "اهمیت موزه‌ها در تاریخ چیست؟", "Museums are an integral part of any country's history, and they keep history alive.", "موزه‌ها بخش جدایی‌ناپذیر تاریخ هر کشورند و تاریخ را زنده نگه می‌دارند."]], "vocab": [["be impressed by", "تحت تأثیر چیزی قرار گرفتن", "I'm impressed by its collection."], ["be allowed to", "اجازه داشتن", "Are you allowed to take pictures? مجهول allow."], ["overall", "در مجموع", "The overall experience."], ["integral part", "بخش جدایی‌ناپذیر", "an integral part of history."], ["keep something alive", "چیزی را زنده نگه داشتن", "keep history alive."], ["twice", "دو بار", "با حال کامل برای تعداد تجربه: I have visited it twice."]], "grammar": "How many times have you visited...? حال کامل برای تعداد تجربه تا حالا. جواب: twice / three times / many times. never هم ممکن است: I have never visited it."}, {"id": "l15", "n": 15, "en": "Favorite Movie", "fa": "فیلم مورد علاقه", "qa": [["Do you usually watch movies at home or at a movie theater?", "معمولاً فیلم را در خانه می‌بینید یا سینما؟", "I usually watch movies on my laptop. Sometimes I go to the movie theater.", "معمولاً روی لپ‌تاپ. گاهی به سینما می‌روم."], ["Is watching movies at the theater more interesting than watching movies at home?", "دیدن فیلم در سینما از خانه جالب‌تر است؟", "Yes, definitely, because you can watch vivid images on a large screen with lively sound effects.", "بله، قطعاً، چون تصویر زنده را روی پردهٔ بزرگ با صدای پرانرژی می‌بینید."], ["How often do you go to the movie theater?", "چند وقت یک‌بار به سینما می‌روید؟", "I often go to the movie theater every weekend.", "اغلب هر آخر هفته."], ["What's your favorite type of movie? What movie of that type do you like?", "نوع فیلم مورد علاقه‌تان چیست؟ کدام فیلم از آن نوع را دوست دارید؟", "My favorite type is comedy because whenever I watch one, I feel like there are no more worries in the world. I love the Mr. Bean series.", "کمدی، چون هر وقت یکی را می‌بینم حس می‌کنم دیگر هیچ نگرانی در دنیا نیست. مجموعهٔ مستر بین را دوست دارم."], ["Was that movie adapted from a book?", "آن فیلم از روی کتاب اقتباس شده بود؟", "No, the story is derived from funny situations in real life.", "نه، داستان از موقعیت‌های خنده‌دار واقعی آمده."], ["Who are the actors in the movie?", "بازیگران فیلم چه کسانی‌اند؟", "Mr. Bean is the main character. He is played by Rowan Atkinson, who is from England.", "مستر بین شخصیت اصلی است. روان اتکینسون از انگلستان نقشش را بازی می‌کند."], ["Was it recommended by your friend, teacher or family?", "دوست، معلم یا خانواده پیشنهادش کرده بودند؟", "It was recommended by my classmate.", "هم‌کلاسی‌ام پیشنهاد کرده بود."], ["Was the movie in your mother language or in English?", "فیلم به زبان مادری‌تان بود یا انگلیسی؟", "It was in English, but I can also watch it with subtitles.", "انگلیسی بود، ولی با زیرنویس هم می‌توانم ببینمش."], ["Should children watch violent movies?", "کودکان باید فیلم خشن ببینند؟", "I don't believe so. Young children are very impressionable and it could lead them to imitate the behavior.", "فکر نمی‌کنم. بچه‌های کوچک خیلی تأثیرپذیرند و ممکن است بخواهند آن رفتار را تقلید کنند."], ["What's the most important factor of a great movie?", "مهم‌ترین عامل یک فیلم عالی چیست؟", "I believe that plot and actors are among the factors which decide the success of a movie.", "باور دارم داستان و بازیگران از عواملی‌اند که موفقیت فیلم را تعیین می‌کنند."]], "vocab": [["feel like", "حس کردن که", "I feel like there are no more worries. feel like + جمله یا -ing."], ["be adapted from", "اقتباس شدن از", "مجهول. Was it adapted from a book?"], ["be derived from", "برگرفته شدن از", "The story is derived from real life."], ["be played by", "نقش را بازی کردن", "He is played by Rowan Atkinson."], ["subtitles", "زیرنویس", "watch it with subtitles."], ["impressionable", "تأثیرپذیر", "Young children are impressionable."], ["plot", "طرح داستان", "plot and actors."]], "grammar": "I don't believe so برای رد مؤدبانهٔ نظر سؤال است. could lead them to imitate: lead someone to do. which decide را می‌توان that decide هم گفت."}, {"id": "l16", "n": 16, "en": "Foreign Country", "fa": "کشور خارجی", "qa": [["Have you ever travelled abroad? If yes, what country was it?", "تا حالا خارج رفته‌اید؟ اگر بله، کدام کشور؟", "Yes, I have. I traveled to the USA last year with my family.", "بله. پارسال با خانواده‌ام به آمریکا رفتم."], ["Where is that country located?", "آن کشور کجا واقع شده؟", "The USA is located in North America.", "آمریکا در آمریکای شمالی است."], ["What is it famous for?", "به چه چیز معروف است؟", "The USA is known for its cultural achievements and landmarks.", "آمریکا به دستاوردهای فرهنگی و نمادهایش معروف است."], ["What are the special food and drinks of that country?", "غذا و نوشیدنی خاص آن کشور چیست؟", "There are many. They are known for fast food, dairy and many beverages.", "زیاد است. به فست‌فود، لبنیات و نوشیدنی‌های گوناگون معروف‌اند."], ["What do you like about that country?", "دربارهٔ آن کشور چه چیزی را دوست دارید؟", "I like the fast pace of life and the various subcultures.", "سرعت زندگی و خرده‌فرهنگ‌های گوناگون را دوست دارم."], ["How many citizens are there in that country?", "آن کشور چند شهروند دارد؟", "The population of the United States was over 324 million in 2016, which accounted for 4.3% of the world population.", "جمعیت آمریکا در سال ۲۰۱۶ بیش از ۳۲۴ میلیون نفر بود، یعنی ۴٫۳ درصد جمعیت جهان."], ["What language do people there speak?", "مردم آنجا چه زبانی حرف می‌زنند؟", "The national language is English, but many people also speak Spanish, French, German and Chinese.", "زبان ملی انگلیسی است، ولی خیلی‌ها اسپانیایی، فرانسوی، آلمانی و چینی هم حرف می‌زنند."], ["Do you want to go back there again?", "می‌خواهید دوباره آنجا بروید؟", "Sure.", "حتماً."], ["Why do people like to travel abroad?", "چرا مردم دوست دارند خارج بروند؟", "They want to discover new places, learn new cultures and maybe speak new languages.", "می‌خواهند جاهای تازه کشف کنند، فرهنگ تازه بیاموزند و شاید زبان تازه حرف بزنند."]], "vocab": [["be famous for / be known for", "به چیزی معروف بودن", "حرف اضافه for. famous for landmarks."], ["pace of life", "سرعت زندگی", "the fast pace of life."], ["subculture", "خرده‌فرهنگ", "various subcultures."], ["account for", "تشکیل دادن، درصد را شامل شدن", "which accounts for 4.3%."], ["national language", "زبان ملی", "با mother tongue زبان مادری فرق دارد."], ["discover", "کشف کردن", "discover new places. مترادف ساده‌تر: find / explore."]], "grammar": "be known for با for می‌آید، نه to. which accounted for به عدد قبل برمی‌گردد. آمار ۲۰۱۶ قدیمی است؛ در جواب واقعی می‌توانید بگویید I'm not sure of the exact figure."}, {"id": "l17", "n": 17, "en": "Parties", "fa": "مهمانی", "qa": [["On what occasions do people in your country celebrate parties?", "در کشور شما مردم در چه مناسبت‌هایی مهمانی می‌گیرند؟", "There are many occasions, such as New Year's Eve, wedding engagements, family reunions and birthdays, but sometimes people hold parties just when they meet up and want to have fun.", "مناسبت زیاد است، مثل شب سال نو، نامزدی، دورهمی خانوادگی و تولد، ولی گاهی فقط وقتی همدیگر را می‌بینند و دلشان تفریح می‌خواهد مهمانی می‌گیرند."], ["Are you a party animal?", "اهل مهمانی و شب‌زنده‌داری هستید؟", "Yes, I am. I'm crazy about going to parties. I love meeting friends, drinking and talking.", "بله. عاشق مهمانی رفتنم. دوست دارم دوستان را ببینم، چیزی بنوشم و حرف بزنم."], ["When do parties often start and finish?", "مهمانی‌ها معمولاً کی شروع و تمام می‌شوند؟", "It depends on the kind of party. I believe the perfect time is in the evening, from 8 to 11 pm.", "بستگی به نوع مهمانی دارد. فکر می‌کنم زمان عالی عصر است، از ۸ تا ۱۱."], ["Where are the parties thrown?", "مهمانی‌ها کجا برگزار می‌شوند؟", "They are held inside or outside. Formal events like weddings are organized inside, while family reunions and birthdays may be held outside.", "داخل یا بیرون. مراسم رسمی مثل عروسی داخل برگزار می‌شود، در حالی که دورهمی خانواده و تولد ممکن است بیرون باشد."], ["What do you usually wear when you come to a party?", "وقتی به مهمانی می‌روید معمولاً چه می‌پوشید؟", "I often wear casual clothes like a T-shirt and jeans for informal parties, and a dress for formal ones.", "برای مهمانی غیررسمی لباس راحت مثل تی‌شرت و شلوار جین، و برای رسمی پیراهن مجلسی."], ["What do people do at the parties you attended?", "در مهمانی‌هایی که رفته‌اید مردم چه می‌کنند؟", "People talk, eat and drink together. Some go there to find business opportunities and new partners.", "حرف می‌زنند، می‌خورند و می‌نوشند. بعضی‌ها برای پیدا کردن فرصت کاری و شریک تازه می‌روند."], ["Do you enjoy drinking alcohol at parties?", "در مهمانی مشروب نوشیدن را دوست دارید؟", "Yes, a little beer can cheer me up.", "بله، کمی آبجو حالم را بهتر می‌کند."], ["Do people have to bring anything to the party?", "مردم باید چیزی به مهمانی ببرند؟", "It's not required, but sometimes visitors bring gifts to show their love for the host.", "اجباری نیست، ولی گاهی مهمان‌ها برای نشان دادن علاقه‌شان به میزبان هدیه می‌برند."], ["Why do people, especially young people, love going to parties?", "چرا مردم، به‌خصوص جوان‌ها، مهمانی را دوست دارند؟", "It's just a good way for them to chill out after a long day.", "راه خوبی است برای اینکه بعد از یک روز طولانی آرام شوند."]], "vocab": [["party animal", "کسی که عاشق مهمانی است", "اصطلاح غیررسمی. Are you a party animal?"], ["be crazy about", "شیفتهٔ چیزی بودن", "crazy about going to parties. بعد از about فعل -ing."], ["throw / hold a party", "مهمانی گرفتن", "throw کمی غیررسمی‌تر از hold است."], ["casual / formal", "راحت / رسمی", "casual clothes در برابر a dress for formal ones."], ["cheer someone up", "حال کسی را بهتر کردن", "A little beer can cheer me up."], ["chill out", "ریلکس کردن، آرام شدن", "غیررسمی. chill out after a long day."]], "grammar": "while برای تضاد دو وضعیت هم‌زمان است: inside, while others may be held outside. engagements در متن اصلی engagments غلط املایی است."}, {"id": "l18", "n": 18, "en": "Teacher", "fa": "معلم", "qa": [["Who is your favorite teacher?", "معلم مورد علاقه‌تان کیست؟", "I like Mr. Tom the most. He is my English teacher.", "آقای تام را از همه بیشتر دوست دارم. معلم انگلیسی من است."], ["Is he a foreign teacher?", "معلم خارجی است؟", "Yes, he's from the US.", "بله، اهل آمریکاست."], ["What do you like about his lessons?", "دربارهٔ کلاس‌هایش چه چیزی را دوست دارید؟", "I have fallen in love with his American accent, and he always shows us something new about the world outside the textbooks.", "عاشق لهجهٔ آمریکایی‌اش شده‌ام و همیشه چیزی تازه از دنیای بیرون کتاب نشانمان می‌دهد."], ["What's he like?", "او چه جور آدمی است؟", "He's not only knowledgeable but also very friendly. He always treats us like friends, not students.", "نه‌تنها داناست، بلکه خیلی هم دوستانه است. همیشه با ما مثل دوست رفتار می‌کند، نه شاگرد."], ["What does he usually wear when coming to class?", "وقتی به کلاس می‌آید معمولاً چه می‌پوشد؟", "He usually wears a gray suit when he comes to class.", "معمولاً کت‌وشلوار خاکستری می‌پوشد."], ["Do you love his subject?", "درس او را دوست دارید؟", "Yes, I enjoy English a lot.", "بله، انگلیسی را خیلی دوست دارم."], ["Do students in your class like him?", "شاگردان کلاس شما او را دوست دارند؟", "Yes, all of us admire him.", "بله، همه‌مان تحسینش می‌کنیم."], ["Do you want to be a teacher like him?", "می‌خواهید معلمی مثل او شوید؟", "No. Although I like him, my dream is not to become a teacher. I would like to be a chef.", "نه. هرچند دوستش دارم، رؤیایم معلم شدن نیست. می‌خواهم آشپز شوم."], ["Have you ever been punished by him?", "تا حالا از او تنبیه شده‌اید؟", "No, he rarely punishes anyone.", "نه، به‌ندرت کسی را تنبیه می‌کند."], ["Do you want to see him again?", "می‌خواهید دوباره ببینیدش؟", "Of course. He's a great mentor.", "البته. مربی خیلی خوبی است."]], "vocab": [["fall in love with", "عاشق چیزی شدن", "حال کامل: I have fallen in love with his accent. یعنی از یک نقطه عاشق شده‌ام و هنوز هستم."], ["not only ... but also", "نه‌تنها ... بلکه", "He's not only knowledgeable but also friendly."], ["treat someone like", "با کسی مثل ... رفتار کردن", "treats us like friends."], ["admire", "تحسین کردن", "all of us admire him."], ["although / even though / though", "هرچند", "هر سه تضاد می‌سازند. even though قوی‌تر است. though می‌تواند آخر جمله بیاید. however جملهٔ تازه را شروع می‌کند و ربط‌دهندهٔ درون‌جمله‌ای نیست."], ["mentor", "مربی، راهنما", "قوی‌تر از teacher؛ کسی که راه نشان می‌دهد."], ["approachable", "در دسترس و خوش‌برخورد", "واژهٔ حاشیه‌نویسی کتاب. an approachable teacher یعنی شاگرد راحت با او حرف می‌زند."]], "grammar": "در حاشیهٔ کتاب واژه‌های جایگزین آمده: learners/pupils به‌جای students، tactful باسیاست، approachable خوش‌برخورد. although، though، even though و however را قاطی نکنید. however معمولاً اول جملهٔ بعد می‌آید: I like him. However, I don't want to be a teacher."}, {"id": "l19", "n": 19, "en": "Friend", "fa": "دوست", "qa": [["Who's your best friend?", "بهترین دوستتان کیست؟", "It's Jenny. She's my best friend.", "جنی. او بهترین دوست من است."], ["What does she look like?", "قیافه‌اش چطور است؟", "She has shoulder-length brown hair. I just love her lovely smile.", "موی قهوه‌ای تا شانه دارد. لبخند دوست‌داشتنی‌اش را خیلی دوست دارم."], ["How and when did you meet?", "چطور و کی آشنا شدید؟", "I first met her when we were in high school.", "اولین بار در دبیرستان دیدمش."], ["How often do you see this friend?", "چند وقت یک‌بار این دوست را می‌بینید؟", "I see her every day. We're in the same class.", "هر روز. هم‌کلاسی هستیم."], ["What's she like?", "اخلاقش چطور است؟", "She's not only thoughtful but also very understanding. She's always by my side to cheer me up whenever I'm in trouble.", "نه‌تنها باملاحظه است، بلکه خیلی هم درک‌کننده است. هر وقت مشکل دارم کنارم است تا حالم را بهتر کند."], ["Do you and she share anything in common?", "شما و او وجه مشترکی دارید؟", "Yes, a lot. We both love shopping and playing sports.", "بله، زیاد. هر دو خرید و ورزش را دوست داریم.", "Do you and she", "you and her در جایگاه فاعل معیار نیست؛ you and she درست‌تر است."], ["What do you and she do together?", "با هم چه می‌کنید؟", "We usually do homework and read books together.", "معمولاً با هم تکلیف می‌کنیم و کتاب می‌خوانیم."], ["Have you and she ever quarreled?", "تا حالا دعوا کرده‌اید؟", "Yes, but we seldom quarrel. When we do argue, afterwards we seem to understand each other more.", "بله، ولی به‌ندرت. وقتی بحث می‌کنیم، بعدش انگار همدیگر را بهتر می‌فهمیم."], ["Does she know how to cook?", "آشپزی بلد است؟", "Yes, but she's not a great cook.", "بله، ولی آشپز خیلی خوبی نیست."], ["Do your parents like her?", "والدینتان او را دوست دارند؟", "Yes, a lot. They always ask Jenny to come over for dinner.", "بله، خیلی. همیشه جنی را برای شام دعوت می‌کنند."], ["Why is a friend important in life?", "چرا دوست در زندگی مهم است؟", "A good friend can make your life better in many ways. I don't think anyone can stand loneliness.", "دوست خوب زندگی را از خیلی جهت بهتر می‌کند. فکر نمی‌کنم کسی تنهایی را تحمل کند."]], "vocab": [["What does she look like?", "قیافه‌اش چطور است؟", "برای ظاهر. What's she like? برای شخصیت است. این دو را قاطی نکنید."], ["shoulder-length", "تا شانه", "صفت مرکب برای مو. shoulder-length hair."], ["thoughtful / understanding", "باملاحظه / درک‌کننده", "thoughtful یعنی به فکر بقیه. understanding یعنی اهل درک."], ["by my side", "کنار من", "She's always by my side."], ["have something in common", "وجه مشترک داشتن", "share anything in common."], ["quarrel / argue", "جر و بحث کردن", "quarrel کمی روزمره‌تر. seldom quarrel یعنی به‌ندرت."], ["stand", "تحمل کردن", "I can't stand loneliness. اینجا stand یعنی تحمل، نه ایستادن."]], "grammar": "look like برای ظاهر و be like برای شخصیت است. know how to cook: بعد از how to فعل ساده می‌آید."}, {"id": "l20", "n": 20, "en": "Hotel", "fa": "هتل", "qa": [["What is your favorite hotel? Where is it located?", "هتل مورد علاقه‌تان چیست؟ کجاست؟", "It's the Sheraton, a five-star hotel located in Saigon, Vietnam.", "شراتون، هتل پنج‌ستاره در سایگون ویتنام."], ["How do you know that hotel?", "آن هتل را از کجا می‌شناسید؟", "Before coming to Vietnam, I searched on the Internet. It's one of the best hotels in Vietnam.", "پیش از آمدن به ویتنام در اینترنت گشتم. یکی از بهترین هتل‌های ویتنام است."], ["Why do you choose to stay in that particular hotel?", "چرا همان هتل را برای ماندن انتخاب می‌کنید؟", "I like the architecture there, and online all the reviews about the hotel are positive.", "معماری‌اش را دوست دارم و همهٔ نظرهای آنلاین درباره‌اش مثبت است."], ["Is it by the beach?", "کنار ساحل است؟", "No, Saigon is not a beachside city.", "نه، سایگون شهر ساحلی نیست."], ["Does it attract many tourists?", "گردشگر زیادی جذب می‌کند؟", "Yes, I guess. When I stayed there, it was completely booked.", "فکر می‌کنم بله. وقتی آنجا ماندم کاملاً پر بود."], ["What type of room did you stay in and what facilities did you get?", "در چه اتاقی ماندید و چه امکاناتی داشتید؟", "I stayed in a double-bed room. The room is equipped with an air conditioner, a flat-screen TV, a wardrobe and so on.", "اتاق دو تخته. کولر، تلویزیون صفحه‌تخت، کمد و مانند این‌ها داشت."], ["What do you like about that hotel?", "دربارهٔ آن هتل چه چیزی را دوست دارید؟", "A gym, a swimming pool and a barbecue area are available. I also love the green space surrounding the hotel.", "باشگاه، استخر و فضای باربکیو دارد. فضای سبز دور هتل را هم دوست دارم."], ["Are all the staff friendly and helpful?", "همهٔ کارکنان دوستانه و کمک‌کننده‌اند؟", "Yes, definitely. They are all professional.", "بله، قطعاً. همه‌شان حرفه‌ای‌اند."], ["How much does it cost a night?", "شبی چقدر هزینه دارد؟", "It costs me around $250 a night.", "حدود ۲۵۰ دلار در شب."], ["Do you recommend that hotel to friends?", "آن هتل را به دوستان پیشنهاد می‌کنید؟", "Yes, if they come to Vietnam. I love everything there.", "بله، اگر به ویتنام بیایند. همه‌چیز آنجا را دوست دارم."]], "vocab": [["five-star", "پنج‌ستاره", "صفت مرکب. a five-star hotel."], ["review", "نظر کاربران", "all the reviews are positive."], ["completely booked", "کاملاً رزروشده", "it was completely booked یعنی اتاق خالی نداشت."], ["be equipped with", "مجهز بودن به", "The room is equipped with an air conditioner."], ["available", "موجود، در دسترس", "A gym is available."], ["staff", "کارکنان", "staff معمولاً جمع معنی می‌دهد. The staff are professional."]], "grammar": "cost با مفعول شخص: It costs me $250. a night یا per night هر دو درست است. Saigon نام قدیمی هوچی‌مین است؛ اگر بخواهید امروزی بگویید Ho Chi Minh City."}, {"id": "l21", "n": 21, "en": "Letter", "fa": "نامه", "qa": [["Who wrote the letter to you?", "نامه را چه کسی برایتان نوشت؟", "My dad wrote the letter to me when he was on a business trip.", "پدرم وقتی سفر کاری بود نامه را نوشت."], ["Did you keep the letter?", "نامه را نگه داشتید؟", "Yes, I put it in a folder. Whenever I'm down, reading his letter is a good way to cheer me up.", "بله، در یک پوشه گذاشتم. هر وقت حالم گرفته است، خواندن نامه‌اش حال مرا بهتر می‌کند."], ["What was the letter about?", "نامه دربارهٔ چه بود؟", "He told me about his new workplace and how things were there.", "دربارهٔ محل کار تازه‌اش و وضع آنجا برایم نوشت."], ["How did you feel about the letter?", "دربارهٔ نامه چه حسی داشتید؟", "I was glad to know that he was fine in another city.", "خوشحال شدم که در شهر دیگر حالش خوب است."], ["Do you have a letter collection?", "مجموعهٔ نامه دارید؟", "Yes. I collect all the letters from family and friends. It's one of my hobbies.", "بله. همهٔ نامه‌های خانواده و دوستان را جمع می‌کنم. یکی از سرگرمی‌های من است."], ["Do you like writing letters or emails?", "نامه نوشتن را دوست دارید یا ایمیل؟", "I prefer writing paper letters.", "نامهٔ کاغذی را ترجیح می‌دهم."], ["Do people in your country usually write letters?", "در کشور شما مردم معمولاً نامه می‌نویسند؟", "Years ago they did. Now people prefer emails.", "سال‌ها پیش بله. حالا ایمیل را ترجیح می‌دهند."], ["What's the difference between emails and handwritten letters?", "فرق ایمیل و نامهٔ دست‌نویس چیست؟", "Emails are much more convenient than letters because they're free to send and they arrive instantly. However, letters are much more special.", "ایمیل خیلی راحت‌تر است چون فرستادنش رایگان است و فوری می‌رسد. اما نامه خیلی خاص‌تر است."], ["Why should we write letters to friends or relatives?", "چرا باید به دوستان یا خویشان نامه بنویسیم؟", "It's a good way to show love to people you care about.", "راه خوبی برای نشان دادن علاقه به کسانی است که برایتان مهم‌اند."]], "vocab": [["be down", "حوصلۀ کسی سر رفته، دلگیر بودن", "غیررسمی. Whenever I'm down."], ["handwritten", "دست‌نویس", "handwritten letters در برابر emails."], ["convenient", "راحت، مناسب", "much more convenient than letters."], ["instantly", "فوراً", "they get there instantly."], ["care about", "برای کسی اهمیت قائل بودن", "people you care about."], ["However", "با این حال", "جملهٔ تازه را با تضاد شروع می‌کند."]], "grammar": "prefer writing: بعد از prefer اگر فعل باشد -ing طبیعی است. Years ago they did: did جای wrote letters را می‌گیرد تا تکرار نشود."}, {"id": "l22", "n": 22, "en": "Hobbies", "fa": "سرگرمی‌ها", "qa": [["What is your hobby?", "سرگرمی‌تان چیست؟", "I like playing sports, especially swimming.", "ورزش را دوست دارم، به‌خصوص شنا."], ["Is your hobby common in your country?", "سرگرمی‌تان در کشور شما رایج است؟", "Yes. Kids, adults and senior citizens all like swimming in my country.", "بله. بچه، بزرگسال و سالمند همه در کشورم شنا را دوست دارند."], ["Is your hobby the same as when you were a child?", "سرگرمی‌تان مثل کودکی است؟", "Yes, I was fond of swimming when I was a little girl.", "بله، از بچگی به شنا علاقه داشتم."], ["When did you start practicing that hobby?", "کی شروع به این سرگرمی کردید؟", "I started swimming when I was 5 years old.", "از ۵ سالگی شنا را شروع کردم."], ["Is there anybody in your family who you share your hobby with?", "در خانواده‌تان کسی هست که این سرگرمی را با او شریک باشید؟", "My dad. He taught me how to swim.", "پدرم. او شنا را یادم داد."], ["How much time do you spend on your hobby?", "چقدر وقت برای سرگرمی‌تان می‌گذارید؟", "I usually go to the swimming pool twice a week.", "معمولاً هفته‌ای دو بار استخر می‌روم."], ["What benefits do you get from it?", "از آن چه فایده‌ای می‌برید؟", "Swimming is a really good workout. It helps me keep fit and chill out after a long day at work.", "شنا ورزش خیلی خوبی است. کمکم می‌کند تناسبم را حفظ کنم و بعد از کار طولانی آرام شوم."], ["Have you ever heard of someone having a very unusual hobby? What was it?", "تا حالا شنیده‌اید کسی سرگرمی خیلی غیرعادی داشته باشد؟", "Yes, my cousin loves putting stickers all over his car.", "بله، پسرعمویم دوست دارد همه‌جای ماشینش برچسب بزند.", "putting stickers", "در اصل tattooing vehicles آمده؛ اگر منظور برچسب است sticker درست‌تر است. tattoo یعنی خالکوبی."], ["What do you think about someone having unusual hobbies?", "دربارهٔ کسی که سرگرمی عجیب دارد چه فکر می‌کنید؟", "I don't think any hobby is weird. It's just what you like to do, so I don't judge others.", "فکر نمی‌کنم هیچ سرگرمی‌ای عجیب باشد. فقط کاری است که دوست دارید، پس دیگران را قضاوت نمی‌کنم."], ["What hobbies are usually expensive in your country?", "در کشور شما کدام سرگرمی‌ها معمولاً گران‌اند؟", "Playing golf is a really expensive hobby. Only the rich can afford to buy golf supplies.", "گلف سرگرمی خیلی گرانی است. فقط ثروتمندان از پس خرید وسایلش برمی‌آیند."]], "vocab": [["be fond of", "علاقه داشتن به", "I was fond of swimming. مثل like، ولی کمی ادبی‌تر."], ["keep fit", "تناسب اندام را حفظ کردن", "helps me keep fit."], ["workout", "تمرین ورزشی", "a good workout."], ["afford to", "از پس هزینهٔ کاری برآمدن", "can afford to buy. afford با to-infinitive."], ["judge others", "دیگران را قضاوت کردن", "I don't judge others."], ["senior citizen", "سالمند", "مؤدبانه‌تر از old person."]], "grammar": "start swimming یا start to swim هر دو درست است. twice a week جای قید تکرار است و معمولاً آخر جمله می‌آید."}, {"id": "l23", "n": 23, "en": "Music", "fa": "موسیقی", "qa": [["What kind of music do you like?", "چه نوع موسیقی دوست دارید؟", "I'm crazy about pop music.", "شیفتهٔ موسیقی پاپم."], ["Is that the kind of music preferred in your country?", "این نوع موسیقی در کشور شما ترجیح داده می‌شود؟", "It varies. Normally young people enjoy rock and pop, while middle-aged people prefer country music.", "فرق می‌کند. معمولاً جوان‌ها راک و پاپ را دوست دارند، در حالی که میانسال‌ها موسیقی کانتری را ترجیح می‌دهند."], ["Who is your favorite singer?", "خوانندهٔ مورد علاقه‌تان کیست؟", "I'm a big fan of Miley Cyrus, a talented US singer, songwriter and actress.", "طرفدار پرشور مایلی سایرِس‌ام؛ خواننده، ترانه‌سرا و بازیگر بااستعداد آمریکایی."], ["What piece of music do you like? Who sang that song?", "کدام قطعه را دوست دارید؟ چه کسی خوانده؟", "My favorite song is Jolene, sung by Miley Cyrus.", "آهنگ مورد علاقه‌ام جولین است، با صدای مایلی سایرِس."], ["How much time a day do you spend listening to music?", "در روز چقدر به موسیقی گوش می‌دهید؟", "I usually listen to music all day with an MP3 player.", "معمولاً تمام روز با دستگاه ام‌پی‌تری."], ["Do you feel relaxed listening to music?", "با گوش دادن به موسیقی آرام می‌شوید؟", "Sure. I feel like there are no more worries in the world.", "حتماً. حس می‌کنم دیگر نگرانی‌ای در دنیا نیست."], ["Why is music important to us?", "چرا موسیقی برای ما مهم است؟", "Music has the power of beautifying our life.", "موسیقی قدرت زیبا کردن زندگی ما را دارد."], ["Do you usually go to bars or clubs?", "معمولاً بار یا کلاب می‌روید؟", "Not often. I sometimes go there on weekends.", "نه اغلب. گاهی آخر هفته می‌روم."], ["What do you think about teenagers' music taste?", "دربارهٔ سلیقهٔ موسیقی نوجوان‌ها چه فکر می‌کنید؟", "Teenagers tend to choose loud and fast music like rock or rap. Everyone has their own taste, though.", "نوجوان‌ها معمولاً موسیقی بلند و تند مثل راک یا رپ را انتخاب می‌کنند. البته هر کس سلیقهٔ خودش را دارد."], ["Have you ever thought of forming a music band?", "تا حالا به تشکیل گروه موسیقی فکر کرده‌اید؟", "No, I don't have any talent for music.", "نه، استعداد موسیقی ندارم."]], "vocab": [["a big fan of", "طرفدار پرشور", "I'm a big fan of her."], ["piece of music", "قطعهٔ موسیقی", "What piece of music do you like?"], ["tend to", "تمایل داشتن به", "Teenagers tend to choose loud music."], ["have a talent for", "استعداد چیزی را داشتن", "I don't have any talent for music. حرف اضافه for."], ["though", "البته، با این حال", "آخر جمله برای تضاد نرم: Everyone has their own taste, though."], ["beautify", "زیبا کردن", "beautifying our life. فعل از صفت beautiful."]], "grammar": "though آخر جمله خیلی گفتاری و برای اسپیکینگ طبیعی است. sung by وصف مجهول کوتاه است: a song sung by Miley Cyrus."}, {"id": "l24", "n": 24, "en": "Shopping", "fa": "خرید", "qa": [["Do you like shopping?", "خرید را دوست دارید؟", "Yes, I'm a shopaholic.", "بله، خرید کردن برایم مثل اعتیاد است."], ["What do you usually shop for?", "معمولاً چه چیزی می‌خرید؟", "I usually shop for clothes. I'm a big fashion fan.", "معمولاً لباس. طرفدار پرشور مدم."], ["Where do you go shopping?", "کجا خرید می‌کنید؟", "At some fashion boutiques in my neighborhood.", "در چند بوتیک مد در محله‌ام."], ["Are there many shops in your neighborhood?", "در محله‌تان مغازه زیاد است؟", "Yes. My area is the city center, so I have many choices of where to shop.", "بله. منطقه‌ام مرکز شهر است، پس انتخاب زیاد دارم."], ["Do you spend much money on shopping?", "پول زیادی برای خرید خرج می‌کنید؟", "Yes, and I'm usually broke at the end of the month.", "بله، و معمولاً آخر ماه بی‌پولم."], ["Do you usually shop online? What items?", "معمولاً آنلاین خرید می‌کنید؟ چه چیزهایی؟", "Yes, but not really often. I only buy furniture online.", "بله، ولی نه خیلی زیاد. فقط مبلمان را آنلاین می‌خرم."], ["What's the difference between shopping online and offline?", "فرق خرید آنلاین و حضوری چیست؟", "Unlike shopping offline, you cannot try on clothes or check the material when shopping online.", "بر خلاف خرید حضوری، در خرید آنلاین نمی‌توانید لباس را پرو کنید یا جنس پارچه را بررسی کنید."]], "vocab": [["shopaholic", "کسی که به خرید معتاد است", "مثل workaholic. غیررسمی و کمی شوخ."], ["shop for", "برای خرید چیزی گشتن", "shop for clothes. for نوع کالا را می‌گوید."], ["broke", "بی‌پول", "غیررسمی. I'm broke. صفت است، نه فعل شکستن."], ["try on", "پرو کردن", "فعل چندبخشی. try on clothes. ضمیر وسط می‌آید: try them on."], ["unlike", "بر خلاف", "حرف اضافه. Unlike shopping offline, ..."], ["boutique", "بوتیک", "مغازهٔ کوچک مد."]], "grammar": "spend money on something: on حرف اضافه است. choices of where to shop: where to + فعل ساده."}, {"id": "l25", "n": 25, "en": "Holiday", "fa": "تعطیلات", "qa": [["Where did you go for your holiday?", "برای تعطیلات کجا رفتید؟", "Last year I went to Singapore, a Southeast Asian country.", "پارسال به سنگاپور رفتم، کشوری در جنوب شرق آسیا."], ["Why did you choose that destination?", "چرا آن مقصد را انتخاب کردید؟", "I love traveling to Asian countries, and Singapore was my best choice because of its beauty and culture.", "دوست دارم به کشورهای آسیایی سفر کنم و سنگاپور به‌خاطر زیبایی و فرهنگش بهترین انتخابم بود."], ["How long did it last?", "چقدر طول کشید؟", "I stayed there for 2 weeks.", "دو هفته آنجا ماندم."], ["Who went with you?", "چه کسی با شما آمد؟", "I traveled to Singapore with my best friends.", "با بهترین دوستانم به سنگاپور رفتم."], ["How did you travel?", "چطور سفر کردید؟", "We flew there, of course. While we were there, we mostly moved by MRT and taxi.", "البته پرواز کردیم. آنجا بیشتر با مترو و تاکسی جابه‌جا شدیم."], ["What did you pack?", "چه چیزهایی بستید؟", "I only brought necessary items such as money, clothes, medicine, a map and a digital camera.", "فقط چیزهای ضروری مثل پول، لباس، دارو، نقشه و دوربین دیجیتال بردم."], ["What did you do during the holiday?", "در تعطیلات چه کردید؟", "We visited famous attractions like Marina Bay Sands, Merlion Park, the ArtScience Museum and the Singapore Flyer. We also enjoyed the local cuisine.", "جاهای معروف مثل مارینا بی، پارک مرلاین، موزهٔ هنر و علم و چرخ‌وفلک سنگاپور را دیدیم. غذای محلی را هم خوردیم."], ["What's the difference between holidays today and 20 years ago?", "فرق تعطیلات امروز با ۲۰ سال پیش چیست؟", "It has changed a lot. People can now afford holidays outside their countries, while 20 years ago traveling abroad seemed hard.", "خیلی عوض شده. مردم حالا از پس تعطیلات خارجی برمی‌آیند، در حالی که ۲۰ سال پیش سفر خارج سخت به نظر می‌رسید."], ["At what time do people in your country usually go on holiday?", "مردم کشور شما معمولاً کی به تعطیلات می‌روند؟", "It depends on their job. When they have a break from work, they find somewhere to travel.", "بستگی به شغلشان دارد. وقتی از کار مرخصی دارند، جایی برای سفر پیدا می‌کنند."]], "vocab": [["destination", "مقصد", "choose that destination."], ["because of", "به‌خاطر", "because of + اسم. because + جمله."], ["last", "طول کشیدن", "How long did it last? فاعل سفر یا تعطیلات است."], ["MRT", "مترو", "Mass Rapid Transit، نام رایج مترو در چند شهر آسیایی."], ["go on holiday", "به تعطیلات رفتن", "بریتانیایی. آمریکایی بیشتر go on vacation."], ["have a break from work", "از کار مرخصی داشتن", "a break from work."]], "grammar": "for با مدت می‌آید: for 2 weeks. while برای مقایسهٔ دو زمان. ArtScience در متن اصلی Artsience غلط نوشته شده."}, {"id": "l26", "n": 26, "en": "Animals", "fa": "حیوانات", "qa": [["Are you an animal lover?", "حیوان‌دوست هستید؟", "Yes, I am. I love animals.", "بله. حیوانات را دوست دارم."], ["Are you raising any pets?", "حیوان خانگی دارید؟", "Yes, I have a pit bull puppy at home.", "بله، یک توله پیت‌بول در خانه دارم."], ["What is it like?", "اخلاقش چطور است؟", "My puppy is friendly, highly intelligent and well-behaved. He always wags his tail and licks my hand to welcome me home.", "توله‌ام دوستانه، خیلی باهوش و مؤدب است. همیشه برای خوشامد دم تکان می‌دهد و دستم را می‌لیسد."], ["What does it look like?", "قیافه‌اش چطور است؟", "He's a medium-sized puppy with a strong neck, a broad chest and brown hair.", "تولهٔ میان‌جثه با گردن قوی، سینهٔ پهن و موی قهوه‌ای."], ["What are its habits?", "عادت‌هایش چیست؟", "My puppy loves exercising every day. When he plays, he plays to win.", "توله‌ام هر روز ورزش را دوست دارد. وقتی بازی می‌کند، برای بردن بازی می‌کند."], ["What do you usually do with it?", "معمولاً با او چه می‌کنید؟", "We usually play tennis together. My puppy helps me pick up the balls.", "معمولاً با هم تنیس بازی می‌کنیم. توله‌ام کمکم می‌کند توپ‌ها را جمع کنم."], ["What does it like to eat?", "چه چیزی دوست دارد بخورد؟", "He loves beef, chicken and some dairy products.", "گوشت گاو، مرغ و کمی لبنیات را دوست دارد."], ["What do you learn from it?", "از او چه یاد می‌گیرید؟", "He teaches me loyalty. An adult pit bull may make me feel safe.", "وفاداری یادم می‌دهد. پیت‌بول بالغ ممکن است حس امنیت بدهد."], ["Why do people keep pets?", "چرا مردم حیوان خانگی نگه می‌دارند؟", "They consider pets loyal companions which make their life better.", "حیوان خانگی را همراه وفاداری می‌دانند که زندگی را بهتر می‌کند."], ["Are pets well looked after in your country?", "در کشور شما از حیوانات خوب مراقبت می‌شود؟", "Yes. People in my country love pets.", "بله. مردم کشورم حیوانات خانگی را دوست دارند."]], "vocab": [["raise a pet", "حیوان خانگی بزرگ کردن", "Are you raising any pets?"], ["well-behaved", "مؤدب، حرف‌گوش‌کن", "صفت مرکب. a well-behaved puppy."], ["wag its tail", "دم تکان دادن", "متن اصلی waves his tail گفته؛ برای سگ wag طبیعی‌تر است."], ["loyalty", "وفاداری", "اسم. صفت loyal."], ["look after", "مراقبت کردن", "مجهول: Are pets well looked after?"], ["companion", "همدم", "loyal companions."]], "grammar": "look like ظاهر است و be like شخصیت، حتی برای حیوان. which make به companions برمی‌گردد، پس فعل جمع است."}, {"id": "l27", "n": 27, "en": "Practical Skill", "fa": "مهارت عملی", "qa": [["What practical skill have you learned?", "چه مهارت عملی‌ای یاد گرفته‌اید؟", "Cooking is a practical skill that I have practiced recently.", "آشپزی مهارت عملی‌ای است که تازگی تمرین کرده‌ام."], ["Who taught you that skill?", "آن مهارت را چه کسی یادتان داد؟", "My mom is the best cook. She taught me how to make soup, salad, omelettes, cake and so on.", "مادرم بهترین آشپز است. یادم داد سوپ، سالاد، املت، کیک و مانند این‌ها بپزم."], ["How did you learn it?", "چطور یاد گرفتید؟", "She shows me how to buy food, prepare ingredients and cook whenever she's in the kitchen. I learn how to boil, grill, steam, fry and braise day by day.", "هر وقت آشپزخانه است نشانم می‌دهد چطور خرید کنم، مواد را آماده کنم و بپزم. روزبه‌روز جوشاندن، کباب کردن، بخارپز، سرخ کردن و تفت دادن را یاد می‌گیرم."], ["Why did you learn it?", "چرا یاد گرفتید؟", "I want to be a good cook like my mom when I get married. I will prepare the best dishes for my husband and children.", "می‌خواهم وقتی ازدواج کردم مثل مادرم آشپز خوبی باشم و بهترین غذاها را برای همسر و فرزندانم آماده کنم."], ["How long did it take you to learn it?", "یاد گرفتنش چقدر طول کشید؟", "I learned it over 4 years. The skill became stronger when I lived apart from my family for my studies.", "در طول ۴ سال یاد گرفتم. وقتی برای درس از خانواده جدا زندگی کردم، مهارت قوی‌تر شد."], ["How often do you use this skill?", "چند وقت یک‌بار از این مهارت استفاده می‌کنید؟", "I cook every day. I also love homemade food.", "هر روز آشپزی می‌کنم. غذای خانگی را هم دوست دارم."], ["How has this skill helped you?", "این مهارت چه کمکی به شما کرده؟", "It makes me more confident whenever I go on a picnic. I'm always responsible for the barbecue.", "هر وقت پیک‌نیک می‌روم مطمئن‌ترم. همیشه مسئول باربکیو هستم."], ["Do people in your family know this skill too?", "در خانواده‌تان دیگران هم این مهارت را بلدند؟", "My younger sister knows how to cook too. She has just started learning.", "خواهر کوچک‌ترم هم آشپزی بلد است. تازه شروع به یادگیری کرده."], ["Do all skills need learning?", "همهٔ مهارت‌ها نیاز به یادگیری دارند؟", "Yes, they do. Practice makes perfect.", "بله. کار نیکو کردن از پر کردن است."], ["How is this skill important to you?", "این مهارت برای شما چه اهمیتی دارد؟", "It's an essential life skill. It helps keep a family warm and happy.", "مهارت ضروری زندگی است. کمک می‌کند خانواده گرم و شاد بماند.", "It helps keep a family warm", "جملهٔ اصلی می‌گوید همهٔ زن‌ها باید این را بلد باشند؛ این تعمیم جنسیتی است و لازم نیست تکرار شود."]], "vocab": [["practical skill", "مهارت عملی", "در برابر academic knowledge."], ["ingredient", "مادهٔ اولیه", "prepare ingredients."], ["day by day", "روزبه‌روز", "I learn day by day."], ["homemade", "خانگی", "homemade food."], ["Practice makes perfect.", "با تمرین کامل می‌شود", "ضرب‌المثل. practice اینجا اسم است."], ["essential", "ضروری", "an essential life skill."]], "grammar": "how to + فعل ساده: how to boil. has just started: just با حال کامل برای کار خیلی تازه."}, {"id": "l28", "n": 28, "en": "Sports", "fa": "ورزش", "qa": [["What sport do you like?", "چه ورزشی دوست دارید؟", "I like playing badminton.", "بدمینتون بازی کردن را دوست دارم."], ["Is it easy to play that sport?", "بازی کردن آن ورزش آسان است؟", "Yes, it's pretty easy to play.", "بله، نسبتاً آسان است."], ["Is that sport popular in your country?", "آن ورزش در کشور شما محبوب است؟", "Yes, it is.", "بله."], ["How long have you been practicing that sport?", "چقدر است که آن ورزش را تمرین می‌کنید؟", "I have been practicing it for 5 years.", "۵ سال است تمرین می‌کنم."], ["Who do you play sports with?", "با چه کسی ورزش می‌کنید؟", "I play badminton with my friends, sometimes with my brother.", "با دوستانم بدمینتون بازی می‌کنم، گاهی با برادرم."], ["How often do you play that sport?", "چند وقت یک‌بار آن ورزش را بازی می‌کنید؟", "I play badminton every weekend.", "هر آخر هفته."], ["What benefits can you get from that sport?", "از آن ورزش چه فایده‌ای می‌برید؟", "It helps strengthen my muscles because I have to move continuously. It is also good for burning calories.", "کمک می‌کند عضلاتم قوی شود چون باید پیوسته حرکت کنم. برای سوزاندن کالری هم خوب است."], ["Do you like watching football? Online or offline?", "فوتبال دیدن را دوست دارید؟ آنلاین یا حضوری؟", "Yes, I do. I like both. Going to the stadium, shouting and cheering, is a good way to release stress.", "بله. هر دو را دوست دارم. رفتن به ورزشگاه و هوار کشیدن راه خوبی برای خالی کردن استرس است."], ["What is your favorite football team?", "تیم فوتبال مورد علاقه‌تان چیست؟", "I like Manchester United, also known as the Red Devils.", "منچستر یونایتد را دوست دارم که به شیاطین سرخ معروف است."], ["Why is sport important?", "چرا ورزش مهم است؟", "Sports are a source of recreation. People can also learn team spirit when they play.", "ورزش منبع تفریح است. آدم‌ها هنگام بازی روحیهٔ تیمی را هم یاد می‌گیرند."]], "vocab": [["have been practicing", "در حال تمرین بوده‌ام", "حال کامل استمراری با for برای مدت ادامه تا حالا."], ["strengthen", "قوی کردن", "strengthen my muscles."], ["burn calories", "کالری سوزاندن", "good for burning calories."], ["release stress", "استرس را خالی کردن", "a good way to release stress."], ["also known as", "که همچنین شناخته می‌شود به", "Manchester United, also known as the Red Devils."], ["team spirit", "روحیهٔ تیمی", "learn team spirit."]], "grammar": "play با نام ورزش بدون the: play badminton. اما play the piano با the است. for 5 years با حال کامل استمراری مدت را نشان می‌دهد."}, {"id": "l29", "n": 29, "en": "School", "fa": "مدرسه", "qa": [["What school did you go to?", "به کدام مدرسه رفتید؟", "I went to Millennium High School, founded in 1999.", "به دبیرستان میلنیوم رفتم که سال ۱۹۹۹ تأسیس شد."], ["Where is the school located?", "مدرسه کجاست؟", "It's located in New York City, in the United States.", "در نیویورک، آمریکا."], ["Do you like the architecture of the school?", "معماری مدرسه را دوست دارید؟", "Yes, I do. The architecture is not really impressive, but I like it that the architects left plenty of space for lounging.", "بله. معماری خیلی چشمگیر نیست، ولی دوست دارم معمارها فضای زیاد برای لم دادن گذاشته‌اند."], ["What are the teachers like?", "معلم‌ها چطورند؟", "Most of the teachers there are helpful and friendly. I especially like Mr. Mike, my Physics teacher.", "بیشتر معلم‌ها کمک‌کننده و دوستانه‌اند. به‌خصوص آقای مایک، معلم فیزیکم، را دوست دارم."], ["How long have you spent there?", "چقدر آنجا بوده‌اید؟", "I spent 3 years of upper secondary school there.", "۳ سال دبیرستان را آنجا گذراندم.", "I spent", "اگر تمام شده، گذشتهٔ ساده از حال کامل دقیق‌تر است."], ["Is that a single-sex school?", "مدرسهٔ تک‌جنسیتی است؟", "No, it isn't. It is a co-ed school.", "نه. مدرسهٔ مختلط است."], ["Do you like the school uniform?", "یونیفرم مدرسه را دوست دارید؟", "We don't wear uniforms at school, actually.", "در واقع در مدرسه یونیفرم نمی‌پوشیم."], ["Why do you enjoy the time there?", "چرا از وقتتان آنجا لذت می‌برید؟", "Although I had to deal with quite a heavy workload, I enjoyed the relaxing atmosphere when hanging out with friends in the cafeteria.", "هرچند باید
