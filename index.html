با حجم کار سنگین کنار می‌آمدم، از فضای آرام وقتی با دوستان در بوفه وقت می‌گذراندم لذت می‌بردم."], ["What important lesson did you learn from school?", "از مدرسه چه درس مهمی گرفتید؟", "I learned how to work in a group with friends from different cultures. That's the lesson of cooperation.", "یاد گرفتم در گروهی با دوستان از فرهنگ‌های مختلف کار کنم. این درس همکاری است."], ["Will you recommend that school to others?", "آن مدرسه را به دیگران پیشنهاد می‌کنید؟", "Yes, of course. I'm proud to recommend Millennium High School to anyone looking for a good place to learn.", "البته. افتخار می‌کنم آن را به هر کس که دنبال جای خوب برای یادگیری است پیشنهاد کنم."]], "vocab": [["founded in", "تأسیس‌شده در", "وصف کوتاه: a school founded in 1999."], ["plenty of", "مقدار زیاد", "plenty of space. با اسم شمارش‌ناپذیر یا جمع."], ["single-sex / co-ed", "تک‌جنسیتی / مختلط", "unisex در متن اصلی بیشتر برای لباس است؛ برای مدرسه co-ed دقیق‌تر است."], ["workload", "حجم کار", "a heavy workload."], ["deal with", "کنار آمدن با، رسیدگی کردن به", "deal with a heavy workload."], ["cooperation", "همکاری", "the lesson of cooperation."]], "grammar": "Although برای تضاد است و با but در همان جمله جمع نمی‌شود. I'm proud to recommend: بعد از proud to + فعل."}, {"id": "l30", "n": 30, "en": "Festival", "fa": "جشنواره", "qa": [["How many popular festivals are there in your country?", "در کشور شما چند جشنوارهٔ محبوب هست؟", "There are many: New Year's Day, Martin Luther King Day, Valentine's Day, St. Patrick's Day, Easter and so on.", "زیاد است: سال نو، روز مارتین لوتر کینگ، ولنتاین، روز سنت پاتریک، عید پاک و مانند این‌ها."], ["What is the most important festival in your country?", "مهم‌ترین جشن در کشور شما چیست؟", "I believe New Year's Day is the most important one, since it's a chance for family reunions and parties. People gather to welcome the new year.", "باور دارم سال نو مهم‌ترین است، چون فرصت دورهمی خانواده و مهمانی است. مردم جمع می‌شوند تا سال نو را خوشامد بگویند."], ["When does it take place?", "کی برگزار می‌شود؟", "It occurs on January 1st.", "اول ژانویه."], ["Where is the festival celebrated?", "جشن کجا برگزار می‌شود؟", "New Year's Day is celebrated all over the country. Each family has its own way of celebrating.", "در سراسر کشور. هر خانواده روش خودش را دارد."], ["What do people do to prepare for the festival?", "مردم برای آماده شدن جشن چه می‌کنند؟", "Before New Year's Day, people shop for food and drinks, repair the house or put up decorations.", "پیش از سال نو برای غذا و نوشیدنی خرید می‌کنند، خانه را تعمیر می‌کنند یا تزئینات می‌زنند."], ["Who can join the festival?", "چه کسی می‌تواند در جشن شرکت کند؟", "It's a day for everybody.", "روزی برای همه است."], ["What do people do during the festival?", "در جشن مردم چه می‌کنند؟", "On New Year's Eve, people have a party with traditional food and drinks. After that, they may visit friends or relatives, go to the movies or watch sports.", "شب سال نو با غذا و نوشیدنی سنتی مهمانی می‌گیرند. بعد ممکن است به دیدن دوستان یا خویشان بروند، سینما بروند یا ورزش ببینند."], ["What's special about that festival?", "آن جشن چه ویژگی‌ای دارد؟", "It marks the end of a year and celebrates a new one. People believe that what they do on the first day will bring good luck and prosperity for the whole year.", "پایان سال را نشان می‌دهد و سال نو را جشن می‌گیرد. مردم باور دارند کار روز اول برای تمام سال خوش‌شانسی و رونق می‌آورد."], ["Is the festival culturally related?", "این جشن به فرهنگ ربط دارد؟", "Sure. The festival is an integral part of culture.", "حتماً. جشن بخش جدایی‌ناپذیر فرهنگ است."], ["Why is a festival important?", "چرا جشن مهم است؟", "It adds structure to our social lives and connects us with our families and backgrounds.", "به زندگی اجتماعی نظم می‌دهد و ما را به خانواده و پیشینه وصل می‌کند."]], "vocab": [["take place", "برگزار شدن", "برای رویداد، نه برای آدم. When does it take place?"], ["all over the country", "در سراسر کشور", "celebrated all over the country."], ["put up decorations", "تزئینات زدن", "put up decor در متن اصلی کمی ناقص است."], ["prosperity", "رونق، کامیابی", "good luck and prosperity."], ["background", "پیشینه", "families and backgrounds."], ["New Year's Eve / Day", "شب سال نو / روز سال نو", "Eve شب قبل است، Day خود روز."]], "grammar": "since اینجا یعنی چون. what they do on the first day یک جملهٔ اسمی است و فاعل will bring."}, {"id": "l31", "n": 31, "en": "Food", "fa": "غذا", "qa": [["Do you like to cook?", "آشپزی را دوست دارید؟", "Yes, I do. Cooking helps me feel relaxed after long hours of work.", "بله. آشپزی کمکم می‌کند بعد از ساعت‌ها کار آرام شوم."], ["Is there any kind of food you don't like?", "غذایی هست که دوست نداشته باشید؟", "I don't really like fried chicken, which is very high in fat.", "مرغ سوخاری را زیاد دوست ندارم، چون چربی خیلی بالایی دارد."], ["Do you eat out or cook at home?", "بیرون غذا می‌خورید یا در خانه می‌پزید؟", "I usually cook at home. Sometimes when I'm busy, I go out to eat.", "معمولاً خانه می‌پزم. گاهی که سرم شلوغ است بیرون می‌روم."], ["How often do you cook?", "چند وقت یک‌بار آشپزی می‌کنید؟", "Just when I have free time. My mom is often responsible for preparing meals. She's the best cook ever.", "فقط وقتی وقت آزاد دارم. مادرم اغلب مسئول آماده کردن غذاست. بهترین آشپز دنیاست."], ["What's your favorite food?", "غذای مورد علاقه‌تان چیست؟", "I'm addicted to sushi. I can eat sushi every day.", "به سوشی معتادم. هر روز می‌توانم سوشی بخورم."], ["Is it Western or Asian cuisine?", "غذای غربی است یا آسیایی؟", "It's Asian cuisine. Sushi comes from Japan.", "آسیایی. سوشی از ژاپن آمده."], ["Is it easy to make your favorite food?", "درست کردن غذای مورد علاقه‌تان آسان است؟", "Yes, I guess. The recipe is quite simple.", "فکر می‌کنم بله. دستور پخت نسبتاً ساده است."], ["What ingredients do you need to make that food?", "برای درست کردن آن غذا چه موادی لازم دارید؟", "I would need rice, eggs, meat, seafood and vegetables.", "برنج، تخم‌مرغ، گوشت، غذای دریایی و سبزی لازم دارم."], ["What do you think about fast food?", "دربارهٔ فست‌فود چه فکر می‌کنید؟", "I don't really like fast food. It's not healthy at all.", "زیاد دوستش ندارم. اصلاً سالم نیست."], ["Would you say that you have a healthy diet?", "می‌گویید رژیم غذایی سالمی دارید؟", "Yes, I would. I prefer vitamins and protein, and less fat.", "بله. ویتامین و پروتئین را ترجیح می‌دهم و چربی کمتر."]], "vocab": [["high in fat", "پرچرب", "which is high in fat."], ["be responsible for", "مسئول چیزی بودن", "responsible for preparing meals."], ["be addicted to", "به چیزی معتاد بودن", "اینجا اغراق دوستانه است، نه اعتیاد پزشکی."], ["cuisine", "سبک آشپزی", "Asian cuisine. از food کمی رسمی‌تر است."], ["recipe", "دستور پخت", "The recipe is simple."], ["not at all", "اصلاً", "برای تأکید منفی. It's not healthy at all."]], "grammar": "which is very high in fat جملهٔ وصفی غیرمحدودکننده است و دلیل نپسندیدن را اضافه می‌کند. would در Would you say...? برای نظر مؤدبانه است."}, {"id": "l32", "n": 32, "en": "Household Appliance", "fa": "لوازم خانگی", "qa": [["What's the most useful household appliance that you have?", "مفیدترین وسیلهٔ خانگی که دارید چیست؟", "That's definitely the washing machine.", "قطعاً ماشین لباسشویی."], ["When did you buy it?", "کی خریدیدش؟", "I bought it 2 years ago. Actually, my mom gave it to me as a birthday present.", "دو سال پیش خریدم. در واقع مادرم آن را هدیهٔ تولد به من داد."], ["Is it expensive?", "گران است؟", "I don't think it cost that much.", "فکر نمی‌کنم آن‌قدر گران بوده باشد."], ["Is it easy to use?", "استفاده‌اش آسان است؟", "Yes, it's pretty simple.", "بله، نسبتاً ساده است."], ["How does it work?", "چطور کار می‌کند؟", "Just put the clothes in, press the desired button, and everything will be done within several minutes.", "لباس را بگذارید داخل، دکمهٔ مورد نظر را بزنید، و همه‌چیز در چند دقیقه انجام می‌شود."], ["How often do you use it?", "چند وقت یک‌بار از آن استفاده می‌کنید؟", "I wash my clothes twice a week.", "هفته‌ای دو بار لباس می‌شویم."], ["Will you replace it with a more modern one?", "آن را با مدل مدرن‌تر عوض می‌کنید؟", "No, because it was a present and it's still working well.", "نه، چون هدیه بوده و هنوز خوب کار می‌کند."], ["How does your life change with that household appliance?", "زندگی‌تان با آن وسیله چطور عوض می‌شود؟", "It makes our life more convenient. We can save time as well.", "زندگی را راحت‌تر می‌کند. وقت هم ذخیره می‌کنیم."], ["Do you think household appliances will make people lazier and lazier?", "فکر می‌کنید لوازم خانگی مردم را تنبل‌تر کنند؟", "Yes, to some extent. With electronic equipment, people tend to forget manual tasks and become lazier.", "تا حدی بله. با دستگاه‌های الکترونیکی، مردم کارهای دستی را فراموش می‌کنند و تنبل‌تر می‌شوند."]], "vocab": [["household appliance", "وسیلهٔ خانگی برقی", "washing machine, fridge, oven."], ["desired", "مورد نظر", "press the desired button."], ["within", "در محدودهٔ زمانی", "within several minutes یعنی در کمتر از چند دقیقه."], ["replace A with B", "جایگزین کردن الف با ب", "replace it with a modern one."], ["to some extent", "تا حدی", "برای موافقت ناقص، خیلی به‌درد اسپیکینگ می‌خورد."], ["manual task", "کار دستی", "در برابر کار دستگاه."]], "grammar": "lazier and lazier صفت تکراری برای «هر روز بیشتر» است. to some extent جواب را متعادل می‌کند و از بله/خیر خشک بهتر است."}, {"id": "l33", "n": 33, "en": "Music Band", "fa": "گروه موسیقی", "qa": [["What's your favorite music band?", "گروه موسیقی مورد علاقه‌تان چیست؟", "I'm a big fan of One Direction. There are 5 singers in the band.", "طرفدار وان دایرکشنم. پنج خواننده در گروه هستند."], ["Is it famous around the world?", "در سراسر جهان معروف است؟", "Yes, it is. The band is well known around the world. Almost all teenagers love them.", "بله. گروه در جهان شناخته‌شده است. تقریباً همهٔ نوجوان‌ها دوستشان دارند."], ["What's their taste in music?", "سلیقهٔ موسیقی‌شان چیست؟", "They sing pop music. Their most famous song may be What Makes You Beautiful.", "پاپ می‌خوانند. معروف‌ترین آهنگشان شاید What Makes You Beautiful باشد."], ["Are they good at dancing?", "رقصشان خوب است؟", "Yes, I think so. I fall in love with their every step.", "فکر می‌کنم بله. عاشق تک‌تک قدم‌هایشان می‌شوم."], ["Have you ever seen them in real life?", "تا حالا آن‌ها را واقعی دیده‌اید؟", "Nope. I just watch them on media. I wish I could see them one day.", "نه. فقط در رسانه می‌بینمشان. کاش یک روز ببینمشان.", "I wish I could", "متن اصلی I wish I will دیده؛ بعد از wish برای آرزوی حال، could یا would می‌آید."], ["How often do you come to their show?", "چند وقت یک‌بار به برنامه‌شان می‌آیید؟", "I watch videos almost every day. Listening to their songs helps me chill out.", "تقریباً هر روز ویدیو می‌بینم. گوش دادن به آهنگ‌هایشان آرامم می‌کند."], ["Can you sing their songs?", "آهنگ‌هایشان را می‌توانید بخوانید؟", "Yes, but only one song. I just keep singing it over and over again.", "بله، فقط یک آهنگ. هی تکرارش می‌کنم."], ["Do your friends like them?", "دوستانتان آن‌ها را دوست دارند؟", "Of course. We usually watch their performances and discuss them together.", "البته. معمولاً اجراهایشان را می‌بینیم و با هم درباره‌اش حرف می‌زنیم."], ["Do they have anti-fans?", "مخالف و ضدطرفدار دارند؟", "Yes, every famous singer has anti-fans.", "بله، هر خوانندهٔ معروفی ضدطرفدار دارد."]], "vocab": [["well known", "شناخته‌شده", "صفت. well-known قبل از اسم خط تیره می‌گیرد."], ["I wish I could", "کاش می‌توانستم", "wish + گذشته برای آرزوی غیرواقع حال. will بعد از wish معیار نیست."], ["over and over again", "بارها و بارها", "keep singing it over and over."], ["anti-fan", "ضدطرفدار", "کسی که عمداً از مشهور خوشش نمی‌آید."], ["Nope", "نه", "خیلی غیررسمی. در آزمون بهتر است No بگویید."], ["performance", "اجرا", "watch their performances."]], "grammar": "I think so موافق نظر سؤال است. I wish I could see them: بعد از wish زمان یک درجه به گذشته می‌رود."}, {"id": "l34", "n": 34, "en": "Weather", "fa": "آب‌وهوا", "qa": [["What's the weather like in your country?", "آب‌وهوای کشور شما چطور است؟", "There are 4 seasons: spring, summer, fall and winter, which vary considerably.", "چهار فصل هست: بهار، تابستان، پاییز و زمستان، که تفاوت زیادی دارند."], ["What kind of weather do you like?", "چه آب‌وهوایی دوست دارید؟", "I enjoy hot weather. There are more things to do when it's sunny. I love swimming and sunbathing.", "هوای گرم را دوست دارم. وقتی آفتابی است کار بیشتری برای انجام هست. شنا و آفتاب گرفتن را دوست دارم."], ["What months have the best weather in your country?", "در کشور شما کدام ماه‌ها بهترین هوا را دارند؟", "It depends. For me, the best weather is from June to August, when it's warm across the country.", "بستگی دارد. برای من از ژوئن تا اوت، وقتی در سراسر کشور گرم است."], ["Do you like it when it rains?", "وقتی باران می‌بارد خوشتان می‌آید؟", "Not at all. I hate rain.", "اصلاً. از باران بدم می‌آید.", "I hate rain", "raining بعد از hate ممکن است، ولی hate rain اسم ساده‌تر است."], ["How does the weather affect your feelings?", "آب‌وهوا چه اثری روی حس شما دارد؟", "I usually have a bad mood when it rains. The rain reminds me of sad memories.", "وقتی باران می‌بارد معمولاً حالم بد است. باران خاطرهٔ غمگین یادم می‌آورد."], ["How has the weather changed recently?", "آب‌وهوا تازگی چطور عوض شده؟", "Due to global warming, the weather has become more and more unpredictable. It's boiling hot in summer and freezing cold on winter days.", "به‌خاطر گرمایش زمین، هوا پیش‌بینی‌ناپذیرتر شده. تابستان داغ و زمستان یخ‌بندان است."], ["Do you usually watch the weather forecast?", "معمولاً پیش‌بینی هوا را می‌بینید؟", "No, not very often.", "نه، نه خیلی زیاد."], ["What's your favorite season? Why?", "فصل مورد علاقه‌تان چیست؟ چرا؟", "I love spring, when trees and flowers blossom.", "بهار را دوست دارم، وقتی درخت و گل شکوفه می‌دهند."], ["What do you like to do when it's windy?", "وقتی باد می‌آید دوست دارید چه کنید؟", "When it's windy, I like flying a kite with my friends. That's interesting.", "وقتی باد می‌آید دوست دارم با دوستانم بادبادک هوا کنم. جالب است."]], "vocab": [["What's the weather like?", "هوا چطور است؟", "الگوی ثابت. like اینجا حرف اضافه/پرسش ظاهر است."], ["vary considerably", "تفاوت قابل توجه داشتن", "which vary considerably."], ["due to", "به‌خاطر", "due to + اسم. due to global warming."], ["more and more", "هر روز بیشتر", "more and more unpredictable."], ["boiling hot / freezing cold", "داغ / یخ‌بندان", "ترکیب تشدیدی. boiling و freezing قیدِ صفت‌اند."], ["blossom", "شکوفه دادن", "trees blossom. برای گل هم به کار می‌رود."]], "grammar": "fall آمریکایی و autumn بریتانیایی است. when trees blossom جملهٔ وصفی برای spring است."}, {"id": "l35", "n": 35, "en": "Neighbor", "fa": "همسایه", "qa": [["Who is your neighbor?", "همسایه‌تان کیست؟", "My neighbor is a university student. He lives next to my apartment.", "همسایه‌ام دانشجوی دانشگاه است. کنار آپارتمان من زندگی می‌کند."], ["When did you become neighbors?", "کی همسایه شدید؟", "I first met him when I moved to this apartment 2 years ago.", "اولین بار دو سال پیش که به این آپارتمان آمدم دیدمش."], ["Is he friendly?", "دوستانه است؟", "Yes, he is. He always smiles when he sees me.", "بله. همیشه وقتی من را می‌بیند لبخند می‌زند."], ["How often do you see him?", "چند وقت یک‌بار می‌بینیدش؟", "Every day at the gate. Sometimes I invite him to my apartment when I throw a party.", "هر روز دم در. گاهی وقتی مهمانی می‌گیرم به آپارتمانم دعوتش می‌کنم."], ["Do you have any problems with him?", "با او مشکلی دارید؟", "Only once, when he sang karaoke too loud, which kept me awake all night. We talked the next day, and he never sang karaoke at midnight again.", "فقط یک بار، وقتی کارائوکه را خیلی بلند خواند و تمام شب بیدار ماندم. فردا حرف زدیم و دیگر نیمه‌شب کارائوکه نخواند."], ["Does he usually help you?", "معمولاً کمک‌تان می‌کند؟", "Yes, he does. He usually helps me run errands.", "بله. معمولاً کمکم می‌کند کار دم‌دستی را انجام دهم."], ["Would you be sad if he moved to another area?", "اگر به منطقهٔ دیگری برود ناراحت می‌شوید؟", "Yes, of course. It will upset me if he leaves.", "البته. اگر برود ناراحتم می‌کند."], ["What's the difference between friends and neighbors?", "فرق دوست و همسایه چیست؟", "I'm not quite sure, but I think the difference lies in the relationship. A friend can be someone you share your feelings with, while a neighbor can just be someone living next door.", "کاملاً مطمئن نیستم، ولی فکر می‌کنم فرق در نوع رابطه است. دوست کسی است که احساس‌تان را با او قسمت می‌کنید، در حالی که همسایه ممکن است فقط کسی باشد که دیواربه‌دیوار زندگی می‌کند."], ["What do you need to be a good neighbor?", "برای همسایهٔ خوب بودن چه لازم دارید؟", "Being respectful is the most important factor in building a good relationship.", "محترم بودن مهم‌ترین عامل ساختن رابطهٔ خوب است."]], "vocab": [["next to / next door", "کنار / دیواربه‌دیوار", "lives next to my apartment. someone living next door."], ["keep someone awake", "کسی را بیدار نگه داشتن", "which kept me awake all night."], ["run errands", "کارهای دم‌دستی را انجام دادن", "help me run errands."], ["upset", "ناراحت کردن", "It will upset me. فعل است."], ["lie in", "در چیزی بودن", "the difference lies in the relationship."], ["respectful", "محترمانه، بااحترام", "Being respectful. اسم respect، قید respectfully."]], "grammar": "Would you be sad if he moved: شرطی نوع دوم. if + گذشته، would + فعل. متن اصلی if he moves کمی شرطی نوع اول است؛ هر دو قابل دفاع‌اند، ولی would با moved جفت است."}, {"id": "l36", "n": 36, "en": "Natural Scenery", "fa": "منظرهٔ طبیعی", "qa": [["Do you like visiting natural places?", "دیدن جاهای طبیعی را دوست دارید؟", "Yes, I do. Being close to nature helps me release stress and worry.", "بله. نزدیک طبیعت بودن کمکم می‌کند استرس و نگرانی را رها کنم."], ["What's the most impressive natural scenery you've ever seen?", "تأثیرگذارترین منظرهٔ طبیعی که دیده‌اید چیست؟", "That's the horseshoe of the Colorado River in Arizona. It's such a great scenic place.", "خم نعلی رود کلرادو در آریزونا. جای بسیار تماشایی است."], ["When did you see it?", "کی آن را دیدید؟", "I visited the place last summer.", "تابستان پیش آنجا رفتم."], ["Who went with you?", "چه کسی با شما آمد؟", "I went there with my family. We camped near the place.", "با خانواده‌ام رفتم. نزدیک آنجا چادر زدیم."], ["What's special about it?", "چه چیز خاصی دارد؟", "I'm fond of the nature there. It's a horseshoe-shaped meander of the Colorado River.", "طبیعت آنجا را دوست دارم. پیچ نعلی‌شکل رود کلرادو است."], ["How has it changed recently?", "تازگی چطور عوض شده؟", "It doesn't change much, actually.", "در واقع زیاد عوض نمی‌شود."], ["What's the next natural scenery you would like to visit?", "منظرهٔ طبیعی بعدی که می‌خواهید ببینید چیست؟", "My next destination would be the Maroon Bells in Colorado. I fell in love with the mountain ranges and yellow flowers there.", "مقصد بعدی‌ام مارون بلز در کلرادو است. عاشق رشته‌کوه‌ها و گل‌های زرد آنجا شدم."], ["What can people get from visiting natural places?", "مردم از دیدن جاهای طبیعی چه به دست می‌آورند؟", "People get closer to Mother Nature. Children have more motivation to discover the world around them.", "به مادر طبیعت نزدیک‌تر می‌شوند. کودکان انگیزهٔ بیشتری برای کشف دنیای اطراف پیدا می‌کنند."], ["What are some famous natural attractions in your country?", "چند جاذبهٔ طبیعی معروف در کشور شما چیست؟", "There are many, such as Death Valley, Niagara Falls, the Redwoods and the Grand Canyon, to name a few.", "زیاد است، مثل درهٔ مرگ، آبشار نیاگارا، جنگل سرخ و گراند کنیون، فقط چند تا را بگویم."]], "vocab": [["scenery", "منظره", "اسم شمارش‌ناپذیر. a piece of scenery. scenic صفت."], ["horseshoe-shaped", "نعلی‌شکل", "صفت مرکب. a horseshoe-shaped meander."], ["meander", "پیچ رودخانه", "واژهٔ جغرافیایی."], ["to name a few", "فقط چند نمونه", "عبارت برای تمام نکردن فهرست."], ["Mother Nature", "مادر طبیعت", "شخص‌انگاری طبیعت."], ["mountain range", "رشته‌کوه", "mountain ranges."]], "grammar": "you've ever seen حال کامل با ever برای تجربه. to name a few آخر فهرست خیلی برای اسپیکینگ مفید است."}, {"id": "l37", "n": 37, "en": "Outdoor Activities", "fa": "فعالیت‌های بیرون از خانه", "qa": [["What outdoor activity do you participate in?", "در چه فعالیت بیرونی شرکت می‌کنید؟", "I do many, but my favorite is jogging.", "زیاد، ولی مورد علاقه‌ام دویدن آرام است."], ["Where do you do it?", "کجا این کار را می‌کنید؟", "I go jogging in the park near my place.", "در پارک نزدیک خانه‌ام می‌دوم."], ["Who do you do outdoor activities with?", "فعالیت بیرونی را با چه کسی انجام می‌دهید؟", "I usually go jogging with my family.", "معمولاً با خانواده‌ام می‌دوم."], ["Who shares the same interests as you?", "چه کسی علاقهٔ مشترک با شما دارد؟", "My family, especially my dad. We usually jog together.", "خانواده‌ام، به‌خصوص پدرم. معمولاً با هم می‌دویم."], ["How often do you take part in outdoor activities?", "چند وقت یک‌بار در فعالیت بیرونی شرکت می‌کنید؟", "Every morning, except on rainy days.", "هر صبح، جز روزهای بارانی."], ["How do you feel after the activities?", "بعد از فعالیت چه حسی دارید؟", "I feel really relaxed and refreshed.", "واقعاً آرام و سرحال می‌شوم."], ["What benefits can you get from outdoor activities?", "از فعالیت بیرونی چه فایده‌ای می‌برید؟", "It's a good workout. Jogging is also a good way for me to recharge for a long day at work.", "ورزش خوبی است. دویدن راه خوبی است برای اینکه برای روز کاری طولانی انرژی بگیرم."], ["Do you usually play sports outdoors?", "معمولاً بیرون ورزش می‌کنید؟", "Yes, I do. I play volleyball and swim outdoors.", "بله. بیرون والیبال بازی می‌کنم و شنا می‌کنم."], ["Why are children less interested in outdoor activities nowadays?", "چرا کودکان امروزه کمتر به فعالیت بیرونی علاقه‌مندند؟", "Children nowadays prefer high-tech gadgets like computers, iPads and phones to outdoor activities.", "کودکان امروز گجت‌هایی مثل رایانه، آیپد و تلفن را به فعالیت بیرونی ترجیح می‌دهند."]], "vocab": [["take part in / participate in", "شرکت کردن در", "هر دو با in. take part in رایج‌تر و گفتاری‌تر است."], ["except", "به‌جز", "except on rainy days."], ["refreshed", "سرحال، تازه", "relaxed and refreshed."], ["recharge", "انرژی گرفتن دوباره", "متن اصلی charge batteries گفته؛ recharge طبیعی‌تر است."], ["gadget", "وسیلهٔ الکترونیکی کوچک", "high-tech gadgets."], ["prefer A to B", "الف را به ب ترجیح دادن", "prefer gadgets to outdoor activities. to نه than."]], "grammar": "prefer A to B ساختار مهم است. nowadays قید است و معمولاً اول یا آخر جمله می‌آید."}, {"id": "l38", "n": 38, "en": "Law", "fa": "قانون", "qa": [["What law do you like?", "کدام قانون را دوست دارید؟", "I like the traffic law about wearing a helmet when traveling by motorbike.", "قانون راهنمایی دربارهٔ کلاه ایمنی هنگام موتورسواری را دوست دارم."], ["Is that an international law?", "آن قانون بین‌المللی است؟", "Yes, people around the world follow this law.", "بله، مردم سراسر جهان این قانون را رعایت می‌کنند."], ["When was it issued?", "کی صادر شد؟", "I'm not quite sure, but I guess a long time ago.", "کاملاً مطمئن نیستم، ولی حدس می‌زنم خیلی وقت پیش."], ["Who told you about that law?", "آن قانون را چه کسی به شما گفت؟", "I learned it at school.", "در مدرسه یاد گرفتم."], ["Is it easy to follow that law?", "رعایت آن قانون آسان است؟", "Yes, it is. It doesn't cause any inconvenience at all.", "بله. هیچ زحمتی ایجاد نمی‌کند."], ["What do you think about that law?", "دربارهٔ آن قانون چه فکر می‌کنید؟", "The traffic law is necessary for people when they're on the road.", "قانون راهنمایی برای کسانی که در جاده‌اند ضروری است."], ["What benefit can you get from following that law?", "از رعایت آن قانون چه فایده‌ای می‌برید؟", "It may keep me safe from traffic accidents.", "ممکن است مرا از تصادف در امان نگه دارد."], ["Why should people obey the law strictly?", "چرا مردم باید قانون را سخت رعایت کنند؟", "Following the law is a good way to protect themselves as well as others.", "رعایت قانون راه خوبی برای محافظت از خود و دیگران است."], ["What can be done to encourage people to follow the law?", "برای تشویق مردم به رعایت قانون چه می‌توان کرد؟", "Obeying the law is people's responsibility. If they break the law, they'll put themselves in trouble.", "اطاعت از قانون مسئولیت مردم است. اگر قانون را بشکنند، خودشان را به دردسر می‌اندازند.", "If they break the law", "متن اصلی If they against the law غلط است؛ against حرف اضافه است و فعل break یا go against لازم است."]], "vocab": [["issue a law", "قانون را صادر کردن", "When was it issued? مجهول."], ["follow / obey the law", "قانون را رعایت کردن", "follow و obey هر دو متعدی‌اند."], ["inconvenience", "زحمت، ناراحتی", "cause inconvenience."], ["as well as", "و همچنین", "themselves as well as others."], ["break the law", "قانون را شکستن", "متضاد obey the law."], ["put someone in trouble", "کسی را به دردسر انداختن", "put themselves in trouble."]], "grammar": "What can be done...? مجهول غیرشخصی برای پیشنهاد است و در اسپیکینگ آیلتس خیلی خوب است. against به‌تنهایی فعل نیست."}, {"id": "l39", "n": 39, "en": "Pollution", "fa": "آلودگی", "qa": [["How many kinds of pollution are there?", "چند نوع آلودگی هست؟", "There are many types: land, water, noise, air, light and thermal pollution.", "انواع زیاد: آلودگی خاک، آب، صدا، هوا، نور و گرمایی."], ["What type of pollution is common in your country?", "در کشور شما کدام نوع آلودگی رایج است؟", "The most common one is water pollution, I guess.", "حدس می‌زنم رایج‌ترین آلودگی آب باشد."], ["Have you ever littered?", "تا حالا زباله روی زمین انداخته‌اید؟", "Yes, I have, but when I was taught the lesson of protecting nature, I quit littering.", "بله، ولی وقتی درس حفاظت از طبیعت را یاد گرفتم، زباله ریختن را کنار گذاشتم."], ["What can you do to help prevent pollution?", "برای جلوگیری از آلودگی چه می‌توانید بکنید؟", "Reducing and reusing whatever I can, to cut the amount of waste, is what I can do.", "کم کردن و دوباره استفاده کردن از هر چه می‌توانم، تا حجم زباله کم شود، کاری است که از دستم برمی‌آید."], ["What does the government do to encourage people to protect the environment?", "دولت برای تشویق مردم به حفاظت از محیط زیست چه می‌کند؟", "They organize campaigns to raise people's awareness. Everything should start from education.", "کمپین برگزار می‌کنند تا آگاهی مردم بالا برود. همه‌چیز باید از آموزش شروع شود."], ["Are people in your country aware of environmental issues?", "مردم کشور شما از مسئله‌های محیط زیست آگاه‌اند؟", "Yes, they are. They care about what happens to the environment around them.", "بله. به آنچه برای محیط اطرافشان رخ می‌دهد اهمیت می‌دهند."], ["Is there any law to force people to protect the environment?", "قانونی هست که مردم را به حفاظت از محیط زیست وادار کند؟", "Yes. Environmental law sets punishments for people who harm the environment.", "بله. قانون محیط زیست برای کسانی که به محیط آسیب می‌زنند مجازات تعیین می‌کند."]], "vocab": [["litter", "زباله ریختن", "فعل و اسم. Have you ever littered?"], ["quit + -ing", "کنار گذاشتن کاری", "I quit littering."], ["reduce and reuse", "کم کردن و دوباره استفاده کردن", "دو تا از سه شعار محیط زیست: reduce, reuse, recycle."], ["raise awareness", "آگاهی را بالا بردن", "raise the awareness of people."], ["be aware of", "آگاه بودن از", "aware of environmental issues. حرف اضافه of."], ["harm", "آسیب زدن", "harm the environment. do harm to هم درست است."]], "grammar": "whatever I can = whatever I can reduce and reuse. جملهٔ اسمی با -ing می‌تواند فاعل باشد: Reducing and reusing ... is what I can do."}, {"id": "l40", "n": 40, "en": "Traffic Jam", "fa": "ترافیک", "qa": [["Are you comfortable with traffic jams?", "با ترافیک راحتید؟", "Not at all. I feel annoyed.", "اصلاً. کلافه می‌شوم."], ["Why does it happen?", "چرا رخ می‌دهد؟", "Because there are too many vehicles on the streets during rush hour, I bet.", "چون در ساعت شلوغی وسیلهٔ نقلیه خیلی زیاد است، حدس می‌زنم."], ["How often do you sit in a traffic jam?", "چند وقت یک‌بار در ترافیک می‌مانید؟", "Almost every day, when I finish work and go back home.", "تقریباً هر روز، وقتی کار تمام می‌شود و برمی‌گردم خانه."], ["What time of day are you usually caught in a traffic jam?", "معمولاً چه ساعتی گیر ترافیک می‌افتید؟", "In the rush hour, at 7 a.m. and 5 p.m.", "ساعت شلوغی، ۷ صبح و ۵ عصر."], ["How long does it take to escape from the traffic jam?", "خلاص شدن از ترافیک چقدر طول می‌کشد؟", "At least half an hour.", "دست‌کم نیم ساعت."], ["What do you do while waiting in a long line?", "وقتی در صف طولانی منتظرید چه می‌کنید؟", "I often glance at my watch, actually.", "در واقع اغلب به ساعتم نگاه می‌کنم."], ["Have you ever had any trouble caused by a traffic jam?", "تا حالا به‌خاطر ترافیک به دردسر افتاده‌اید؟", "Yes. Just yesterday I was late for an important meeting with my clients.", "بله. همین دیروز برای جلسهٔ مهم با مشتری‌هایم دیر کردم."], ["How has the traffic situation changed recently?", "وضع ترافیک تازگی چطور عوض شده؟", "There are more vehicles, which makes the traffic jam more and more serious.", "وسیله بیشتر شده و همین ترافیک را جدی‌تر می‌کند."]], "vocab": [["traffic jam", "راه‌بندان", "جمع: traffic jams. sit in / be caught in a traffic jam."], ["rush hour", "ساعت شلوغی", "during rush hour."], ["I bet", "حدس قوی می‌زنم", "غیررسمی، آخر جمله برای نرم کردن ادعا."], ["at least", "دست‌کم", "at least half an hour."], ["glance at", "نگاه کوتاه انداختن", "glance at my watch. look at طولانی‌تر است."], ["be late for", "برای چیزی دیر کردن", "late for a meeting. حرف اضافه for."]], "grammar": "which makes به کل وضعیت قبل برمی‌گردد، پس فعل مفرد است. Just yesterday با گذشتهٔ ساده می‌آید، نه حال کامل."}, {"id": "l41", "n": 41, "en": "TV Program", "fa": "برنامهٔ تلویزیونی", "qa": [["What is your favorite TV program?", "برنامهٔ تلویزیونی مورد علاقه‌تان چیست؟", "I watch a lot, but the one I like best is How It's Made.", "زیاد می‌بینم، ولی آنکه از همه بیشتر دوست دارم How It's Made است."], ["Is that an international TV program?", "برنامهٔ بین‌المللی است؟", "Yes, it is. It's available in Canada, Europe, Australia, New Zealand, Southeast Asia and so on.", "بله. در کانادا، اروپا، استرالیا، نیوزیلند، جنوب شرق آسیا و جاهای دیگر در دسترس است."], ["What is the TV program about?", "برنامه دربارهٔ چیست؟", "Its name describes the content, which is about the process of making things like lipsticks, balls, candy, toys and chocolate.", "اسمش محتوا را می‌گوید: روند ساختن چیزهایی مثل رژلب، توپ، آبنبات، اسباب‌بازی و شکلات."], ["How often do you watch that TV program?", "چند وقت یک‌بار آن برنامه را می‌بینید؟", "Almost every day after dinner.", "تقریباً هر روز بعد از شام."], ["Who watches that program with you?", "چه کسی با شما آن برنامه را می‌بیند؟", "My family watches it together. My younger brother can't wait to turn on the TV.", "خانواده‌ام با هم می‌بینند. برادر کوچک‌ترم بی‌قرار است تلویزیون را روشن کند."], ["What channel is it on?", "روی کدام شبکه است؟", "A very common one, Discovery Channel, which focuses on popular science, technology and history.", "شبکهٔ خیلی رایج دیسکاوری، که روی علم عمومی، فناوری و تاریخ تمرکز دارد."], ["Why do you like that TV program?", "چرا آن برنامه را دوست دارید؟", "I love learning new things, especially about how everything is produced. I would love to run a business making handmade cosmetics.", "یاد گرفتن چیز تازه را دوست دارم، به‌خصوص اینکه همه‌چیز چطور تولید می‌شود. دوست دارم کسب‌وکار لوازم آرایشی دست‌ساز راه بیندازم."], ["How does that TV program change you?", "آن برنامه شما را چطور عوض می‌کند؟", "I know more about the world around me. It also supports me on my career path and helps my dream come true.", "دربارهٔ دنیای اطرافم بیشتر می‌دانم. در مسیر شغلی هم حمایتم می‌کند و کمک می‌کند رؤیایم واقعی شود."], ["Who is its target audience?", "مخاطب هدفش کیست؟", "It particularly aims at families and younger audiences.", "به‌خصوص خانواده‌ها و مخاطب جوان‌تر را هدف می‌گیرد."], ["Would you recommend that TV program to your friends?", "آن برنامه را به دوستانتان پیشنهاد می‌کنید؟", "Yes, of course. They would be crazy about the program, I bet.", "البته. حدس می‌زنم شیفته‌اش شوند."]], "vocab": [["can't wait to", "بی‌قرار بودن برای", "can't wait to turn on the TV."], ["focus on", "تمرکز کردن روی", "which focuses on science."], ["target audience", "مخاطب هدف", "Who is its target audience?"], ["aim at", "هدف گرفتن", "It aims at families."], ["come true", "واقع شدن", "helps my dream come true. بدون to."], ["handmade", "دست‌ساز", "handmade cosmetics."]], "grammar": "the one I like best ساختار وصفی بدون which است: one که بیشتر دوست دارم. would love to برای علاقهٔ مؤدبانه است."}, {"id": "l42", "n": 42, "en": "Architecture / Building", "fa": "معماری و ساختمان", "qa": [["What is the most impressive building you've visited?", "تأثیرگذارترین ساختمانی که دیده‌اید چیست؟", "It's the Petronas Twin Towers in Malaysia.", "برج‌های دوقلوی پتروناس در مالزی."], ["Where is it located?", "کجا واقع شده؟", "It's located in the capital of Malaysia, Kuala Lumpur.", "در پایتخت مالزی، کوالالامپور."], ["How tall is it?", "چقدر بلند است؟", "They were the tallest buildings in the world from 1998 to 2004. They reach a height of 451.9 meters.", "از ۱۹۹۸ تا ۲۰۰۴ بلندترین ساختمان‌های جهان بودند. به ارتفاع ۴۵۱٫۹ متر می‌رسند."], ["Who was the architect?", "معمار که بود؟", "César Pelli, an Argentine-American architect.", "سزار پلی، معمار آرژانتینی-آمریکایی."], ["Is it well known all over the world?", "در سراسر جهان شناخته‌شده است؟", "Sure. Tourists can't miss it when visiting Malaysia.", "حتماً. گردشگرها هنگام دیدن مالزی نمی‌توانند از دستش بدهند."], ["Do you have to purchase a ticket in order to visit the tower?", "برای دیدن برج باید بلیت بخرید؟", "Yes, I do. It's sold online.", "بله. آنلاین فروخته می‌شود."], ["When did you see it?", "کی آن را دیدید؟", "I saw it 2 years ago.", "دو سال پیش."], ["Will you come back there again?", "دوباره آنجا برمی‌گردید؟", "Of course. I'm looking forward to seeing it again someday.", "البته. بی‌صبرانه منتظرم یک روز دوباره ببینمش."]], "vocab": [["can't miss", "نباید از دست داد", "Tourists can't miss it."], ["purchase", "خریدن", "رسمی‌تر از buy. purchase a ticket."], ["It's sold online.", "آنلاین فروخته می‌شود", "مجهول حال ساده. در حاشیهٔ کتاب صرف مجهول sell آمده: it is sold, it was sold, it has been sold, it had been sold, it will be sold, it is being sold, it was being sold."], ["look forward to + -ing", "بی‌صبرانه منتظر بودن", "looking forward to seeing. to اینجا حرف اضافه است، پس فعل -ing می‌آید."], ["reach a height of", "به ارتفاع ... رسیدن", "reach a height of 451.9 meters."], ["architect", "معمار", "Who was the architect?"]], "grammar": "look forward to seeing یکی از غلط‌های رایج است؛ بعد از to فعل ساده نیاورید. مجهول زمان‌دار sell را از حاشیهٔ همین صفحه تمرین کنید: it is being sold الان در حال فروخته شدن است."}, {"id": "l43", "n": 43, "en": "Electronic Media", "fa": "رسانه‌های الکترونیکی", "qa": [["What kind of electronic media is popular in your country?", "در کشور شما چه نوع رسانهٔ الکترونیکی محبوب است؟", "There are some popular kinds: radio, TV and online news.", "چند نوع محبوب: رادیو، تلویزیون و خبر آنلاین."], ["What's your favorite kind?", "نوع مورد علاقه‌تان چیست؟", "I like online news because I have to work with computers every day, so it's easier for me to read online.", "خبر آنلاین را دوست دارم چون هر روز با رایانه کار می‌کنم و خواندن آنلاین برایم آسان‌تر است."], ["Why do you like it?", "چرا دوستش دارید؟", "Because of its convenience. I love reading anyway.", "به‌خاطر راحتی‌اش. به هر حال خواندن را دوست دارم."], ["How often do you access that kind of electronic media?", "چند وقت یک‌بار به آن رسانه دسترسی پیدا می‌کنید؟", "Every morning before I start working.", "هر صبح پیش از شروع کار.", "How often do you access it?", "access to به‌عنوان فعل غلط است؛ access فعل متعدی است: access the news."], ["What's interesting about it?", "چه چیز جالبی دربارهٔ آن هست؟", "Instead of watching TV or listening to the radio passively, I'd rather read and think about the news.", "به‌جای اینکه منفعلانه تلویزیون ببینم یا رادیو گوش کنم، ترجیح می‌دهم خبر را بخوانم و درباره‌اش فکر کنم."], ["Is it convenient to access that kind of electronic media?", "دسترسی به آن رسانه راحت است؟", "Yes. With a computer or smartphone connected to the Internet, you can read electronic news anytime and anywhere.", "بله. با رایانه یا گوشی وصل به اینترنت، هر وقت و هر جا می‌توانید خبر الکترونیکی بخوانید."], ["Do your family like that electronic media too?", "خانواده‌تان هم آن رسانه را دوست دارند؟", "No. My dad likes radio, and my mom likes TV.", "نه. پدرم رادیو را دوست دارد و مادرم تلویزیون را."], ["How has mass media changed recently?", "رسانهٔ جمعی تازگی چطور عوض شده؟", "They're more modern and user-friendly.", "مدرن‌تر و کاربرپسندتر شده‌اند."]], "vocab": [["instead of + -ing", "به‌جای", "instead of watching TV."], ["would rather", "ترجیح دادن", "I'd rather read. بعدش فعل ساده می‌آید."], ["passively", "منفعلانه", "قید. passively watching."], ["anytime and anywhere", "هر وقت و هر جا", "قیدهای مرکب."], ["user-friendly", "کاربرپسند", "easy to use. صفت مرکب."], ["mass media", "رسانهٔ جمعی", "معمولاً جمع معنی می‌دهد."]], "grammar": "I'd rather + فعل ساده، ولی instead of + -ing. این جفت را با هم تمرین کنید. Do your family: family جمع معنی دارد، پس like درست است."}, {"id": "l44", "n": 44, "en": "Job / Career", "fa": "شغل و مسیر شغلی", "qa": [["What is your desired job?", "شغل دلخواهتان چیست؟", "My dream changes with age. Up to now, I would like to be a great English teacher.", "رؤیایم با سن عوض می‌شود. تا حالا می‌خواهم معلم انگلیسی خیلی خوبی باشم."], ["Is that a demanding job?", "شغل سختی است؟", "Yes, I think so, although people suppose that being a teacher is easy and boring.", "فکر می‌کنم بله، هرچند مردم گمان می‌کنند معلمی آسان و کسل‌کننده است."], ["What challenge do you have when doing that job?", "هنگام انجام آن کار چه چالشی دارید؟", "I have some problems with classroom management. Maybe I have to improve that skill a lot in order to be a good teacher.", "با مدیریت کلاس مشکل دارم. شاید باید آن مهارت را خیلی بهتر کنم تا معلم خوبی باشم."], ["Is it hard to make your dream come true?", "واقعی کردن رؤیا سخت است؟", "Every job needs time and effort, and teaching does as well. Apart from the academic knowledge I was taught at university, I have to learn many other soft skills.", "هر شغلی وقت و تلاش می‌خواهد و معلمی هم همین‌طور. جدا از دانش دانشگاهی، باید خیلی مهارت نرم دیگر یاد بگیرم."], ["Why do you choose that job?", "چرا آن شغل را انتخاب می‌کنید؟", "I really admired my high school English teacher, and I want to be like her.", "معلم انگلیسی دبیرستانم را واقعاً تحسین می‌کردم و می‌خواهم مثل او باشم."], ["What requirements and characteristics do you need to do that job?", "برای آن کار چه شرط و ویژگی‌ای لازم است؟", "You need to be patient, thoughtful and sympathetic.", "باید صبور، باملاحظه و همدل باشید."], ["Does the job have something to do with your major at university?", "این شغل به رشتهٔ دانشگاهی‌تان ربط دارد؟", "Sure. I studied English Linguistics and Literature, majoring in English teaching. The major supports me a lot on my career path.", "حتماً. زبان‌شناسی و ادبیات انگلیسی خواندم، با گرایش آموزش انگلیسی. این رشته در مسیر شغلی خیلی کمکم می‌کند."], ["What does society think about your job?", "جامعه دربارهٔ شغل شما چه فکر می‌کند؟", "I'm not quite sure, but I'm proud to be a teacher. It is an honorable job.", "کاملاً مطمئن نیستم، ولی به معلم بودن افتخار می‌کنم. شغل شرافتمندانه‌ای است."], ["Do you make much money with that job?", "با آن کار پول زیادی درمی‌آورید؟", "Not at all. Teaching is one of the lowest-paying jobs in my country.", "اصلاً. معلمی در کشورم از کم‌درآمدترین شغل‌هاست."], ["Have you ever thought of leaving your job?", "تا حالا به ترک شغل فکر کرده‌اید؟", "I haven't thought of that before, but I believe in what I'm doing right now.", "تا حالا به آن فکر نکرده‌ام، ولی به کاری که الان می‌کنم باور دارم."]], "vocab": [["demanding", "پرتوقع، سخت", "a demanding job یعنی انرژی و مهارت زیاد می‌خواهد."], ["classroom management", "مدیریت کلاس", "اسم مرکب."], ["soft skills", "مهارت‌های نرم", "مثل صبر و ارتباط، در برابر academic knowledge."], ["have something to do with", "ربط داشتن به", "Does it have something to do with your major?"], ["major in", "در رشته‌ای تخصص گرفتن", "majoring in English teaching."], ["lowest-paying", "کم‌درآمدترین", "صفت مرکب عالی. one of the lowest-paying jobs."]], "grammar": "does as well برای جلوگیری از تکرار: teaching needs time too. one of the + عالی + جمع: one of the lowest-paying jobs."}, {"id": "l45", "n": 45, "en": "Competition / Contest", "fa": "مسابقه", "qa": [["What is the most impressive competition you've entered?", "تأثیرگذارترین مسابقه‌ای که شرکت کرده‌اید چیست؟", "I took part in an eloquence competition organized by my university last year.", "پارسال در مسابقهٔ سخنوری دانشگاه شرکت کردم."], ["What was it about?", "دربارهٔ چه بود؟", "The competition was to find the best public speaker in the university.", "مسابقه برای پیدا کردن بهترین سخنران عمومی دانشگاه بود."], ["Were there many participants in the competition?", "شرکت‌کننده زیاد بود؟", "Yes, there were around 500 participants in total.", "بله، حدود ۵۰۰ نفر در مجموع."], ["What prize did you get?", "چه جایزه‌ای گرفتید؟", "I didn't get a very high prize, but it didn't matter. I was still happy with the result.", "جایزهٔ خیلی بالایی نگرفتم، ولی مهم نبود. باز هم از نتیجه راضی بودم."], ["What could you learn from the competition?", "از مسابقه چه توانستید یاد بگیرید؟", "I learned how to develop ideas for a speech, besides some body-language tips for public speaking.", "یاد گرفتم چطور برای سخنرانی ایده پرورش دهم، به‌علاوه چند نکتهٔ زبان بدن."], ["Did you have to prepare a lot for the competition?", "مجبور بودید خیلی برای مسابقه آماده شوید؟", "Yes, I did. I read various materials about eloquence and rehearsed a lot.", "بله. مطالب گوناگون دربارهٔ سخنوری خواندم و زیاد تمرین کردم."], ["How did you know about the competition?", "از مسابقه چطور باخبر شدید؟", "The competition was announced on a school poster.", "روی پوستر مدرسه اعلام شده بود."], ["Did you do your best then?", "آن موقع بهترین تلاش‌تان را کردید؟", "Yes, I think so. After the competition, I knew I had to try more.", "فکر می‌کنم بله. بعد از مسابقه فهمیدم باید بیشتر تلاش کنم."], ["Is the competition useful, in your opinion?", "به نظر شما مسابقه مفید است؟", "Sure. It helps students learn soft skills and become more confident in life.", "حتماً. کمک می‌کند دانشجو مهارت نرم یاد بگیرد و در زندگی مطمئن‌تر شود."]], "vocab": [["eloquence", "سخنوری", "an eloquence competition."], ["public speaker", "سخنران در جمع", "the best public speaker."], ["in total", "در مجموع", "500 participants in total."], ["rehearse", "تمرین کردن برای اجرا", "rehearsed a lot."], ["do your best", "بهترین تلاش را کردن", "Did you do your best?"], ["in your opinion", "به نظر شما", "عبارت نظر. in my opinion هم برای جواب."]], "grammar": "organized by وصف مجهول کوتاه است. besides یعنی «علاوه بر» و با beside به معنی «کنار» فرق دارد."}, {"id": "l46", "n": 46, "en": "Garden", "fa": "باغ", "qa": [["Is there any garden that you like?", "باغی هست که دوست داشته باشید؟", "Yes, I love the strawberry garden in my neighborhood.", "بله، باغ توت‌فرنگی محله‌ام را دوست دارم."], ["Where is it?", "کجاست؟", "It's in the highland area where I live.", "در منطقهٔ کوهستانی که زندگی می‌کنم."], ["When did you first see it?", "اولین بار کی آن را دیدید؟", "I accidentally saw it when I had a picnic in the highlands.", "اتفاقی دیدمش وقتی در کوهستان پیک‌نیک داشتم."], ["What was planted in the garden?", "در باغ چه کاشته شده بود؟", "Strawberries, of course. There are also some boxes of cucumbers next to the strawberry beds.", "البته توت‌فرنگی. کنار کرت‌های توت‌فرنگی چند جعبه خیار هم هست."], ["Why do you like the garden?", "چرا باغ را دوست دارید؟", "I love picking red strawberries. The garden brings me closer to nature as well.", "چیدن توت‌فرنگی قرمز را دوست دارم. باغ مرا به طبیعت هم نزدیک‌تر می‌کند."], ["What is special about the garden?", "باغ چه ویژگی خاصی دارد؟", "The strawberries there are organic.", "توت‌فرنگی‌های آنجا ارگانیک‌اند."], ["How do people do the gardening?", "مردم باغبانی را چطور انجام می‌دهند؟", "Keeping the beds mulched is important, since it helps reduce water needs.", "مالچ کردن کرت‌ها مهم است، چون نیاز به آب را کم می‌کند."], ["How often do you visit the garden?", "چند وقت یک‌بار از باغ دیدن می‌کنید؟", "Just when I have leisure time, since I'm quite busy.", "فقط وقتی وقت آزاد دارم، چون نسبتاً سرم شلوغ است."], ["Is there any relation between the green garden and your mood?", "بین باغ سبز و حال شما رابطه‌ای هست؟", "Yes, at least for me. Green helps me chill out.", "بله، دست‌کم برای من. سبز بودن آرامم می‌کند."], ["Do you want to be a gardener?", "می‌خواهید باغبان شوید؟", "Honestly, no. I'm not used to manual work.", "صادقانه نه. به کار یدی عادت ندارم."]], "vocab": [["accidentally", "اتفاقی", "I accidentally saw it."], ["organic", "ارگانیک", "grown without synthetic chemicals."], ["mulch", "مالچ کردن", "پوشاندن خاک برای حفظ رطوبت. Keeping the beds mulched."], ["leisure time", "وقت آزاد", "when I have leisure time."], ["be used to", "عادت داشتن به", "I'm not used to manual work. بعد از used to اینجا اسم یا -ing می‌آید. با used to به معنی «قبلاً» فرق دارد."], ["manual work", "کار یدی", "work done by hand."]], "grammar": "دو used to را قاطی نکنید. I used to live here یعنی قبلاً اینجا زندگی می‌کردم و حالا نه. I'm used to manual work یعنی به کار یدی عادت دارم."}, {"id": "l47", "n": 47, "en": "Hometown", "fa": "زادگاه", "qa": [["Where is your hometown?", "زادگاهتان کجاست؟", "My hometown is a coastal state in the US.", "زادگاهم یک ایالت ساحلی در آمریکاست."], ["Is it the city or the countryside?", "شهر است یا روستا؟", "I live in a suburb.", "در حومه زندگی می‌کنم."], ["What's it known for?", "به چه چیز معروف است؟", "It's famous for tobacco.", "به توتون معروف است."], ["What do people do there?", "مردم آنجا چه می‌کنند؟", "Agriculture is the main industry in my hometown. Most people plant and sell tobacco.", "کشاورزی صنعت اصلی زادگاهم است. بیشتر مردم توتون می‌کارند و می‌فروشند."], ["How is the atmosphere there?", "حال‌وهوای آنجا چطور است؟", "It's quite peaceful. I enjoy the fresh air here.", "نسبتاً آرام است. از هوای تازه اینجا لذت می‌برم."], ["How are people there?", "مردم آنجا چطورند؟", "They're friendly and hospitable.", "دوستانه و مهمان‌نوازند."], ["Would you like to live in your hometown or somewhere else?", "دوست دارید در زادگاهتان زندگی کنید یا جای دیگر؟", "I would like to live here. I just wish I could live here forever.", "دوست دارم اینجا زندگی کنم. کاش برای همیشه بتوانم اینجا بمانم."], ["Is it easy to find a job there?", "پیدا کردن کار آنجا آسان است؟", "Manual work is easy to find. I'm not sure about white-collar jobs.", "کار یدی راحت پیدا می‌شود. دربارهٔ کار پشت‌میزنشینی مطمئن نیستم."], ["Is it a good environment for young people?", "محیط خوبی برای جوان‌هاست؟", "I don't think so. The pace of life here is quite slow. If they want a dynamic environment, they'd better move to the city.", "فکر نمی‌کنم. سرعت زندگی اینجا کند است. اگر محیط پویا می‌خواهند، بهتر است به شهر بروند."], ["Is traffic congestion a big problem in your hometown?", "ازدحام ترافیک در زادگاهتان مشکل بزرگی است؟", "Not at all. We couldn't be happier with the traffic system here.", "اصلاً. از سیستم ترافیک اینجا بی‌نهایت راضی‌ایم."]], "vocab": [["coastal", "ساحلی", "a coastal state."], ["suburb", "حومه", "نه کاملاً شهر، نه کاملاً روستا. suburban صفت."], ["hospitable", "مهمان‌نواز", "friendly and hospitable."], ["white-collar", "پشت‌میزنشین، اداری", "در برابر blue-collar کار یدی."], ["had better", "بهتر است", "they'd better move. بعدش فعل ساده. منفی: had better not."], ["couldn't be happier", "از این راضی‌تر نمی‌شد", "عبارت تشدیدی به معنی خیلی راضی‌ام."]], "grammar": "I wish I could: wish با گذشته. they'd better + فعل ساده، بدون to. We couldn't be happier ساختار مثبتِ قوی با شکل منفی است."}, {"id": "l48", "n": 48, "en": "Clothing", "fa": "لباس", "qa": [["What is your favorite item of clothing?", "لباس مورد علاقه‌تان چیست؟", "My favorite is a maxi dress. I wear it when hanging out with friends or attending parties.", "مورد علاقه‌ام یک پیراهن بلند است. وقتی با دوستان بیرونم یا مهمانی می‌روم می‌پوشمش."], ["When did you buy it?", "کی خریدیدش؟", "My friend gave it to me as a birthday present when I turned 21.", "دوستم وقتی ۲۱ ساله شدم آن را هدیهٔ تولد داد."], ["Where did you buy it?", "کجا خریدیدش؟", "I had no idea where my close friend bought it.", "نمی‌دانستم دوست نزدیکم آن را از کجا خریده."], ["What color is it?", "چه رنگی است؟", "It's blue, my favorite color.", "آبی، رنگ مورد علاقه‌ام."], ["Was it expensive?", "گران بود؟", "Yes, I guess.", "حدس می‌زنم بله."], ["Why do you like it?", "چرا دوستش دارید؟", "I'm kind of short and plump, so it's hard to find a piece of clothing that fits me perfectly, but that one does. I also love the color and style.", "کمی کوتاه و تپل‌ام، برای همین سخت است لباسی پیدا کنم که کاملاً اندازه‌ام باشد، ولی آن یکی هست. رنگ و مدلش را هم دوست دارم."], ["Do clothes help build your personal brand?", "لباس به ساختن برند شخصی کمک می‌کند؟", "Yes, to some extent. I still believe a personal brand can be built from the inside rather than the outside. However, what you wear also plays an important role in saying who you are.", "تا حدی بله. باز هم باور دارم برند شخصی بیشتر از درون ساخته می‌شود تا بیرون. اما آنچه می‌پوشید هم در گفتن اینکه که هستید نقش مهمی دارد."], ["Have you seen anybody wearing unusual clothes?", "کسی را با لباس غیرعادی دیده‌اید؟", "Yes, I have, but I don't think any fashion style is weird. Everybody has their own taste in fashion.", "بله، ولی فکر نمی‌کنم هیچ سبک مدی عجیب باشد. هر کس سلیقهٔ خودش را دارد."], ["How has your fashion style changed recently?", "سبک لباس‌تان تازگی چطور عوض شده؟", "I always wore a formal shirt and trousers when I went out years ago, but now I wear casuals like jeans and a T-shirt.", "سال‌ها پیش برای بیرون رفتن همیشه پیراهن و شلوار رسمی می‌پوشیدم، ولی حالا لباس راحت مثل جین و تی‌شرت می‌پوشم."]], "vocab": [["maxi dress", "پیراهن بلند", "لباس زنانه تا مچ پا."], ["turn 21", "۲۱ ساله شدن", "when I turned 21."], ["fit", "اندازه بودن", "a piece that fits me. fit اینجا فعل است."], ["kind of", "تا حدی، یک‌جورایی", "غیررسمی. I'm kind of short."], ["rather than", "به‌جای، تا اینکه", "from the inside rather than the outside."], ["play a role in", "در چیزی نقش داشتن", "plays an important role in saying who you are."]], "grammar": "that one does یعنی آن لباس اندازه است؛ does جای fits me را می‌گیرد. taste in fashion: حرف اضافه in."}, {"id": "l49", "n": 49, "en": "Advertisement", "fa": "تبلیغات", "qa": [["What is your favorite advertisement?", "تبلیغ مورد علاقه‌تان چیست؟", "I'm quite impressed with the advertisement for Surf, a laundry detergent made by Unilever.", "از تبلیغ سرف، پودر لباسشویی یونیلیور، خیلی تحت تأثیرم."], ["Where did you see it?", "کجا آن را دیدید؟", "I accidentally saw it on TV 2 years ago.", "دو سال پیش اتفاقی در تلویزیون دیدمش."], ["What happened in the advertisement?", "در تبلیغ چه اتفاقی افتاد؟", "The ad told the story of a family in which the children all loved their stepmother because of the white shirts she prepared for them.", "تبلیغ داستان خانواده‌ای بود که بچه‌ها به‌خاطر پیراهن‌های سفیدی که نامادری برایشان آماده می‌کرد همه دوستش داشتند."], ["Why do you like it?", "چرا دوستش دارید؟", "I just can't stop loving the story in the ad. It's such a sweet story.", "نمی‌توانم از دوست داشتن داستان تبلیغ دست بردارم. داستان خیلی شیرینی است."], ["Was there any famous actor in the advertisement?", "بازیگر معروفی در تبلیغ بود؟", "Not at all. The actors were not very well known, I think.", "اصلاً. فکر می‌کنم بازیگرها خیلی معروف نبودند."], ["Did it attract much attention?", "توجه زیادی جلب کرد؟", "I have no idea, but I saw it in many public places.", "نمی‌دانم، ولی در جاهای عمومی زیاد دیدمش."], ["What do you like the most in the advertisement?", "در تبلیغ چه چیزی را بیشتر دوست دارید؟", "The vivid images and sound effects attracted me.", "تصویر زنده و جلوه‌های صوتی جذبم کرد."], ["Do you believe in advertisements?", "به تبلیغ‌ها باور دارید؟", "Not really. Ads always say good things and neglect to mention bad things about a product, for obvious reasons.", "نه واقعاً. تبلیغ همیشه خوبی‌ها را می‌گوید و بدی‌های محصول را، به دلایل واضح، جا می‌اندازد."], ["How have advertisements changed recently?", "تبلیغ‌ها تازگی چطور عوض شده‌اند؟", "They're more modern. Digital marketing has proved successful in many fields.", "مدرن‌تر شده‌اند. بازاریابی دیجیتال در خیلی حوزه‌ها موفق از آب درآمده."]], "vocab": [["be impressed with", "تحت تأثیر بودن", "impressed with the ad. by هم ممکن است."], ["detergent", "پودر/مایع شوینده", "laundry detergent."], ["can't stop + -ing", "نمی‌توان دست کشید از", "I can't stop loving the story."], ["neglect to", "کوتاهی کردن در", "neglect to mention bad things."], ["for obvious reasons", "به دلایل واضح", "عبارت آماده برای توضیح بدیهی."], ["digital marketing", "بازاریابی دیجیتال", "has proved successful."]], "grammar": "such a sweet story: such + a + صفت + اسم. so sweet a story ممکن است ولی such a رایج‌تر است. for obvious reasons آخر جمله طبیعی است."}, {"id": "l50", "n": 50, "en": "Project", "fa": "پروژه", "qa": [["What project did you work on?", "روی چه پروژه‌ای کار کردید؟", "I made an English poster about our environment.", "پوستر انگلیسی دربارهٔ محیط زیستمان ساختم."], ["Was that an indoor or outdoor project?", "پروژه داخل بود یا بیرون؟", "The project was carried out mostly outdoors. Only the last phase was conducted indoors.", "پروژه بیشتر بیرون انجام شد. فقط مرحلهٔ آخر داخل انجام شد."], ["Who was involved in the project?", "چه کسانی در پروژه دخیل بودند؟", "My teammates and an advisory teacher.", "هم‌تیمی‌هایم و یک معلم مشاور."], ["What did you do?", "چه کردید؟", "We had a field trip to the countryside, where we studied insects and plants.", "به روستا اردو رفتیم و آنجا حشره و گیاه را بررسی کردیم."], ["Was it a successful project?", "پروژه موفق بود؟", "Yes. We received compliments from our professor.", "بله. از استادمان تعریف شنیدیم."], ["Who was your advisory teacher?", "معلم مشاورتان که بود؟", "Our Science teacher, Mr. John. We learned a lot from him.", "معلم علوم‌مان، آقای جان. از او خیلی یاد گرفتیم."], ["What did you learn after the project?", "بعد از پروژه چه یاد گرفتید؟", "I learned how to write content and decorate posters.", "یاد گرفتم چطور متن بنویسم و پوستر را تزئین کنم."], ["Did you like your partners?", "شریک‌هایتان را دوست داشتید؟", "Yes. Most of them were friendly and responsible. I particularly liked Michael, the leader of my team.", "بله. بیشترشان دوستانه و مسئولیت‌پذیر بودند. به‌خصوص مایکل، رهبر تیم، را دوست داشتم."], ["What did you get after the project?", "بعد از پروژه چه به دست آوردید؟", "After the project, I knew how to work in a team and cooperate well with my teammates.", "بعد از پروژه بلد بودم در تیم کار کنم و با هم‌تیمی‌ها خوب همکاری کنم."]], "vocab": [["carry out / conduct", "انجام دادن", "was carried out مجهول. conducted هم همین معنی را دارد."], ["phase", "مرحله", "the last phase."], ["field trip", "اردوی علمی", "a field trip to the countryside."], ["compliment", "تعریف، تحسین", "receive compliments. با complement به معنی کامل‌کننده فرق دارد."], ["particularly", "به‌خصوص", "I particularly liked Michael."], ["cooperate with", "همکاری کردن با", "cooperate with teammates."]], "grammar": "در حاشیهٔ این صفحه کتاب، گذشتهٔ استمراری مجهول آمده: she was teaching me / I was being taught. was being conducted، was being helped. being شکل -ing مجهول است."}, {"id": "l51", "n": 51, "en": "Wedding", "fa": "عروسی", "qa": [["Have you ever attended someone's wedding? Who was it?", "تا حالا به عروسی کسی رفته‌اید؟ عروسی که بود؟", "Yes, many times, but the most memorable one was my best friend's.", "بله، بارها، ولی به‌یادماندنی‌ترینش مال بهترین دوستم بود."], ["Who went with you?", "چه کسی با شما آمد؟", "I went with one of my classmates.", "با یکی از هم‌کلاسی‌هایم رفتم."], ["Where was the wedding organized?", "عروسی کجا برگزار شد؟", "It was held in a restaurant downtown.", "در رستورانی در مرکز شهر برگزار شد."], ["What did people do at the wedding?", "در عروسی مردم چه کردند؟", "They enjoyed the wedding feast, sang and danced together after giving the couple their best wishes for lasting happiness.", "از ضیافت عروسی لذت بردند، خواندند و رقصیدند، بعد از اینکه به زوج آرزوی خوشبختی ماندگار کردند."], ["What did the bride and groom wear?", "عروس و داماد چه پوشیده بودند؟", "The bride wore a white wedding gown, while the groom wore a black suit and tie.", "عروس لباس سفید عروس پوشیده بود، در حالی که داماد کت‌وشلوار مشکی و کراوات."], ["What was the most interesting ritual at the wedding?", "جالب‌ترین آیین عروسی چه بود؟", "Exchanging rings is the ritual I'm quite interested in.", "تعویض حلقه آیینی است که خیلی به آن علاقه‌مندم."], ["Are weddings a special event in your country?", "عروسی در کشور شما رویداد خاصی است؟", "Yes, along with birthdays.", "بله، همراه با تولد."], ["Do people in your country get married early?", "در کشور شما مردم زود ازدواج می‌کنند؟", "Not really. The average age to get married is 27 for women and 29 for men.", "نه واقعاً. میانگین سن ازدواج برای زن‌ها ۲۷ و برای مردها ۲۹ است."], ["What is the ideal age to get married, in your opinion?", "به نظر شما سن ایدئال ازدواج چیست؟", "Well, 27 would be my ideal age. Women are often charming and mature at that age, I guess.", "۲۷ سن ایدئال من است. حدس می‌زنم زن‌ها در آن سن اغلب جذاب و بالغ‌اند."], ["How has the wedding changed recently?", "عروسی تازگی چطور عوض شده؟", "The most noticeable change is the reduction of rituals. There used to be more steps in weddings years ago than there are now.", "مشهودترین تغییر کم شدن آیین‌هاست. سال‌ها پیش عروسی مرحله‌های بیشتری داشت."]], "vocab": [["bride / groom", "عروس / داماد", "bride زن، groom مرد."], ["wedding gown", "لباس عروس", "a white wedding gown."], ["ritual", "آیین", "exchanging rings is a ritual."], ["average age", "سن میانگین", "The average age to get married."], ["used to", "قبلاً بوده و حالا نیست", "There used to be more steps."], ["noticeable", "مشهود", "the most noticeable change."]], "grammar": "There used to be برای وجود در گذشته. than there are now مقایسه با حال است. downtown قید یا اسم مکان است: in a restaurant downtown."}, {"id": "l52", "n": 52, "en": "Coffee Shop", "fa": "کافی‌شاپ", "qa": [["What's your favorite coffee shop?", "کافی‌شاپ مورد علاقه‌تان چیست؟", "My favorite is The Coffee House, a local coffee shop in my neighborhood.", "مورد علاقه‌ام کافی‌هاوس است، کافی‌شاپ محلی محله‌ام."], ["Where is it?", "کجاست؟", "It's 500 meters from my house.", "۵۰۰ متر از خانه‌ام فاصله دارد."], ["How often do you visit that coffee shop?", "چند وقت یک‌بار به آن کافی‌شاپ می‌روید؟", "Every weekend when I hang out with my friends. The Coffee House is always our first choice.", "هر آخر هفته که با دوستانم بیرونم. کافی‌هاوس همیشه انتخاب اولمان است."], ["Who do you go with?", "با چه کسی می‌روید؟", "I meet my friends there. They love the place too.", "دوستانم را آنجا می‌بینم. آن‌ها هم آنجا را دوست دارند."], ["What drinks does it serve?", "چه نوشیدنی‌هایی می‌دهد؟", "Many kinds: coffee, chocolate, cocktails, smoothies, tea and juice of various flavors. My favorite is hot chocolate.", "انواع زیاد: قهوه، شکلات، کوکتل، اسموتی، چای و آب‌میوه با طعم‌های مختلف. مورد علاقه‌ام شکلات داغ است."], ["Are the waiters there friendly?", "پیشخدمت‌ها دوستانه هستند؟", "Yes, they couldn't be nicer.", "بله، از این بهتر نمی‌شوند."], ["Do you like the decorations of that coffee shop?", "تزئینات آن کافی‌شاپ را دوست دارید؟", "Yes, I love them. I like the green space they put in each corner of the room.", "بله. فضای سبزی را که در هر گوشهٔ اتاق گذاشته‌اند دوست دارم."], ["When was the last time you went there?", "آخرین بار کی آنجا رفتید؟", "I last went there last Monday.", "دوشنبهٔ پیش آخرین بار آنجا رفتم."], ["What is special about that coffee shop?", "آن کافی‌شاپ چه ویژگی خاصی دارد؟", "The drinks are what make them different. People are addicted to the full-bodied coffee and chocolate there.", "نوشیدنی‌ها وجه تمایزشان است. مردم به قهوه و شکلات پرمایهٔ آنجا معتادند."], ["How do you know about that coffee shop?", "آن کافی‌شاپ را از کجا می‌شناسید؟", "My cousin recommended it to me, and I did give it a try.", "پسرعمویم پیشنهاد کرد و من هم امتحانش کردم."]], "vocab": [["serve", "سرو کردن", "What drinks does it serve?"], ["couldn't be nicer", "از این بهتر نمی‌شود", "تعریف قوی با شکل منفی."], ["full-bodied", "پرمایه، غلیظ", "برای طعم قهوه یا شراب."], ["give it a try", "امتحان کردن", "I did give it a try. did برای تأکید است."], ["recommend something to someone", "چیزی را به کسی پیشنهاد کردن", "recommended it to me."], ["I last went", "آخرین بار رفتم", "last اینجا قید است، نه صفت."]], "grammar": "I did give it a try: did تأکیدی است، یعنی واقعاً امتحان کردم. they couldn't be nicer همان الگوی couldn't be happier است."}, {"id": "l53", "n": 53, "en": "Culture", "fa": "فرهنگ", "qa": [["Which culture do you belong to?", "به کدام فرهنگ تعلق دارید؟", "I was born and raised in America, where my culture was shaped.", "در آمریکا به دنیا آمدم و بزرگ شدم، جایی که فرهنگم شکل گرفت."], ["Is that a multicultural society?", "جامعهٔ چندفرهنگی است؟", "Yes, it is. My culture is a diverse mix of customs and traditions of various races and ethnicities.", "بله. فرهنگ من آمیزهٔ متنوع رسم و سنت نژادها و قومیت‌های گوناگون است."], ["How long has your country been practicing those customs?", "کشور شما چقدر است این رسم‌ها را اجرا می‌کند؟", "It has a long history. Some traditions go back thousands of years.", "تاریخ طولانی دارد. بعضی سنت‌ها به هزاران سال پیش برمی‌گردد.", "go back thousands of years", "متن اصلی around 10,000 years ago برای همهٔ رسم‌های آمریکا دقیق نیست."], ["What custom do you like the most?", "کدام رسم را بیشتر دوست دارید؟", "I like practicing dining etiquette. That's what makes me feel American whenever I travel.", "رعایت آداب غذا خوردن را دوست دارم. همین است که هر وقت سفر می‌کنم حس آمریکایی بودن می‌دهد."], ["What are traditional costumes of men and women in your country?", "لباس سنتی مرد و زن در کشور شما چیست؟", "Cowboy hats and boots are American styles, but nowadays jeans and a T-shirt are more common.", "کلاه و چکمهٔ کابوی سبک آمریکایی است، ولی امروزه جین و تی‌شرت رایج‌تر است."], ["Are you comfortable with the traditions and customs of your culture?", "با سنت و رسم فرهنگتان راحتید؟", "Of course. I was born with it.", "البته. با آن به دنیا آمده‌ام."], ["How do people greet each other?", "مردم چطور به هم سلام می‌کنند؟", "It depends on the situation. In informal communication, people just say hi.", "بستگی به موقعیت دارد. در ارتباط غیررسمی فقط می‌گویند های."], ["Have you ever felt drawn to another land?", "تا حالا به سرزمین دیگری کشیده شده‌اید؟", "Yes, I'm interested in Indian culture. I wish I could get there someday to attend a typical Indian wedding.", "بله، به فرهنگ هند علاقه‌مندم. کاش یک روز بتوانم بروم و در عروسی نمونهٔ هندی شرکت کنم."]], "vocab": [["born and raised", "زاده و بزرگ‌شده", "I was born and raised in America."], ["custom / tradition", "رسم / سنت", "custom عادت اجتماعی، tradition سنت منتقل‌شده. practice هم به معنی رویه است."], ["etiquette", "آداب", "dining etiquette آداب سفره."], ["costume", "لباس مخصوص، لباس سنتی", "با custom رسم قاطی نشود."], ["feel drawn to", "به چیزی کشیده شدن", "felt drawn to another land."], ["I wish I could / I wish I had", "کاش می‌توانستم / کاش دیده بودم", "در حاشیهٔ کتاب: I wish I could see him حال غیرواقع؛ I wish I had seen him حسرت گذشته."]], "grammar": "wish را از حاشیهٔ همین درس تمرین کنید. I wish I saw him هم برای آرزوی حال ممکن است، ولی could رایج‌تر است. I wish I would see him کمتر طبیعی است. dialect، belief، attire و vintage واژه‌های حاشیه‌اند: گویش، باور، پوشش، قدیمیِ باارزش."}, {"id": "l54", "n": 54, "en": "Transport", "fa": "حمل‌ونقل", "qa": [["What is the most popular means of transport in your country?", "رایج‌ترین وسیلهٔ حمل‌ونقل در کشور شما چیست؟", "Most people in my country travel by car.", "بیشتر مردم کشورم با ماشین سفر می‌کنند."], ["How do you go to school or work?", "چطور به مدرسه یا سر کار می‌روید؟", "I prefer the bus because of its convenience. I enjoy reading books while sitting on the bus.", "اتوبوس را به‌خاطر راحتی ترجیح می‌دهم. دوست دارم نشسته در اتوبوس کتاب بخوانم."], ["How often do you take the bus?", "چند وقت یک‌بار اتوبوس می‌گیرید؟", "Every day. I went to school by bus two years ago, and the bus is still my best choice.", "هر روز. دو سال پیش با اتوبوس مدرسه می‌رفتم و هنوز بهترین انتخاب من است."], ["Do people in your country like traveling by bus?", "مردم کشور شما سفر با اتوبوس را دوست دارند؟", "Not really. They have their own cars.", "نه واقعاً. ماشین خودشان را دارند."], ["What are some benefits of traveling by bicycle?", "فایدهٔ سفر با دوچرخه چیست؟", "It's a good way of doing exercise. We can protect our environment as well.", "راه خوبی برای ورزش است. محیط زیست را هم می‌توانیم حفظ کنیم."], ["Do you prefer public transport or private transport?", "حمل‌ونقل عمومی را ترجیح می‌دهید یا خصوصی؟", "Public transport is much cheaper.", "حمل‌ونقل عمومی خیلی ارزان‌تر است."], ["Do you think buses should replace other means of transport?", "فکر می‌کنید اتوبوس باید جای وسایل دیگر را بگیرد؟", "Sure. In the future, buses should be used widely by commuters.", "حتماً. در آینده مسافران روزانه باید گسترده از اتوبوس استفاده کنند."], ["What does the government do to encourage people to use public transport?", "دولت برای تشویق مردم به حمل‌ونقل عمومی چه می‌کند؟", "It's a good idea to make public transport as convenient as private transport. Besides, more campaigns should be launched to raise awareness of protecting the environment.", "ایدهٔ خوبی است که حمل‌ونقل عمومی به اندازهٔ خصوصی راحت شود. علاوه بر این، کمپین بیشتری برای بالا بردن آگاهی محیط زیست باید راه بیفتد."], ["How has transport changed recently?", "حمل‌ونقل تازگی چطور عوض شده؟", "There are more cars in a household now than before, which partly leads to traffic jams in some big cities.", "حالا در هر خانه ماشین بیشتری هست و همین تا حدی در بعضی شهرهای بزرگ ترافیک ایجاد می‌کند."]], "vocab": [["means of transport", "وسیلهٔ حمل‌ونقل", "means مفرد و جمع یک شکل است. by car بدون the."], ["commuter", "مسافر روزانه", "کسی که هر روز بین خانه و کار رفت‌وآمد می‌کند."], ["as convenient as", "به اندازهٔ ... راحت", "as + صفت + as برای برابری."], ["launch a campaign", "کمپین راه انداختن", "مجهول: campaigns should be launched."], ["partly", "تا حدی", "which partly leads to traffic jams."], ["car pool", "هم‌سفری با یک ماشین", "واژهٔ حاشیه. car pool یعنی چند نفر با یک ماشین بروند تا آلودگی کمتر شود."]], "grammar": "در حاشیه واژه‌های useful هست: modern means، shabby کهنه، preference ترجیح، precisely دقیقاً. should be used مجهول پیشنهادی است."}, {"id": "l55", "n": 55, "en": "Politician", "fa": "سیاستمدار", "qa": [["Who is your favorite politician?", "سیاستمدار مورد علاقه‌تان کیست؟", "She's Hillary Diane Rodham Clinton, an American politician.", "هیلاری داین رادم کلینتون، سیاستمدار آمریکایی."], ["Where is she from?", "اهل کجاست؟", "She comes from the USA.", "اهل آمریکاست."], ["Does she appear on TV?", "در تلویزیون ظاهر می‌شود؟", "Yes, quite often. She usually shows up on TV in news programs.", "بله، نسبتاً زیاد. معمولاً در برنامه‌های خبری تلویزیون دیده می‌شود."], ["What is appealing about her?", "چه چیز جذابی دربارهٔ او هست؟", "She's a Democratic politician.", "سیاستمدار حزب دموکرات است."], ["Is she famous?", "معروف است؟", "Yes, she's well known all over the world.", "بله، در سراسر جهان شناخته‌شده است."], ["Does she have a great influence on people?", "نفوذ زیادی روی مردم دارد؟", "Yes, I think so. She fights for human rights. She has a controversial and influential speech: human rights are women's rights and women's rights are human rights.", "فکر می‌کنم بله. برای حقوق بشر می‌جنگد. سخن جنجالی و تأثیرگذاری دارد: حقوق بشر حقوق زنان است و حقوق زنان حقوق بشر."], ["Do you want to be like her?", "می‌خواهید مثل او باشید؟", "Being a politician has never been my dream, actually.", "در واقع سیاستمدار شدن هرگز رؤیای من نبوده."], ["Why do you admire her?", "چرا تحسینش می‌کنید؟", "She's one of the few women who succeed in politics.", "یکی از معدود زنانی است که در سیاست موفق می‌شوند."], ["What did she do that you can tell others?", "چه کاری کرده که بتوانید به دیگران بگویید؟", "A lot of things. She cares about people's health. She also tackles the issues of adoption and family safety.", "خیلی چیزها. به سلامت مردم اهمیت می‌دهد. به مسئلهٔ فرزندخواندگی و امنیت خانواده هم رسیدگی می‌کند."]], "vocab": [["show up", "پیدا شدن، حاضر شدن", "shows up on TV."], ["appealing", "جذاب", "What is appealing about her?"], ["influence on", "نفوذ روی", "have an influence on people. حرف اضافه on."], ["controversial", "جنجالی", "a controversial speech."], ["one of the few", "یکی از معدود", "one of the few women who succeed. فعل بعد از who با women جمع جور است."], ["tackle an issue", "به مسئله رسیدگی کردن", "tackles the issues of adoption."]], "grammar": "human rights جمع است. who succeed نه succeeds، چون women جمع است. این تطابق در one of the خیلی غلط‌ساز است."}, {"id": "l56", "n": 56, "en": "Communication", "fa": "ارتباط", "qa": [["What are your favorite means of communication?", "وسیلهٔ ارتباطی مورد علاقه‌تان چیست؟", "I prefer talking directly to people.", "ترجیح می‌دهم رو در رو با مردم حرف بزنم."], ["How do you keep in touch with your friends?", "چطور با دوستانتان در تماس می‌مانید؟", "I'm so busy that I don't often hang out with friends, so I usually get in touch with them using social networks or the phone.", "آن‌قدر سرم شلوغ است که اغلب با دوستان بیرون نمی‌روم، برای همین معمولاً با شبکهٔ اجتماعی یا تلفن با آن‌ها تماس می‌گیرم."], ["Do you get in touch with your family by phone?", "با خانواده‌تان تلفنی در تماسید؟", "Yes, I do. I live away from my family, so the phone is an ideal means of communication.", "بله. دور از خانواده زندگی می‌کنم، پس تلفن وسیلهٔ ایدئال ارتباط است."], ["Do you usually write letters or emails?", "معمولاً نامه می‌نویسید یا ایمیل؟", "I used to write letters when the Internet wasn't widely used. Now I prefer emails because of their convenience.", "وقتی اینترنت گسترده نبود نامه می‌نوشتم. حالا به‌خاطر راحتی ایمیل را ترجیح می‌دهم."], ["What are some advantages of using a mobile phone?", "چند مزیت تلفن همراه چیست؟", "That's the easiest means of communication, I think. Mobile phones are portable. Just dial the number and you can immediately get connected with anyone you want.", "فکر می‌کنم آسان‌ترین وسیلهٔ ارتباط است. تلفن همراه قابل حمل است. فقط شماره را بگیرید و فوری به هر که بخواهید وصل می‌شوید."], ["Do you like handwriting letters?", "نامهٔ دست‌نویس را دوست دارید؟", "Yes, I do. I like to keep handwritten letters as keepsakes.", "بله. دوست دارم نامه‌های دست‌نویس را یادگاری نگه دارم."], ["Do you use social networks?", "از شبکهٔ اجتماعی استفاده می‌کنید؟", "Yes. Young people can hardly live without social networks now.", "بله. جوان‌ها حالا تقریباً بدون شبکهٔ اجتماعی نمی‌توانند زندگی کنند."], ["Do you need communication skills when using social networks?", "در شبکهٔ اجتماعی هم مهارت ارتباطی لازم است؟", "Sure. Even on social networks.", "حتماً. حتی در شبکهٔ اجتماعی."], ["How have social networks changed communication?", "شبکهٔ اجتماعی ارتباط را چطور عوض کرده؟", "People prefer talking online rather than directly. Because of the illusion of social networks, people tend to forget the skills needed to communicate in real life.", "مردم حرف آنلاین را به رو در رو ترجیح می‌دهند. به‌خاطر توهم شبکه‌های اجتماعی، مهارت لازم برای ارتباط در زندگی واقعی را فراموش می‌کنند."], ["Do you have good communication skills, in your opinion?", "به نظر خودتان مهارت ارتباطی خوبی دارید؟", "Maybe yes. People are quite happy talking to me.", "شاید بله. مردم از حرف زدن با من نسبتاً راضی‌اند."]], "vocab": [["keep in touch / get in touch", "در تماس ماندن / تماس گرفتن", "keep ادامه است، get شروع تماس."], ["means of communication", "وسیلهٔ ارتباط", "means مفرد و جمع یک شکل است."], ["portable", "قابل حمل", "Mobile phones are portable."], ["keepsake", "یادگاری", "keep letters as keepsakes."], ["can hardly", "تقریباً نمی‌تواند", "can hardly live without. hardly منفی‌ساز است، not اضافه نگذارید."], ["illusion", "توهم", "the illusion of social networks."]], "grammar": "حاشیهٔ درس واژه‌های useful دارد: family tie پیوند خانوادگی، intimate صمیمی، verbal communication ارتباط کلامی، nonverbal communication ارتباط غیرکلامی، to be honest راستش را بخواهید."}, {"id": "l57", "n": 57, "en": "Business", "fa": "کسب‌وکار", "qa": [["Are you studying or working?", "درس می‌خوانید یا کار می‌کنید؟", "I left school 3 years ago. I'm working now.", "۳ سال پیش مدرسه را تمام کردم. حالا کار می‌کنم."], ["Are you self-employed or working for a company?", "خویش‌فرما هستید یا برای شرکت کار می‌کنید؟", "I'm self-employed. I used to work for a company 2 years ago.", "خویش‌فرما هستم. دو سال پیش برای شرکت کار می‌کردم."], ["Are you running any business?", "کسب‌وکاری را اداره می‌کنید؟", "Yes, I'm running a small business.", "بله، کسب‌وکار کوچکی را اداره می‌کنم."], ["What does your business sell?", "کسب‌وکارتان چه می‌فروشد؟", "I make and sell handmade cosmetics.", "لوازم آرایشی دست‌ساز می‌سازم و می‌فروشم."], ["Do you have any difficulty running that business?", "در ادارهٔ آن کسب‌وکار مشکلی دارید؟", "Yes, I had some difficulties attracting customers at first, but everything is getting better now.", "بله، اول در جذب مشتری مشکل داشتم، ولی حالا همه‌چیز بهتر می‌شود."], ["Is that an online or offline business?", "کسب‌وکار آنلاین است یا حضوری؟", "I sell products online. It's easier selling online than offline because I can take full advantage of my social network.", "محصول را آنلاین می‌فروشم. فروش آنلاین از حضوری آسان‌تر است چون می‌توانم کامل از شبکهٔ اجتماعی‌ام استفاده کنم."], ["When did you start the business?", "کسب‌وکار را کی شروع کردید؟", "I started running my own business 2 years ago.", "دو سال پیش کسب‌وکار خودم را شروع کردم."], ["What are some advantages of running your own business?", "چند مزیت ادارهٔ کسب‌وکار خودتان چیست؟", "I can take some days off whenever I feel tired, and I can make much more money compared with working for a company.", "هر وقت خسته شوم می‌توانم چند روز مرخصی بگیرم، و در مقایسه با کار برای شرکت پول خیلی بیشتری درمی‌آورم."]], "vocab": [["self-employed", "خویش‌فرما", "در برابر working for a company."], ["run a business", "کسب‌وکار را اداره کردن", "I'm running a small business."], ["at first", "در ابتدا", "at first ... but now."], ["take full advantage of", "کامل بهره بردن از", "take full advantage of my network."], ["take a day off", "مرخصی گرفتن", "take some days off."], ["compared with", "در مقایسه با", "compared with working for a company."]], "grammar": "used to work for a company یعنی قبلاً کارمند بود و حالا نیست. difficulty attracting: بعد از difficulty فعل -ing طبیعی است."}, {"id": "l58", "n": 58, "en": "Computer", "fa": "رایانه", "qa": [["Do you have your own computer?", "رایانهٔ خودتان را دارید؟", "Yes, I owned a personal laptop when I was at university.", "بله، وقتی دانشگاه بودم لپ‌تاپ شخصی داشتم."], ["How often do you use the computer?", "چند وقت یک‌بار از رایانه استفاده می‌کنید؟", "Almost every day. I can't work without a computer.", "تقریباً هر روز. بدون رایانه نمی‌توانم کار کنم."], ["Have you ever joined any computer class?", "تا حالا کلاس رایانه رفته‌اید؟", "Yes, years ago. I learned Microsoft Word and Excel.", "بله، سال‌ها پیش. ورد و اکسل مایکروسافت را یاد گرفتم."], ["What do you use the computer for?", "رایانه را برای چه استفاده می‌کنید؟", "I'm an accountant, so managing business records is much easier for me with a computer.", "حسابدارم، پس مدیریت سندهای کاری با رایانه برایم خیلی آسان‌تر است."], ["What are some advantages of using the computer?", "چند مزیت استفاده از رایانه چیست؟", "With a computer connected to the Internet, we can shop, pay bills or do bank transactions online. Listening to music and watching movies are even more convenient.", "با رایانهٔ وصل به اینترنت می‌توانیم خرید کنیم، قبض بدهیم یا تراکنش بانکی آنلاین انجام دهیم. موسیقی و فیلم هم راحت‌تر است."], ["Do you use other high-tech devices besides computers?", "جز رایانه دستگاه پیشرفتهٔ دیگری استفاده می‌کنید؟", "Yes. Apart from a computer, I also use a smartphone.", "بله. جدا از رایانه، گوشی هوشمند هم استفاده می‌کنم."], ["Should children learn how to use the computer?", "کودکان باید کار با رایانه را یاد بگیرند؟", "Yes, I think so. Children should be given chances to approach the computer, but under their parents' control.", "فکر می‌کنم بله. باید به کودکان فرصت نزدیک شدن به رایانه داده شود، ولی زیر نظر والدین."]], "vocab": [["can't ... without", "بدون ... نمی‌توانم", "I can't work without a computer."], ["accountant", "حسابدار", "مدیر سند مالی."], ["transaction", "تراکنش", "bank transactions."], ["apart from", "جدا از", "Apart from a computer, I use a smartphone."], ["under control", "تحت نظارت", "under their parents' control."], ["be given a chance", "فرصت داده شدن", "مجهول. Children should be given chances."]], "grammar": "should be given مجهول پیشنهادی است. approach the computer اینجا یعنی با آن آشنا شوند؛ get access to هم طبیعی است."}, {"id": "l59", "n": 59, "en": "Exercise", "fa": "ورزش و تمرین", "qa": [["Do you usually exercise?", "معمولاً ورزش می‌کنید؟", "Yes, I do. Doing exercise is one of my good habits.", "بله. ورزش کردن یکی از عادت‌های خوب من است."], ["What sport do you play?", "چه ورزشی بازی می‌کنید؟", "Swimming is my favorite. I also play tennis.", "شنا مورد علاقهٔ من است. تنیس هم بازی می‌کنم."], ["How often do you exercise?", "چند وقت یک‌بار ورزش می‌کنید؟", "I go jogging almost every day before breakfast.", "تقریباً هر روز پیش از صبحانه می‌دوم."], ["When did you start doing exercise?", "کی ورزش را شروع کردید؟", "Just last year, actually.", "در واقع همین پارسال."], ["Is there anyone who does exercise with you?", "کسی هست که با شما ورزش کند؟", "I go jogging with my older brother. He's good company.", "با برادر بزرگ‌ترم می‌دوم. همراه خوبی است."], ["What benefits can you get from exercising?", "از ورزش چه فایده‌ای می‌برید؟", "A lot. Exercise helps reduce fat and build muscles. It also keeps me mentally awake during the whole day.", "زیاد. ورزش کمک می‌کند چربی کم شود و عضله ساخته شود. تمام روز هم از نظر ذهنی بیدار نگهم می‌دارد."], ["Where do you exercise?", "کجا ورزش می‌کنید؟", "At a nearby park. There are some exercise machines for people to use.", "در پارک نزدیک. چند دستگاه ورزشی برای استفادهٔ مردم هست."], ["Why do you exercise?", "چرا ورزش می‌کنید؟", "I like moving. For me, life without moving is like a picture without color.", "حرکت را دوست دارم. برای من زندگی بدون حرکت مثل عکس بی‌رنگ است."], ["Do people in your country do much exercise?", "مردم کشور شما زیاد ورزش می‌کنند؟", "I don't think so. They're so busy working that they forget to exercise.", "فکر نمی‌کنم. آن‌قدر سر کار شلوغ‌اند که ورزش را فراموش می‌کنند."], ["What if people don't do enough exercise?", "اگر مردم به اندازه ورزش نکنند چه؟", "Obviously, they'll gain weight fast and become obese.", "بدیهی است زود وزن اضافه می‌کنند و چاق می‌شوند."]], "vocab": [["good company", "همراه خوب", "He's good company. company اینجا یعنی همراه، نه شرکت."], ["build muscles", "عضله ساختن", "reduce fat and build muscles."], ["What if", "اگر ... چه می‌شود", "برای نتیجهٔ فرضی. What if people don't exercise?"], ["gain weight", "وزن اضافه کردن", "they'll gain weight. متضاد lose weight."], ["obese", "چاق بیمارگونه", "قوی‌تر از fat. become obese."], ["so ... that", "آن‌قدر ... که", "so busy that they forget."]], "grammar": "exercise هم اسم است هم فعل. do exercise یا exercise هر دو درست است. so ... that نتیجه را نشان می‌دهد."}, {"id": "l60", "n": 60, "en": "Goal / Ambition", "fa": "هدف و جاه‌طلبی", "qa": [["What is your current short-term goal?", "هدف کوتاه‌مدت فعلی‌تان چیست؟", "I'm determined to get a scholarship to study for a postgraduate degree abroad.", "مصمم‌ام بورس بگیرم و تحصیلات تکمیلی را خارج بخوانم."], ["When did you start thinking about this goal?", "کی به این هدف فکر کردید؟", "I started thinking about it when I left university.", "وقتی دانشگاه را تمام کردم به آن فکر کردم."], ["What difficulties do you have in order to achieve it?", "برای رسیدن به آن چه مشکلی دارید؟", "After spending a lot of time searching, I haven't found any scholarship that fits my needs.", "بعد از وقت زیاد برای جست‌وجو، بورسی که با نیازم جور باشد پیدا نکرده‌ام."], ["Do you need any help to achieve that goal?", "برای رسیدن به آن هدف کمکی لازم دارید؟", "I really need spiritual encouragement from my family and friends.", "واقعاً به دلگرمی خانواده و دوستان نیاز دارم."], ["Do your parents support you to achieve that goal?", "والدینتان برای رسیدن به آن هدف حمایتتان می‌کنند؟", "Yes, they do. They're always by my side and support me when needed.", "بله. همیشه کنارم هستند و هر وقت لازم باشد حمایتم می‌کنند."], ["Do you think it's important to set goals?", "فکر می‌کنید هدف گذاشتن مهم است؟", "Sure. We all need some goals to drive ourselves towards them. Setting goals is a necessary
