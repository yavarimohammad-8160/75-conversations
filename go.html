<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۷۵ مکالمه</title>
</head>
<body style="font-family:Tahoma,sans-serif;background:#f3eee6;text-align:center;padding:48px 20px">
<p id="msg">در حال باز کردن فهرست ۷۵ درس...</p>
<script>
(async function(){
  var pageUrl = 'https://cdn.jsdelivr.net/gh/yavarimohammad-8160/75-conversations@6d3b58fb9566473539aeed2751d8b1290ddb7079/index.html';
  var cssUrl = 'https://cdn.jsdelivr.net/gh/yavarimohammad-8160/75-conversations@6d3b58fb9566473539aeed2751d8b1290ddb7079/app.css';
  var extra = '.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0e3331;color:#fff;padding:12px 14px 18px}' +
    '.player .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}' +
    '.player button,.player select{min-height:48px;border-radius:14px;padding:14px 8px;font-size:16px;border:0;background:rgba(255,255,255,.16);color:#fff}' +
    '.player button.main{background:#c4a15a;color:#1c1915;font-weight:700}' +
    '.player button.stop{background:#b42318;color:#fff}' +
    '.wrap{padding-bottom:160px}' +
    '.note,.vocab{unicode-bidi:plaintext}' +
    '.enblock,.vocab .w{direction:ltr;unicode-bidi:isolate}';
  try {
    var pageRes = await fetch(pageUrl);
    var page = await pageRes.text();
    var css = '';
    try { css = await (await fetch(cssUrl)).text(); } catch (e) {}
    if (page.indexOf('LESSONS') < 0) throw new Error('no lessons');
    page = page.replace('const LESSONS =', 'window.LESSONS =');
    page = page.replace('<link rel="stylesheet" href="app.css">', '<style>' + css + extra + '</style>');
    page = page.replace('پخش همه', 'پخش / توقف');
    page = page.replace('id="stopBtn"', 'id="stopBtn" class="stop"');
    page = page.replace('rate: 0.92', 'rate: 0.7');
    page = page.replace('value="0.75"', 'value="0.5"');
    page = page.replace('>آهسته<', '>خیلی آهسته<');
    page = page.replace('value="0.92" selected', 'value="0.7" selected');
    page = page.replace('value="1.1"', 'value="0.9"');
    page = page.replace('value="1.25"', 'value="1.1"');
    page = page.replace('u.rate = tts.rate;', 'u.rate = Number(tts.rate) || 0.7; u.volume = 1;');
    document.open();
    document.write(page);
    document.close();
  } catch (e) {
    document.getElementById('msg').innerHTML = 'بارگذاری نشد. این لینک را باز کنید:<br><br>https://cdn.jsdelivr.net/gh/yavarimohammad-8160/75-conversations@' + '3202c5d/go.html';
  }
})();
</script>
</body>
</html>
